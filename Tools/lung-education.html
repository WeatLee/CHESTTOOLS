<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>肺部衛教模型｜初版</title>
  <style>:root{font-family:"Segoe UI","Microsoft JhengHei",sans-serif;color:#283c43;background:#f4f3ef}*{box-sizing:border-box}body{margin:0}.app{display:grid;grid-template-columns:340px 1fr;min-height:100vh}.sidebar{padding:24px 22px;background:#fffefa;border-right:1px solid #e6e4de;overflow:auto;max-height:100vh}.brand{display:flex;gap:12px;align-items:center}.brandmark{display:grid;place-items:center;width:38px;height:38px;border-radius:13px;background:#dcebe7;color:#53877d;font-size:24px}.brand small{color:#78918b;font-size:11px;letter-spacing:.09em}.brand h1{margin:2px 0 0;font-size:22px;letter-spacing:.03em}.intro{color:#738480;font-size:13px;line-height:1.6;margin:19px 0 22px}.panel{border-top:1px solid #ecebe6;padding:18px 0}.panel h2{font-size:14px;margin:0 0 13px;color:#385c59}.preset-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}button{cursor:pointer;font:inherit}.preset,.small-button,#resetView{border:1px solid #dde5e1;border-radius:9px;background:#fff;color:#45605d;padding:9px 10px}.preset.active,.action{background:#497f78;color:white;border-color:#497f78}.preset:hover,.small-button:hover,#resetView:hover{border-color:#7da79d}.switchrow{display:flex;align-items:center;justify-content:space-between;font-size:13px;padding:7px 0;color:#445655}.switchrow input{width:17px;height:17px;accent-color:#4b877d}.field{display:grid;gap:6px;font-size:13px;color:#546866}.field select{border:1px solid #d9e2de;border-radius:8px;padding:9px 8px;background:white;color:#334b49}.action{border:1px solid;border-radius:9px;width:100%;padding:9px;margin:11px 0}.action.on{background:#b86e5f;border-color:#b86e5f}.hint,.footnote{font-size:12px;line-height:1.55;color:#7e8e89;margin:0 0 10px}.badge{font-size:10px;color:#9b765f;background:#f5e8db;border-radius:20px;padding:3px 6px;font-weight:400}.range-row{display:grid;grid-template-columns:1fr auto;gap:4px 8px;margin-top:12px;font-size:12px;color:#536865}.range-row output{color:#a75e4c}.range-row input{grid-column:1/3;wid .app{height:100vh}.viewer{min-height:100vh}@media(max-width:850px){.app{height:auto}.viewer{min-height:65vh}}
</style>
</head>
<body>
  <main class="app">
    <aside class="sidebar">
      <div class="brand"><span class="brandmark">✦</span><div><small>互動式衛教模型 · 初版</small><h1>認識肺部與取樣</h1></div></div>
      <p class="intro">拖曳旋轉模型，滾輪縮放。選擇講解情境後，可調整各層顯示。</p>
      <section class="panel"><h2>講解情境</h2><div class="preset-grid">
        <button data-preset="natural" class="preset active">自然外觀</button>
        <button data-preset="lobes" class="preset">五肺葉</button>
        <button data-preset="inside" class="preset">看內部</button>
        <button data-preset="scope" class="preset">支氣管鏡</button>
      </div></section>
      <section class="panel"><h2>顯示構造</h2>
        <label class="switchrow"><span>肺葉</span><input id="showLungs" type="checkbox" checked></label>
        <label class="switchrow"><span>支氣管</span><input id="showBronchi" type="checkbox" checked></label>
        <label class="switchrow"><span>心臟與大血管</span><input id="showHeart" type="checkbox" checked></label>
        <label class="switchrow"><span>主要神經路徑</span><input id="showNerves" type="checkbox"></label>
        <label class="switchrow"><span>構造名稱</span><input id="showLabels" type="checkbox"></label>
        <label class="range-row"><span>肺葉透明度</span><output id="opacityValue">100%</output><input id="opacity" type="range" min="0" max="100" value="100"></label>
      </section>
      <section class="panel"><h2>放置腫瘤 <span class="badge">示範案例</span></h2>
        <p class="hint">點「調整位置」，在指定肺葉上拖動；深度另外調整。</p>
        <label class="field">所在肺葉<select id="lobeSelect">
          <option value="RUL">右上葉</option><option value="RML">右中葉</option><option value="RLL">右下葉</option><option value="LUL">左上葉</option><option value="LLL">左下葉</option>
        </select></label>
        <button id="placeBtn" class="action">調整位置</button>
        <label class="range-row"><span>腫瘤直徑</span><output id="sizeValue">3.0 cm</output><input id="size" type="range" min="1" max="8" step="0.5" value="3"></label>
        <label class="range-row"><span>距肺表深度</span><output id="depthValue">30%</output><input id="depth" type="range" min="0" max="100" value="30"></label>
        <label class="switchrow"><span>顯示腫瘤</span><input id="showTumor" type="checkbox" checked></label>
      </section>
      <section class="panel"><h2>支氣管鏡示意</h2>
        <p id="stepText" class="step-text">選擇「支氣管鏡」情境開始。</p>
        <input id="procedure" type="range" min="0" max="100" value="0">
        <div class="button-row"><button id="playBtn" class="small-button">▶ 播放</button><button id="resetProcedure" class="small-button">重播</button></div>
      </section>
      <p class="footnote">目前為標準解剖與程序概念原型。位置和器械路徑可由醫師在後續版本進一步校正。 <a href="lung-education-license.txt">開源元件授權</a></p>
    </aside>
    <section class="viewer">
      <div class="topbar"><div><a href="../index.html" style="display:inline-block;margin-bottom:8px;color:#497f78;text-decoration:none;font-size:12px;font-weight:700">← 回 CHESTTOOLS 工具箱</a><strong>肺部立體模型</strong><span>正面視角 · 右肺在畫面左側</span></div><button id="resetView">重設視角</button></div>
      <div id="viewport"></div><div id="labels"></div>
      <div id="loadingStatus" class="loading-status" role="status">模型載入中…</div>
      <div class="legend"><span><i class="dot tumor-dot"></i> 腫瘤</span><span><i class="dot bronchus-dot"></i> 支氣管</span><span><i class="dot artery-dot"></i> 動脈</span><span><i class="dot vein-dot"></i> 靜脈</span></div>
      <div id="toast" class="toast" aria-live="polite"></div>
    </section>
  </main>
  <script>
    window.addEventListener('error', function (event) {
      var box = document.getElementById('loadingStatus');
      if (box) { box.textContent = '3D 模型無法載入：' + (event.message || '請用最新版 Chrome 或 Edge 開啟'); box.classList.add('error'); }
    });
  </script>
