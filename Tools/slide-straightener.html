<header><h1>投影片拉正</h1><p>一次選取多張照片，逐張確認四角並儲存。照片只在本機處理。</p></header><main><div class="bar"><label class="file">選擇照片<input id="file" type="file" accept="image/*" multiple></label><button id="install" hidden>安裝 App</button><button id="prev" disabled>上一張</button><strong id="counter">0 / 0</strong><button id="next" disabled>下一張</button><button id="detect" disabled>重新偵測</button><button id="reset" disabled>四角重選</button><button id="undo" disabled>復原</button></div><p id="filename"></p><p id="status" role="status">請選擇一張或多張投影片照片。</p><div class="grid"><section class="panel"><h2>原圖與四角</h2><div class="stage" id="stage"><span id="empty">選擇照片即可開始</span><canvas id="source"></canvas></div><div class="corners" id="corners"><button data-i="0">① 左上</button><button data-i="1">② 右上</button><button data-i="2">③ 右下</button><button data-i="3">④ 左下</button></div><small>拖曳角點微調；或先選角點按鈕，再點照片上的新位置。靠近角點與拖曳時會顯示原始像素放大鏡。</small></section><section class="panel"><h2>校正預覽</h2><div class="bar"><label>比例 <select id="ratio"><option value="auto">自動估算</option value="1.7777777778">16:9</option><option value="1.3333333333">4:3</option></select></label><button id="warp" class="primary" disabled>拉正並預覽</button></div><div class="stage"><span id="previewEmpty">確認四角後按「拉正並預覽」</span><canvas id="out"></canvas></div><p id="size"></p><div class="bar"><select id="format"><option value="jpeg">JPG（95%）</option><option value="png">PNG</option></select><button id="save" disabled>儲存這張</button><button id="saveNext" disabled>儲存並看下一張</button></div><small>每張照片會保留角點與比例設定。自動比例以四邊像素估算；已知簡報比例時建議選 16:9 或 4:3。</small></section></div></main><canvas id="loupe" width="160" height="160"></canvas><script>
const $=id=>document.getElementById(id),src=$('source'),ctx=src.getContext('2d'),out=$('out'),loupe=$('loupe'),lc=loupe.getContext('2d');let img=null,points=[],selected=-1,drag=-1,history=[],name='slide',generation=0,items=[],current=-1;const distance=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);

function hull(ps){ps.sort((a,b)=>a.x-b.x||a.y-b.y);const cross=(a,b,c)=>(b.x-a.x)*(c.y-a.y)-(b.y-a.y)*(c.x-a.x);let lo=[],hi=[];for(const p of ps){while(lo.length>1&&cross(lo.at(-2),lo.at(-1),p)<=0)lo.pop();lo.push(p)}for(const p of ps.slice().reverse()){while(hi.length>1&&cross(hi.at(-2),hi.at(-1),p)<=0)hi.pop();hi.push(p)}return lo.slice(0,-1).concat(hi.slice(0,-1))}

$('detect').onclick=()=>{snapshot();detect()};

function solve(a){for(let i=0;i<8;i++){let k=i;for(let j=i+1;j<8;j++)if(Math.abs(a[j][i])>Math.abs(a[k][i]))k=j;[a[i],a[k]]=[a[k],a[i]];let t=a[i][i];if(Math.abs(t)<1e-10)throw Error('四角太接近或共線');for(let j=i;j<9;j++)a[i][j]/=t;for(let r=0;r<8;r++)if(r!==i){t=a[r][i];for(let j=i;j<9;j++)a[r][j]-=t*a[i][j]}}return a.map(r=>r[8])}
