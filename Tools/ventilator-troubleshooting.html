的觸發系統誤認為吸氣訊號","rationale":"與脈搏同頻且能觸發送氣的小振盪，以及非備援狀態，支持本題設定的原因。"},{"id":"C","text":"呼氣末仍有病人努力，但每次都未達觸發門檻","rationale":"這較符合無效觸發，無法解釋實際增加的送氣事件。"}],"correctOptionId":"B"}],"explanation":{"mechanismChain":["心臟相關振盪影響壓力／流量訊號","振盪跨過本題觸發條件","在沒有相應吸氣努力時產生額外機器送氣"],"limitations":["僅憑 Paw 沒有負向凹陷，不能證明沒有吸氣努力；本題需保留床邊觀察與時序線索。","心率同步線索不是第四條必備監測波形，可用觀察卡呈現。","心臟震盪未必都能觸發送氣；只有達到本題觸發條件的事件才送氣。","此為作者設計的典型情境，不能僅據外觀斷言真實病人的唯一病因。"]},"references":[{"sourceId":"B1","pdfPages":[10],"figure":"Auto-triggering 段落；Figure 1C 為另一種 leak 情境，非本題直接描圖"},{"sourceId":"ZH","pdfPages":[16]}],"interventionsEnabled":false,"mechanicsImplementationStatus":"not-implemented"},{"id":"C03","authorTitle":"雙重觸發：同一次努力跨越兩次送氣","learnerTitle":"病例 03","reviewStatus":"pending-clinical-review","initialState":"abnormality-already-present","mode":"VC-AC，固定吸氣流","stem":"病人有自主呼吸。觀察到部分機器呼吸成對出現，兩次送氣間只有短暫呼氣。床邊觀察顯示，同一次持續吸氣動作在第一口送氣前已開始，並延續到第二口。","visibleClues":["連續吸氣動作從第一口送氣前開始，不是第一口機器呼吸後才出現。","成對送氣間只呼出少量氣體，第二口即開始。","本題無漏氣證據；每次機器送氣都有對應的 flow 與 volume 變化。"],"waveformSpecification":{"pressure":"兩次相鄰送氣的壓力上升，中間僅有短暫下降；第二口峰值依保留容積及模型決定。","flow":"兩段正向吸氣流之間只有短促負向呼氣流。","volume":"第二段吸氣開始時前一口尚未充分呼出，因此容積再次增加；不強制剛好等於兩倍設定 VT。"},"questions":[{"prompt":"這組成對送氣最符合哪種現象？","options":[{"id":"A","text":"正常、彼此獨立且充分呼出的兩次呼吸","rationale":"中間呼氣短且仍有容積保留，與充分呼出的獨立呼吸不符。"},{"id":"B","text":"Ineffective triggering","rationale":"本題確實產生了兩次送氣，並非努力後沒有送氣。"},{"id":"C","text":"Double triggering，伴隨 breath stacking","rationale":"兩次送氣間呼氣不足，且同一次努力跨越兩口，支持雙重觸發與容積堆疊。"}],"correctOptionId":"C"},{"prompt":"哪個機轉最符合本題觀察到的時序？","options":[{"id":"A","text":"病人的吸氣努力持續時間長於第一口機器吸氣期，切換後仍能再次觸發","rationale":"努力從第一口前開始且延續到切換後，能解釋第二次觸發。"},{"id":"B","text":"機器完全未偵測到病人的吸氣努力，所以沒有送氣","rationale":"與兩段完整正向流量和容積上升矛盾。"},{"id":"C","text":"病人已完成呼氣，下一次獨立努力才啟動第二口","rationale":"與題幹同一次持續努力、呼氣不完全的線索不符。"}],"correctOptionId":"A"}],"explanation":{"mechanismChain":["病人一次吸氣努力尚未結束","第一口機器吸氣先結束","持續努力再觸發一口，短暫呼氣不足以排出前一口容積"],"limitations":["僅見成對波形不能推定所有病例皆由此機轉造成；本題特別提供努力開始時間。","解說可疊加「模擬吸氣努力」標示時間關係，不當作常規量測。","實際堆疊量須由流量積分計算，不能在第二口直接硬設兩倍 VT。"]},"references":[{"sourceId":"B1","pdfPages":[9,10],"figure":"Figure 1B"}],"interventionsEnabled":false,"mechanicsImplementationStatus":"not-implemented"},{"id":"C04","authorTitle":"吸氣供流不足：病人需求超過固定供流","learnerTitle":"病例 04","reviewStatus":"pending-clinical-review","initialState":"abnormality-already-present","mode":"VC-AC，固定吸氣流","stem":"ARDS 病人仍有自主吸氣努力。固定吸氣流設定下，有努力的呼吸在吸氣期出現壓力曲線凹陷；偶爾較被動的一口，凹陷較不明顯。","visibleClues":["吸氣流維持設定的固定流量形狀，未隨病人較強的努力相應增加。","床邊觀察：有凹陷的呼吸伴隨較明顯的吸氣用力。","相近設定下比較用力較強與較被動的呼吸；不能只憑 ARDS 診斷作答。"],"waveformSpecification":{"pressure":"有努力的吸氣壓力上升段呈凹陷或向內 scooping，相較較被動呼吸明顯。","flow":"固定供流的吸氣平台持續存在；不為了模擬需求增加就擅自把 VC 固定流量畫成任意流量。","volume":"吸氣期依固定流量近似線性增加，與實際 flow 積分一致；不因 Paw 凹陷就自動判定 VT 減少。"},"questions":[{"prompt":"本題吸氣期的壓力凹陷，最符合哪個問題？","options":[{"id":"A","text":"單純呼氣末 air trapping","rationale":"本題主要線索位在吸氣期，並與用力強弱及固定供流相關。"},{"id":"B","text":"Insufficient inspiratory flow／flow starvation","rationale":"固定供流無法匹配病人需求時，病人努力可使 Paw 出現凹陷。"},{"id":"C","text":"每口都完全沒有機器送氣","rationale":"已有持續吸氣流與容積增加，與完全未送氣不符。"}],"correctOptionId":"B"},{"prompt":"哪個原因最能解釋本題波形？","options":[{"id":"A","text":"呼吸系統順應性下降本身，就足以解釋每次與吸氣努力同步的凹陷","rationale":"低順應性可影響壓力，但不能單獨解釋本題與努力強弱同步的 scooping。"},{"id":"B","text":"機器提供的吸氣流量過大，造成壓力快速 overshoot","rationale":"這與供流不足的凹陷及病人持續用力線索方向不同。"},{"id":"C","text":"病人當下吸氣需求高於機器提供的固定吸氣流","rationale":"用力時 Paw 凹陷、固定供流未增加，且較被動呼吸凹陷減輕，共同支持此機轉。"}],"correctOptionId":"C"}],"explanation":{"mechanismChain":["病人吸氣需求／努力增加","固定吸氣流未隨需求提高","病人持續用力，Paw 在吸氣期出現凹陷"],"limitations":["本題 ARDS 只是背景，並非看到 ARDS 就應選 flow starvation。","沒有體溫、疼痛或酸鹼資料，不再追問是哪一個因素造成需求升高。","此處不提供調整流量或其他處置的作答功能。"]},"references":[{"sourceId":"B1","pdfPages":[10,11],"figure":"Figure 2"},{"sourceId":"ZH","pdfPages":[15],"note":"原題為處置題；本題改寫為辨識及原因。"}],"interventionsEnabled":false,"mechanicsImplementationStatus":"not-implemented"},{"id":"C05","authorTitle":"過早切換：機器吸氣早於病人努力結束","learnerTitle":"病例 05","reviewStatus":"pending-clinical-review","initialState":"abnormality-already-present","mode":"PSV，flow-cycled","stem":"病人使用 PSV。機器轉入呼氣後，床邊仍可見短暫吸氣動作；呼氣流受到干擾。這些事件未再觸發第二次機器送氣。","visibleClues":["畫面顯示 flow-cycling criterion；本題設定為在吸氣流仍相對較高時就切換。","切換後仍有吸氣動作，而非咳嗽或主動用力吐氣。","本題沒有額外的第二口機器送氣，與雙重觸發題分開。"],"waveformSpecification":{"pressure":"PSV 壓力在切換時下降，之後可見仍在吸氣努力造成的小幅擾動。","flow":"機器切換成負向呼氣流後，流量因持續吸氣努力短暫朝零或正向偏移，未接第二次送氣。","volume":"送氣後進入下降段，下降過程受努力干擾；不應畫出不存在的第二口完整機器吸氣。"},"questions":[{"prompt":"本題最符合哪一種 cycling 異常？","options":[{"id":"A","text":"Premature cycling","rationale":"機器已切換呼氣，但病人仍在吸氣，表示機器吸氣結束相對過早。"},{"id":"B","text":"Delayed cycling","rationale":"Delayed cycling 是病人已想結束吸氣，機器仍持續送氣，與本題時序相反。"},{"id":"C","text":"Double triggering","rationale":"雖可能有相關機轉，本題未產生第二次機器送氣，因此不符合這個現象。"}],"correctOptionId":"A"},{"prompt":"依 PSV 設定與努力時序，本題最支持哪個原因？","options":[{"id":"A","text":"病人的吸氣努力已結束很久，機器仍持續維持送氣","rationale":"這是切換過晚的時序，與機器先結束相反。"},{"id":"B","text":"flow-cycling 的相對流量門檻偏高，使機器比病人需求更早結束吸氣","rationale":"題目提供較高流量即切換與切換後持續努力，支持這個原因。"},{"id":"C","text":"備援呼吸頻率固定到點，因此每次結束自主呼吸","rationale":"本題為 PSV 的 flow-cycling 事件，不能以備援頻率解釋其吸氣終止時序。"}],"correctOptionId":"B"}],"explanation":{"mechanismChain":["吸氣流下降到本題較高的 cycling 門檻","呼吸器提早切換呼氣","病人吸氣努力仍持續，干擾初始呼氣流"],"limitations":["此題需設定為 flow-cycled PSV，不能只改模式標籤而沿用 VC 波形。","若實作導致第二次送氣，應重新標記題型或調整情境，不可仍將 double triggering 列為一定錯誤。","努力時序需有可見觀察卡支持；解說才可疊加模擬努力。"]},"references":[{"sourceId":"B1","pdfPages":[11],"figure":"Figure 3，premature cycling"}],"interventionsEnabled":false,"mechanicsImplementationStatus":"not-implemented"},{"id":"C06","authorTitle":"延遲切換：阻塞背景下 PSV 送氣持續過久","learnerTitle":"病例 06","reviewStatus":"pending-clinical-review","initialState":"abnormality-already-present","mode":"PSV，flow-cycled","stem":"有阻塞性肺病背景的病人使用 PSV。吸氣流下降緩慢，部分呼吸在機器仍維持支持壓時，病人已開始想吐氣。","visibleClues":["床邊觀察：機器仍送氣時，已出現主動呼氣動作；本題沒有咳嗽。","設定顯示 PSV 需等到峰值流量的較低比例才切換。","吸氣末可見壓力短暫抬升，之後才切換呼氣；不是每口都必須有該抬升。"],"waveformSpecification":{"pressure":"壓力支持持續至病人想吐氣之後；有主動呼氣的呼吸，吸氣末可出現壓力抬升。","flow":"吸氣流下降慢，較晚才到本題 cycling 門檻；轉入呼氣時序落後病人。","volume":"機器持續送氣期間容積仍可增加；依實際流量決定，不能任意固定潮氣量。"},"questions":[{"prompt":"本題機器與病人的吸氣終止時序，最符合哪種問題？","options":[{"id":"A","text":"Premature cycling","rationale":"Premature cycling 是機器先停止吸氣，而本題是機器送氣持續超過病人需求。"},{"id":"B","text":"單純 ineffective triggering","rationale":"本題呼吸已被觸發且持續送氣，主要問題在吸氣終止時序。"},{"id":"C","text":"Delayed cycling","rationale":"病人已準備或開始吐氣，機器仍維持吸氣支持，符合延遲切換。"}],"correctOptionId":"C"},{"prompt":"本題的流量形狀與 cycling 設定，最支持哪個機轉？","options":[{"id":"A","text":"吸氣流下降慢，又需等到較低的相對流量門檻，因而較晚切換","rationale":"本題阻塞背景、緩慢 flow 下降及較低 cycling 門檻共同支持。"},{"id":"B","text":"吸氣流還很高時便達到偏高門檻，機器過早停止","rationale":"這與本題較低門檻及機器過晚停止的線索相反。"},{"id":"C","text":"病人的努力小到完全未能觸發任何送氣","rationale":"本題已有明確壓力支持與吸氣流，不符合完全未觸發。"}],"correctOptionId":"A"}],"explanation":{"mechanismChain":["本題阻塞背景下吸氣流下降較慢","較低的相對 cycling 門檻使機器等待更久","病人先進入呼氣需求，機器才切換，可能出現吸氣末 Paw 抬升"],"limitations":["不能將所有 COPD 病人一律設定為 delayed cycling；必須由本題條件產生。","吸氣末壓力抬升還可有其他來源，本題必須提供呼氣動作與無咳嗽的觀察。","不使用不同品牌 rise-time 數字方向來替代 cycling 機轉。"]},"references":[{"sourceId":"B1","pdfPages":[11],"figure":"Figure 3，delayed cycling"}],"interventionsEnabled":false,"mechanicsImplementationStatus":"not-implemented"},{"id":"C07","authorTitle":"呼氣未完成：嚴重支氣管痙攣背景的 air trapping","learnerTitle":"病例 07","reviewStatus":"pending-clinical-review","initialState":"abnormality-already-present","mode":"VC-AC，時間觸發，無自主努力","stem":"嚴重支氣管痙攣病人接受控制通氣。每次下一口吸氣開始時，前一口的呼氣流仍明顯低於零。題目已存在此狀態，不需等待病況惡化。","visibleClues":["本題無自主努力，管路檢查未發現漏氣。","設定提供呼吸週期、吸氣時間與可用呼氣時間；相依數值待模型定稿後生成。","呼氣流平滑但下降／回復緩慢，下一口開始前仍未回零；沒有完成 expiratory hold 的結果。"],"waveformSpecification":{"pressure":"下一口吸氣按既定時序開始；氣道壓力可接近設定 PEEP，不能因此排除內在 PEEP。","flow":"負向呼氣流尚未回零，即切換成下一口正向吸氣流。","volume":"呼氣下降段在尚未完成排空時即被下一口打斷。顯示採何種每口相對容積／基準處理，須在 renderer 規格中明定。"},"questions":[{"prompt":"最值得辨識的異常是什麼？","options":[{"id":"A","text":"單純 inspiratory pause","rationale":"吸氣停頓應在吸氣末呈現零流量時段，不能解釋下一口前仍持續的負向呼氣流。"},{"id":"B","text":"呼氣未完成，支持 air trapping／Auto-PEEP 的疑慮","rationale":"下一口開始前仍有呼氣流，在本題無漏氣、無努力的條件下支持呼氣未完成。"},{"id":"C","text":"病人無效吸氣努力造成的短暫流量偏移","rationale":"本題無自主努力，且觀察到的是持續未回零的呼氣流，不是局部努力造成的短暫偏移。"}],"correctOptionId":"B"},{"prompt":"依本題背景與流量形狀，哪個原因最符合？","options":[{"id":"A","text":"每口開始前肺部都已完全排空，只是壓力標籤錯誤","rationale":"與持續呼氣流及被打斷的呼氣段不符。"},{"id":"B","text":"呼吸器觸發過度敏感，心臟震盪反覆啟動自主送氣","rationale":"本題是時間觸發控制呼吸，並未提供心臟相關額外觸發事件。"},{"id":"C","text":"阻塞造成排氣緩慢，目前可用呼氣時間不足以完成排氣","rationale":"呼氣流平滑而持續、病人阻塞背景，以及呼氣被下一口打斷，共同支持此機轉。"}],"correctOptionId":"C"}],"explanation":{"mechanismChain":["嚴重支氣管痙攣使本題呼氣排空較慢","既定週期的可用呼氣時間不足","下一口開始時仍有呼氣流，形成 air trapping／內在 PEEP 的風險與疑慮"],"limitations":["波形用於辨識呼氣未完成，不直接提供 intrinsic PEEP 的數值。","若之後要顯示 measured auto-PEEP，需另有有效 expiratory hold 的條件與結果。","Volume 是感測流量的積分顯示，不是可直接量到絕對肺容積；重設顯示基準不得宣稱肺已排空。","題目不將峰值氣道壓直接視為肺泡壓。"]},"references":[{"sourceId":"B1","pdfPages":[14,19],"figure":"Monitoring／auto-PEEP；COPD 呼氣時間機轉"},{"sourceId":"ZH","pdfPages":[21]},{"sourceId":"R2013","pdfPages":[5,6],"figure":"Figures 9–10，補充圖解"}],"interventionsEnabled":false,"mechanicsImplementationStatus":"not-implemented"},{"id":"C08","authorTitle":"漏氣：呼吸管路接頭密合不全","learnerTitle":"病例 08","reviewStatus":"pending-clinical-review","initialState":"abnormality-already-present","mode":"VC-AC，時間觸發，無自主努力","stem":"控制通氣中，多口呼吸的呼出潮氣量持續低於吸入潮氣量。請結合 flow／volume 波形與床邊檢查，判斷問題及其來源。","visibleClues":["多口穩定觀察均有 VTi 大於 VTe；流量與容積以同一個未作漏氣補償的量測基準呈現。","呼氣流可在下一口前回到接近零，本題未見持續的呼氣未完成。","床邊檢查卡：某呼吸管路接頭吸氣時可聽見逸氣聲；ETT 套囊檢查未發現異常。"],"waveformSpecification":{"pressure":"有正常時序送氣，壓力可能因漏氣有所改變；不把某個固定低壓當成必備證據。","flow":"正向與負向流量積分不相等；本題量測到的呼出量小於送入量。","volume":"若採逐口原始積分，呼氣末有未回收的容積差；若採每口歸零，需標明顯示重設，不可讓重設看似實際流量。"},"questions":[{"prompt":"多口 VTi／VTe 差異與床邊線索最支持哪個問題？","options":[{"id":"A","text":"Leak／漏氣","rationale":"持續回收量不足，配合接頭逸氣線索，支持漏氣。"},{"id":"B","text":"單純 breath stacking","rationale":"本題無相鄰雙重送氣，且呼氣可回零；漏氣線索更能解釋持續回收量不足。"},{"id":"C","text":"單純流量不足引起的吸氣壓力凹陷","rationale":"本題無自主努力，也未以吸氣 scooping 為主要線索；不能解釋接頭逸氣。"}],"correctOptionId":"A"},{"prompt":"本題哪一個原因最有直接線索支持？","options":[{"id":"A","text":"病人順應性下降，所有送入氣體仍完整回到量測端","rationale":"順應性改變本身不能解釋接頭逸氣及持續量測回收差。"},{"id":"B","text":"呼吸管路接頭密合不全，使部分氣體未經正常回收路徑返回量測端","rationale":"定位到接頭的逸氣線索與持續 VTi／VTe 差支持本題漏氣來源。"},{"id":"C","text":"PSV 的 cycling 門檻偏高，提早停止支持","rationale":"本題模式是 VC-AC，且沒有 PSV cycling 事件可支持此原因。"}],"correctOptionId":"B"}],"explanation":{"mechanismChain":["管路接頭密合不全","部分送出氣體由接頭逸出，未經預期的回收量測路徑","在本題感測與顯示規則下，出現持續 VTi 大於 VTe"],"limitations":["僅憑 VTi 大於 VTe 不能唯一定位漏點，必須保留接頭檢查線索。","原講義第 8 頁以 bronchopleural fistula 為答案；本題並未沿用該病因，而是加入接頭定位線索重新編寫。","感測位置、漏氣位置與補償方式會影響數值；引擎必須先定義，不能任意讓流量、容積與數值各自跳動。","本題不以單口差值排除暫時性氣體滯留，需使用多口穩定觀察及床邊定位。"]},"references":[{"sourceId":"ZH","pdfPages":[8],"note":"僅參考回收量差的題材；病因與題幹已改寫。"},{"sourceId":"B1","pdfPages":[10],"figure":"Figure 1C，leak 與 volume 不回基準的相關圖解"},{"sourceId":"R2013","pdfPages":[5,6],"figure":"Figure 10，量測流量／容積與漏氣圖解"}],"interventionsEnabled":false,"mechanicsImplementationStatus":"not-implemented"},{"id":"C09","learnerTitle":"病例 09","reviewStatus":"pending-clinical-review","initialState":"abnormality-already-present","interventionsEnabled":false,"mechanicsImplementationStatus":"simplified-single-compartment","authorTitle":"高壓警報：氣道阻力上升（分泌物／阻塞）— Ppeak 高、Pplat 不高","mode":"VC-AC，固定吸氣流，含吸氣末停頓（0.3 s）","stem":"控制通氣中高氣道壓警報響起。每口吸氣末有短暫停頓，壓力在停頓期下降。請比較尖峰壓（Ppeak）與停頓末壓力（Pplat）的差距，並觀察 Loops 區 flow-volume 迴圈呼氣段的形狀。","visibleClues":["本題無自主努力，管路接頭檢查未見漏氣。","床邊：近期痰量增加，氣管內可聽到痰音。","設定為固定吸氣流並加入吸氣末停頓；右側 Pplat 取自停頓末壓力（教學簡化的短停頓）。"],"waveformSpecification":{"pressure":"固定吸氣流下 Ppeak 明顯高於停頓末壓力；停頓期壓力下降到 Pplat。","flow":"吸氣為方波，停頓期為零；呼氣段流量疊加鋸齒狀擾動。","volume":"吸氣上升、停頓期持平、呼氣回到基準，無漏氣型落差。"},"questions":[{"prompt":"Ppeak 明顯升高，但停頓末壓力（Pplat）不高。最符合哪一種力學變化？","options":[{"id":"A","text":"順應性下降，Ppeak 與 Pplat 一起升高","rationale":"順應性下降時 Ppeak 與 Pplat 同步升高、兩者差距不變；本題差距明顯擴大。"},{"id":"B","text":"氣道（含氣管內管）阻力上升","rationale":"Ppeak 與 Pplat 的差距反映克服流量阻力的壓力；固定吸氣流下差距擴大，支持阻力上升。"},{"id":"C","text":"病人吸氣努力造成壓力假性升高","rationale":"本題無自主努力；努力會使 Paw 下降或波形變形，而不是造成穩定的 Ppeak 升高。"}],"correctOptionId":"B"},{"prompt":"呼氣段 flow-volume 迴圈出現鋸齒，床邊有痰音。依 DOPE 的 O（Obstruction），最先考慮哪個原因？","options":[{"id":"A","text":"肺水腫使肺順應性下降","rationale":"順應性下降主要表現為 Pplat 升高、P-V 迴圈傾向橫軸，不會單獨造成呼氣流鋸齒與 Ppeak–Pplat 差距擴大。"},{"id":"B","text":"氣管內或管路內分泌物／痰栓造成阻塞","rationale":"呼氣段鋸齒配合痰音與阻力上升，是分泌物的典型線索（Mellema 圖 17）；仍需合併臨床判斷。"},{"id":"C","text":"呼吸器觸發過於敏感","rationale":"過度敏感造成的是額外送氣；本題呼吸為固定時間觸發，且問題出在壓力差與呼氣流形狀。"}],"correctOptionId":"B"}],"explanation":{"mechanismChain":["分泌物使氣道與氣管內管的阻力上升","固定吸氣流下，流量乘以阻力使 Ppeak 升高；停頓期流量為零，壓力降到反映彈性回彈的 Pplat","Ppeak 與 Pplat 差距擴大；呼氣流受分泌物擾動，flow-volume 迴圈呼氣段呈鋸齒"],"limitations":["單腔室模型沒有 pendelluft，Ppeak 到 Pplat 為瞬間下降；真實 Pplat 需要停頓約 2–3 秒穩定。","本題停頓僅 0.3 s，是教學簡化；有效 Pplat 另需無自主努力與無漏氣。","鋸齒是腳本化擾動，不能單憑波形決定處置；需合併聽診、病人狀況與其他線索。"]},"references":[{"sourceId":"R2013","pdfPages":[4],"figure":"Figure 6：阻力上升與順應性下降對 PIP／Pplat 的影響"},{"sourceId":"R2013","pdfPages":[9],"figure":"Figure 17：呼氣段鋸齒與分泌物"},{"sourceId":"B1","pdfPages":[14],"figure":"Figure 4：吸氣停頓與阻力估算；停頓壓測量條件"}]},{"id":"C10","learnerTitle":"病例 10","reviewStatus":"pending-clinical-review","initialState":"abnormality-already-present","interventionsEnabled":false,"mechanicsImplementationStatus":"simplified-single-compartment","authorTitle":"高壓警報：順應性下降 — Ppeak 與 Pplat 一起升高","mode":"VC-AC，固定吸氣流，含吸氣末停頓（0.3 s）","stem":"控制通氣中高氣道壓警報響起。吸氣末停頓期間壓力下降，但停在仍偏高的位置。請看 Pplat 與 Ppeak 的差距，以及 Loops 區 P-V 迴圈的斜率。","visibleClues":["本題無自主努力，管路無漏氣。","床邊：病人剛翻身後不久；右側呼吸音較左側弱，氣管內管深度尚待確認。","右側 Pplat 超過 30 cmH₂O；Ppeak 與 Pplat 的差距相對不大。"],"waveformSpecification":{"pressure":"Ppeak 與 Pplat 都高，差距約維持固定。","flow":"方波吸氣流與停頓，呼氣流迅速回零。","volume":"單口容積正常回收，無漏氣落差。"},"questions":[{"prompt":"Ppeak 與 Pplat 一起升高，兩者差距沒有擴大。最符合哪一種力學變化？","options":[{"id":"A","text":"氣道阻力上升","rationale":"阻力上升時 Ppeak 升高而 Pplat 不一定升高，差距會擴大；本題差距沒有擴大。"},{"id":"B","text":"順應性下降（可通氣的肺／胸壁彈性空間減少）","rationale":"Ppeak 與 Pplat 同步升高、差距不變，是順應性下降的典型模式；P-V 迴圈斜率變小。"},{"id":"C","text":"管路漏氣","rationale":"漏氣會使回收容積不足與迴圈不閉合；本題容積可回收，迴圈閉合。"}],"correctOptionId":"B"},{"prompt":"依 DOPE，哪一組原因最適合與此波形同時評估？","options":[{"id":"A","text":"痰栓、氣管內管扭折或咬管（O）","rationale":"這組主要使阻力上升，會擴大 Ppeak–Pplat 差距；與本題波形不符。"},{"id":"B","text":"氣管內管移入單側主支氣管、氣胸等（D、P），以及肺水腫、腹壓上升","rationale":"可通氣的肺或胸壁空間減少都會使 Pplat 升高；床邊右側呼吸音減弱支持需要檢查位置與氣胸。"},{"id":"C","text":"呼吸器觸發過度敏感造成 auto-triggering","rationale":"觸發問題改變的是送氣時機與次數，不會造成穩定的 Pplat 升高。"}],"correctOptionId":"B"}],"explanation":{"mechanismChain":["可通氣的肺或胸壁彈性空間減少，使順應性下降","同樣的潮氣量需要更高的彈性回彈壓，Pplat 與 Ppeak 同步升高","Ppeak–Pplat 差距不變，P-V 迴圈向橫軸旋轉，需要找出 D、P 等原因"],"limitations":["波形無法分辨氣胸、單側插管、肺水腫或腹壓上升；必須合併床邊檢查與影像。","Pplat 高於 28–30 cmH₂O 提示低靜態順應性（B1），不是治療處方。","本題停頓為 0.3 s 的教學簡化，真實 Pplat 需約 2–3 秒穩定且無自主努力與漏氣。"]},"references":[{"sourceId":"R2013","pdfPages":[4],"figure":"Figure 6：順應性下降時 PIP 與 Pplat 一起升高"},{"sourceId":"R2013","pdfPages":[7],"figure":"Figure 12：順應性下降使 P-V 迴圈旋轉"},{"sourceId":"B1","pdfPages":[14],"figure":"停頓壓條件；Pplat 超過 28–30 cmH₂O 的調查建議"}]},{"id":"C11","learnerTitle":"病例 11","reviewStatus":"pending-clinical-review","initialState":"abnormality-already-present","interventionsEnabled":false,"mechanicsImplementationStatus":"simplified-single-compartment","authorTitle":"過度膨脹：P-V 迴圈出現 beaking（吸氣末鳥嘴）","mode":"VC-AC，固定吸氣流，含吸氣末停頓（0.2 s）","stem":"控制通氣，設定潮氣量相對偏大。吸氣末段壓力快速上升，但容積增加很少。請看 Loops 區 P-V 迴圈吸氣支末端的形狀，並對照 Pplat。","visibleClues":["本題無自主努力，管路無漏氣。","右側 Pplat 超過 30 cmH₂O；Ppeak 與 Pplat 的差距不大。","P-V 迴圈吸氣支末段向上翹起，像鳥喙。"],"waveformSpecification":{"pressure":"Pplat 偏高，Ppeak 與 Pplat 差距不大。","flow":"固定吸氣流，呼氣流平順回零。","volume":"單口潮氣量較大，呼氣可回收。"},"questions":[{"prompt":"P-V 迴圈吸氣支末段向上翹起（beaking）。最符合哪一種現象？","options":[{"id":"A","text":"管路漏氣","rationale":"漏氣使迴圈不閉合；本題迴圈閉合，翹起位在吸氣末。"},{"id":"B","text":"肺泡過度膨脹，容積增加很少而壓力快速上升","rationale":"beaking 表示順應性在高容積處明顯下降，是過度膨脹的典型圖形（Mellema 圖 13）。"},{"id":"C","text":"吸氣流量不足造成的壓力凹陷","rationale":"供流不足使吸氣支出現凹陷，位置在吸氣中段，而不是末段翹起。"}],"correctOptionId":"B"},{"prompt":"此圖形與偏高的 Pplat 對判讀潮氣量的意義是什麼？","options":[{"id":"A","text":"吸氣末已進入順應性下降區，提高容積傷害風險，應重新檢視潮氣量與驅動壓","rationale":"圖形顯示末段已接近過度膨脹，加上 Pplat 偏高，應回頭檢視設定；實際調整需臨床審閱。"},{"id":"B","text":"代表肺復張良好，可以再增加潮氣量","rationale":"這是相反的解讀；beaking 是壓力快速上升而容積增加有限。"},{"id":"C","text":"代表呼氣不完全，需延長呼氣時間","rationale":"呼氣不完全要看呼氣流是否在下一口前回零；本題呼氣可回零。"}],"correctOptionId":"A"}],"explanation":{"mechanismChain":["潮氣量較大，吸氣末段肺進入順應性下降區","同樣的容積增量需要更高壓力，P-V 迴圈吸氣
