le":"漏氣會使容積在停頓期下降且迴圈不閉合；本題容積維持不變。"},{"id":"C","text":"機器過早切換","rationale":"過早切換是吸氣流還高時就結束；本題是刻意的零流量停頓。"}],"correctOptionId":"A","walkthrough":["先看流量：零流量段就是停頓。","再看容積：持平，表示沒有氣體進出；此時 Paw 的下降量就是流量阻力造成的那一部分。"]},{"key":"feature","prompt":"Ppeak 與 Pplat 的差距，主要反映什麼？","options":[{"id":"A","text":"氣流通過氣道與氣管內管的阻力","rationale":"差距等於流量乘以阻力；阻力越大，差距越大。"},{"id":"B","text":"肺與胸壁的順應性","rationale":"順應性影響的是 Pplat 與 PEEP 的差距，不是 Ppeak 與 Pplat 的差距。"},{"id":"C","text":"PEEP 的設定","rationale":"PEEP 是兩者共同的基線，不影響它們的差距。"}],"correctOptionId":"A","walkthrough":["Ppeak − Pplat → 阻力；Pplat − PEEP → 順應性。","這是鑑別高壓警報的基本公式：差距擴大看阻力，一起升高看順應性。"]}],"explanation":{"mechanismChain":["吸氣末停頓使流量為零","Paw 從 Ppeak 降到 Pplat","兩者差距反映阻力，Pplat − PEEP 反映順應性"],"limitations":["單腔室模型沒有 pendelluft，下降為瞬間；真實需要約 2–3 秒且無自主努力與漏氣。"]},"references":[{"sourceId":"R2013","pdfPages":[2,3,4,5],"figure":"Figures 2、3、5、7：各模式的壓力、流量與容積波形"},{"sourceId":"B1","pdfPages":[14],"figure":"Figure 4：吸氣停頓與平台壓"}]},{"id":"B03","kind":"basic","category":"basic","scenarioId":"B03","title":"PC-AC：壓力方波與遞減流量","clinicalScenario":"被動、沒有自主努力的病人，接受機器控制通氣。請觀察三條波形與 F-V 迴圈的形狀。","settingClues":"壓力控制，固定吸氣時間 1.0 秒。","reviewStatus":"pending-clinical-review","steps":[{"key":"mode","prompt":"只看波形與數值（模式與設定已隱藏），這個畫面最可能是哪一種通氣模式？","options":[{"id":"A","text":"VC-AC（容積控制）","rationale":"不符：VC-AC 的特徵是吸氣流為固定方波（可加吸氣末停頓），壓力隨吸氣容積逐步上升；每口潮氣量固定；本題的波形不是這樣。"},{"id":"B","text":"PC-AC（壓力控制）","rationale":"符合：壓力是方波，流量先高後遞減，吸氣時間固定。"},{"id":"C","text":"PS（壓力支持）","rationale":"不符：PS 的特徵是由病人觸發，壓力為方波，流量遞減到峰值的某個比例就切換；吸氣時間隨病人與肺力學而變；本題的波形不是這樣。"}],"correctOptionId":"B","walkthrough":["先判斷模式：壓力是方波，流量先高後遞減，吸氣時間固定。","PC-AC 的判定：吸氣壓力為方波，流量先高後遞減；吸氣時間固定，潮氣量隨阻力與順應性改變。"],"reviewCaseId":"B03"},{"key":"feature","prompt":"Paw 呈方波，吸氣流量一開始最高，之後慢慢下降。這代表什麼？","options":[{"id":"A","text":"壓力固定，流量隨肺逐漸充填而遞減","rationale":"壓力差一開始最大、肺充填後差距縮小，所以流量遞減。"},{"id":"B","text":"流量固定，壓力隨容積上升","rationale":"那是容積控制的鯊魚鰭；本題相反。"},{"id":"C","text":"病人努力使流量遞減","rationale":"遞減是規律的指數形狀，與努力無關。"}],"correctOptionId":"A","walkthrough":["先看壓力：方波 → 壓力是被設定的一側。","再看流量：遞減 → 流量是結果；這是壓力控制的特徵。"]},{"key":"feature","prompt":"若病人的氣道阻力突然上升，PC-AC 下的 Paw 與送入的潮氣量會怎麼變？","options":[{"id":"A","text":"Paw 不變，潮氣量下降","rationale":"壓力是被設定的，阻力上升使流量變小，所以潮氣量下降。"},{"id":"B","text":"Paw 上升，潮氣量不變","rationale":"這是容積控制下的反應。"},{"id":"C","text":"Paw 與潮氣量都不變","rationale":"阻力改變一定會影響流量與潮氣量。"}],"correctOptionId":"A","walkthrough":["壓力控制：壓力固定，其他的跟著變。","所以阻力上升時最先要看的是潮氣量是否掉下來，而不是壓力警報。"]}],"explanation":{"mechanismChain":["機器維持設定壓力","流量隨肺充填而遞減","潮氣量由壓力差、阻力與順應性共同決定"],"limitations":["本題為簡化模型，不模擬品牌的壓力上升演算法。"]},"references":[{"sourceId":"R2013","pdfPages":[2,3,4,5],"figure":"Figures 2、3、5、7：各模式的壓力、流量與容積波形"},{"sourceId":"B1","pdfPages":[14],"figure":"Figure 4：吸氣停頓與平台壓"}]},{"id":"B04","kind":"basic","category":"basic","scenarioId":"B04","title":"PS：病人觸發與流量切換","clinicalScenario":"病人有自主吸氣動作，每次吸氣努力之後機器送氣。請觀察吸氣前後的壓力與流量變化。","settingClues":"壓力支持 10 cmH₂O，吸氣流降到峰值 25% 就切換。","reviewStatus":"pending-clinical-review","steps":[{"key":"mode","prompt":"只看波形與數值（模式與設定已隱藏），這個畫面最可能是哪一種通氣模式？","options":[{"id":"A","text":"VC-AC（容積控制）","rationale":"不符：VC-AC 的特徵是吸氣流為固定方波（可加吸氣末停頓），壓力隨吸氣容積逐步上升；每口潮氣量固定；本題的波形不是這樣。"},{"id":"B","text":"PC-AC（壓力控制）","rationale":"不符：PC-AC 的特徵是吸氣壓力為方波，流量先高後遞減；吸氣時間固定，潮氣量隨阻力與順應性改變；本題的波形不是這樣。"},{"id":"C","text":"PS（壓力支持）","rationale":"符合：每口送氣前都有病人的小小吸氣動作，機器在流量下降到一定比例時切換。"}],"correctOptionId":"C","walkthrough":["先判斷模式：每口送氣前都有病人的小小吸氣動作，機器在流量下降到一定比例時切換。","PS 的判定：由病人觸發，壓力為方波，流量遞減到峰值的某個比例就切換；吸氣時間隨病人與肺力學而變。"],"reviewCaseId":"B04"},{"key":"feature","prompt":"每口送氣前，Paw 先出現小凹陷、流量小幅上升。這代表什麼？","options":[{"id":"A","text":"病人吸氣努力被偵測到，觸發機器送氣","rationale":"努力使 Paw 下降或流量上升，超過門檻就觸發。"},{"id":"B","text":"管路漏氣","rationale":"漏氣不會成對出現在每一口送氣之前。"},{"id":"C","text":"心臟震盪造成的雜訊","rationale":"心臟震盪與脈搏同頻，且不會每次都在送氣之前。"}],"correctOptionId":"A","walkthrough":["送氣前的小凹陷與流量小幅上升 → 病人先用力。","這是壓力支持模式由病人決定何時開始的證據。"]},{"key":"feature","prompt":"吸氣流遞減到一定比例就切換，所以容積曲線在吸氣末通常怎樣？","options":[{"id":"A","text":"沒有明顯的水平平台","rationale":"切換時流量還沒回到零，容積還在增加，所以沒有平台。"},{"id":"B","text":"有很長的水平平台","rationale":"平台代表流量為零，這在容積控制加停頓時才會出現。"},{"id":"C","text":"先下降再上升","rationale":"容積在吸氣期單調上升，不會下降。"}],"correctOptionId":"A","walkthrough":["有平台 → 停頓或流量降到零；沒有平台且流量還沒到零就切換 → 流量切換的支持。","這也是區分壓力支持與壓力控制的線索：吸氣時間由病人與切換門檻決定。"]}],"explanation":{"mechanismChain":["病人先吸氣","壓力上升並以遞減流量送氣","流量降到門檻比例時切換"],"limitations":["備援通氣與完整觸發控制器未實作，僅為教學示範。"]},"references":[{"sourceId":"R2013","pdfPages":[2,3,4,5],"figure":"Figures 2、3、5、7：各模式的壓力、流量與容積波形"},{"sourceId":"B1","pdfPages":[14],"figure":"Figure 4：吸氣停頓與平台壓"}]},{"id":"C01","kind":"troubleshooting","category":"trigger","scenarioId":"C01","title":"無效觸發：觸發門檻與病人努力不匹配","clinicalScenario":"病人清醒，有自主吸氣動作。觀察多個呼吸週期，部分胸腹吸氣動作之後沒有機器送氣。床邊觀察：未送氣的小凹陷與胸腹吸氣動作同步。請同時比對呼氣期的壓力與流量變化。","settingClues":"設定使用壓力觸發（畫面標示觸發門檻）；失敗努力造成的 Paw 變化沒有跨過門檻；呼氣末流量可先回零。","reviewStatus":"pending-clinical-review","steps":[{"key":"mode","prompt":"只看波形與數值（模式與設定已隱藏），這個畫面最可能是哪一種通氣模式？","options":[{"id":"A","text":"VC-AC（容積控制）","rationale":"符合：流量是固定方波，壓力在吸氣期逐步上升。"},{"id":"B","text":"PC-AC（壓力控制）","rationale":"不符：PC-AC 的特徵是吸氣壓力為方波，流量先高後遞減；吸氣時間固定，潮氣量隨阻力與順應性改變；本題的波形不是這樣。"},{"id":"C","text":"PS（壓力支持）","rationale":"不符：PS 的特徵是由病人觸發，壓力為方波，流量遞減到峰值的某個比例就切換；吸氣時間隨病人與肺力學而變；本題的波形不是這樣。"}],"correctOptionId":"A","walkthrough":["先判斷模式：流量是固定方波，壓力在吸氣期逐步上升。","VC-AC 的判定：吸氣流為固定方波（可加吸氣末停頓），壓力隨吸氣容積逐步上升；每口潮氣量固定。"],"reviewCaseId":"B01"},{"key":"problem","prompt":"這些未接上機器送氣的小事件，最符合哪一種異常？","options":[{"id":"A","text":"Auto-triggering","rationale":"Auto-triggering 是機器在沒有相應病人努力時額外送氣；本題相反，是有努力卻未送氣。"},{"id":"B","text":"Ineffective triggering","rationale":"胸腹努力、Paw 凹陷及流量偏移同步，但沒有後續機器送氣。"},{"id":"C","text":"Double triggering","rationale":"Double triggering 需出現相鄰的兩次送氣；本題的小事件未觸發一次完整送氣。"}],"correctOptionId":"B","walkthrough":["先看呼氣期：有小幅的壓力下降與流量上升，但沒有接著出現正常的機器吸氣。","這是有努力、沒有送氣的圖形。額外送氣或成對送氣都不是這個樣子。"]},{"key":"cause","prompt":"依本題設定與門檻標記，哪個原因最能解釋這些失敗觸發？","options":[{"id":"A","text":"觸發過度敏感，使微小雜訊也能啟動機器","rationale":"這較能造成額外送氣，無法解釋明確努力仍未達門檻。"},{"id":"B","text":"機器在同一次努力中連續送出兩口氣","rationale":"這是相鄰送氣的描述，與本題沒有送氣的事件不符。"},{"id":"C","text":"目前觸發門檻要求的壓力變化，大於這些努力實際造成的變化","rationale":"畫面門檻與失敗事件的相對幅度直接支持本題原因。"}],"correctOptionId":"C","walkthrough":["對照畫面上的觸發門檻線：失敗努力造成的壓力下降沒有碰到門檻。","呼氣末流量已回零，所以先不要往 auto-PEEP 推論。"]},{"key":"resolution","prompt":"依這個原因，最合理的設定調整方向是什麼？","options":[{"id":"A","text":"讓觸發更敏感（降低所需的壓力變化，或改用流量觸發）","rationale":"門檻比努力造成的變化還大；降低門檻可讓同樣的努力成功觸發。"},{"id":"B","text":"提高吸氣流速","rationale":"吸氣流速影響送氣階段，與觸發無關。"},{"id":"C","text":"縮短吸氣時間","rationale":"縮短吸氣時間不會改變觸發能否發生。"}],"correctOptionId":"A","walkthrough":["同時要排除其他造成無效觸發的原因：auto-PEEP、鎮靜過深、過度輔助。","此題因呼氣末流量已回零，且門檻明顯過高，所以先調觸發。"]}],"explanation":{"mechanismChain":["病人吸氣努力造成 Paw／flow 變化","變化未達目前 pressure-trigger 門檻","呼吸器未啟動送氣，形成 ineffective triggering"],"limitations":["本題只證明門檻與努力不匹配，不代表所有無效觸發都由門檻設定造成。","不以本題排除其他病例的肌力弱、呼吸驅動下降或 auto-PEEP。","門檻線為設定參考線，Paw 凹陷不可拿隱藏 Pmus 曲線替代。"]},"references":[{"sourceId":"B1","pdfPages":[9,10],"figure":"Figure 1A"},{"sourceId":"ZH","pdfPages":[5]}]},{"id":"C02","kind":"troubleshooting","category":"trigger","scenarioId":"C02","title":"自動觸發：心臟震盪相關訊號","clinicalScenario":"病人間歇出現額外送氣。床邊觀察沒有看到這些額外送氣之前有相應的胸腹吸氣動作；小幅流量與壓力振盪與脈搏同頻，部分振盪後接上送氣。管路檢查沒有積水，接頭與套囊沒有漏氣。","settingClues":"額外送氣不是備援通氣事件；觸發設定對小訊號敏感。","reviewStatus":"pending-clinical-review","steps":[{"key":"mode","prompt":"只看波形與數值（模式與設定已隱藏），這個畫面最可能是哪一種通氣模式？","options":[{"id":"A","text":"VC-AC（容積控制）","rationale":"不符：VC-AC 的特徵是吸氣流為固定方波（可加吸氣末停頓），壓力隨吸氣容積逐步上升；每口潮氣量固定；本題的波形不是這樣。"},{"id":"B","text":"PC-AC（壓力控制）","rationale":"不符：PC-AC 的特徵是吸氣壓力為方波，流量先高後遞減；吸氣時間固定，潮氣量隨阻力與順應性改變；本題的波形不是這樣。"},{"id":"C","text":"PS（壓力支持）","rationale":"符合：壓力方波、流量遞減後由病人與機器共同決定切換；沒有固定的吸氣流。"}],"correctOptionId":"C","walkthrough":["先判斷模式：壓力方波、流量遞減後由病人與機器共同決定切換；沒有固定的吸氣流。","PS 的判定：由病人觸發，壓力為方波，流量遞減到峰值的某個比例就切換；吸氣時間隨病人與肺力學而變。"],"reviewCaseId":"B04"},{"key":"problem","prompt":"本題額外送氣最符合哪一種異常？","options":[{"id":"A","text":"Auto-triggering","rationale":"非備援的送氣缺少相應病人努力，且與非呼吸來源的小振盪相關。"},{"id":"B","text":"Ineffective triggering","rationale":"無效觸發是有努力而未送氣，本題是額外送氣。"},{"id":"C","text":"正常時間觸發的備援呼吸","rationale":"題幹已提供備援狀態，這些額外送氣不屬於該機制。"}],"correctOptionId":"A","walkthrough":["先問：這些送氣之前有沒有病人的吸氣動作？沒有 → 不是病人觸發。","再看小振盪與脈搏的關係：同頻 → 心臟相關訊號，不是呼吸努力。"]},{"key":"cause","prompt":"綜合脈搏同步性與管路檢查，本題最支持哪個觸發來源？","options":[{"id":"A","text":"病人的自主呼吸驅動突然增強，每次努力都成功送氣","rationale":"若為這種機制，應有對應的呼吸努力證據；本題線索偏向非呼吸振盪。"},{"id":"B","text":"心臟相關震盪被敏感的觸發系統誤認為吸氣訊號","rationale":"與脈搏同頻且能觸發送氣的小振盪，以及非備援狀態，支持本題設定的原因。"},{"id":"C","text":"呼氣末仍有病人努力，但每次都未達觸發門檻","rationale":"這較符合無效觸發，無法解釋實際增加的送氣事件。"}],"correctOptionId":"B","walkthrough":["先排除漏氣與管路積水（都已排除），再看振盪頻率與脈搏同步。","觸發太敏感時，這種小振盪就足以啟動機器。"]},{"key":"resolution","prompt":"排除漏氣與積水後，最合理的設定調整方向是什麼？","options":[{"id":"A","text":"讓觸發更敏感","rationale":"會讓更多小訊號啟動機器，auto-triggering 更嚴重。"},{"id":"B","text":"逐步降低觸發靈敏度，直到額外送氣消失","rationale":"先排除漏氣與積水，再逐步降低靈敏度，是控制 auto-triggering 的常見做法；仍要確認病人的真正努力能觸發。"},{"id":"C","text":"提高壓力支持","rationale":"壓力支持影響送氣的大小，不影響觸發的來源。"}],"correctOptionId":"B","walkthrough":["調低靈敏度要小步進行，同時確認病人真正的吸氣努力仍然能觸發。","同一組波形若 trigger 太遲鈍，會變成 C01 的無效觸發；兩者互為鏡像。"]}],"explanation":{"mechanismChain":["心臟相關振盪影響壓力／流量訊號","振盪跨過本題觸發條件","在沒有相應吸氣努力時產生額外機器送氣"],"limitations":["僅憑 Paw 沒有負向凹陷，不能證明沒有吸氣努力；本題需保留床邊觀察與時序線索。","心率同步線索不是第四條必備監測波形，可用觀察卡呈現。","心臟震盪未必都能觸發送氣；只有達到本題觸發條件的事件才送氣。","此為作者設計的典型情境，不能僅據外觀斷言真實病人的唯一病因。"]},"references":[{"sourceId":"B1","pdfPages":[10],"figure":"Auto-triggering 段落；Figure 1C 為另一種 leak 情境，非本題直接描圖"},{"sourceId":"ZH","pdfPages":[16]}]},{"id":"C03","kind":"troubleshooting","category":"trigger","scenarioId":"C03","title":"雙重觸發：同一次努力跨越兩次送氣","clinicalScenario":"病人有自主呼吸。部分機器呼吸成對出現，兩次送氣間只有短暫呼氣。床邊觀察：同一次持續吸氣動作在第一口送氣前已開始，並延續到第二口；沒有漏氣證據。","settingClues":"吸氣時間設定較短，相對於病人的吸氣努力。","reviewStatus":"pending-clinical-review","steps":[{"key":"mode","prompt":"只看波形與數值（模式與設定已隱藏），這個畫面最可能是哪一種通氣模式？","options":[{"id":"A","text":"VC-AC（容積控制）","rationale":"符合：流量是固定的方波，每口潮氣量一樣。"},{"id":"B","text":"PC-AC（壓力控制）","rationale":"不符：PC-AC 的特徵是吸氣壓力為方波，流量先高後遞減；吸氣時間固定，潮氣量隨阻力與順應性改變；本題的波形不是這樣。"},{"id":"C","text":"PS（壓力支持）","rationale":"不符：PS 的特徵是由病人觸發，壓力為方波，流量遞減到峰值的某個比例就切換；吸氣時間隨病人與肺力學而變；本題的波形不是這樣。"}],"correctOptionId":"A","walkthrough":["先判斷模式：流量是固定的方波，每口潮氣量一樣。","VC-AC 的判定：吸氣流為固定方波（可加吸氣末停頓），壓力隨吸氣容積逐步上升；每口潮氣量固定。"],"reviewCaseId":"B01"},{"key":"problem","prompt":"這組成對送氣最符合哪種現象？","options":[{"id":"A","text":"正常、彼此獨立且充分呼出的兩次呼吸","rationale":"中間呼氣短且仍有容積保留，與充分呼出的獨立呼吸不符。"},{"id":"B","text":"Ineffective triggering","rationale":"本題確實產生了兩次送氣，並非努力後沒有送氣。"},{"id":"C","text":"Double triggering，伴隨 breath stacking","rationale":"兩次送氣間呼氣不足，且同一次努力跨越兩口，支持雙重觸發與容積堆疊。"}],"correctOptionId":"C","walkthrough":["成對出現、中間呼氣很短 → 可能是 stacking。","再看病人的動作：同一次吸氣跨越兩口送氣 → 不是兩次獨立呼吸。"]},{"key":"cause","prompt":"哪個機轉最符合本題觀察到的時序？","options":[{"id":"A","text":"病人的吸氣努力持續時間長於第一口機器吸氣期，切換後仍能再次觸發","rationale":"努力從第一口前開始且延續到切換後，能解釋第二次觸發。"},{"id":"B","text":"機器完全未偵測到病人的吸氣努力，所以沒有送氣","rationale":"與兩段完整正向流量和容積上升矛盾。"},{"id":"C","text":"病人已完成呼氣，下一次獨立努力才啟動第二口","rationale":"與題幹同一次持續努力、呼氣不完全的線索不符。"}],"correctOptionId":"A","walkthrough":["比較機器吸氣時間與病人努力時間：努力比機器吸氣更長。","機器切換後努力仍在，就再次觸發。"]},{"key":"resolution","prompt":"依這個機轉，最合理的設定調整方向是什麼？","options":[{"id":"A","text":"縮短吸氣時間","rationale":"會讓機器更早結束，病人的努力更容易延續到切換之後。"},{"id":"B","text":"延長吸氣時間或調整吸氣流速，使機器吸氣更貼近病人的需求","rationale":"讓機器吸氣涵蓋病人的努力，才不會被再次觸發；也可考慮提高潮氣量，或改用流量可隨需求變化的模式。"},{"id":"C","text":"降低觸發靈敏度","rationale":"本題是努力延續而被再次觸發，不是靈敏度過高。"}],"correctOptionId":"B","walkthrough":["雙重觸發會造成潮氣量疊加，增加過度膨脹風險，不要忽略。","不論調哪一項，都要重新看波形確認雙口送氣是否消失。"]}],"explanation":{"mechanismChain":["病人一次吸氣努力尚未結束","第一口機器吸氣先結束","持續努力再觸發一口，短暫呼氣不足以排出前一口容積"],"limitations":["僅見成對波形不能推定所有病例皆由此機轉造成；本題特別提供努力開始時間。","解說可疊加「模擬吸氣努力」標示時間關係，不當作常規量測。","實際堆疊量須由流量積分計算，不能在第二口直接硬設兩倍 VT。"]},"references":[{"sourceId":"B1","pdfPages":[9,10],"figure":"Figure 1B"}]},{"id":"C04","kind":"troubleshooting","category":"flow","scenarioId":"C04","title":"吸氣供流不足：病人需求超過固定供流","clinicalScenario":"ARDS 病人仍有自主吸氣努力。有明顯用力的呼吸，吸氣期壓力曲線出現凹陷；偶爾較被動的一口，凹陷較不明顯。床邊觀察：凹陷的呼吸伴隨較明顯的吸氣用力。","settingClues":"吸氣流維持設定的固定形狀，不隨病人較強的努力增加。","reviewStatus":"pending-clinical-review","steps":[{"key":"mode","prompt":"只看波形與數值（模式與設定已隱藏），這個畫面最可能是哪一種通氣模式？","options":[{"id":"A","text":"VC-AC（容積控制）","rationale":"符合：流量為固定方波，沒有隨病人努力而改變。"},{"id":"B","text":"PC-AC（壓力控制）","rationale":"不符：PC-AC 的特徵是吸氣壓力為方波，流量先高後遞減；吸氣時間固定，潮氣量隨阻力與順應性改變；本題的波形不是這樣。"},{"id":"C","text":"PS（壓力支持）","rationale":"不符：PS 的特徵是由病人觸發，壓力為方波，流量遞減到峰值的某個比例就切換；吸氣時間隨病人與肺力學而變；本題的波形不是這樣。"}],"correctOptionId":"A","walkthrough":["先判斷模式：流量為固定方波，沒有隨病人努力而改變。","VC-AC 的判定：吸氣流為固定方波（可加吸氣末停頓），壓力隨吸氣容積逐步上升；每口潮氣量固定。"],"reviewCaseId":"B01"},{"key":"problem","prompt":"本題吸氣期的壓力凹陷，最符合哪個問題？","options":[{"id":"A","text":"單純呼氣末 air trapping","rationale":"本題主要線索位在吸氣期，並與用力強弱及固定供流相關。"},{"id":"B","text":"Insufficient inspiratory flow／flow starvation","rationale":"固定供流無法匹配病人需求時，病人努力可使 Paw 出現凹陷。"},{"id":"C","text":"每口都完全沒有機器送氣","rationale":"已有持續吸氣流與容積增加，與完全未送氣不符。"}],"correctOptionId":"B","walkthrough":["比較用力與被動的呼吸：只有用力的那一口出現吸氣期壓力凹陷。","凹陷發生在吸氣中段，不是呼氣末，所以不是 air trapping。"]},{"key":"cause","prompt":"哪個原因最能解釋本題波形？","options":[{"id":"A","text":"呼吸系統順應性下降本身，就足以解釋每次與吸氣努力同步的凹陷","rationale":"低順應性可影響壓力，但不能單獨解釋本題與努力強弱同步的 scooping。"},{"id":"B","text":"機器提供的吸氣流量過大，造成壓力快速 overshoot","rationale":"這與供流不足的凹陷及病人持續用力線索方向不同。"},{"id":"C","text":"病人當下吸氣需求高於機器提供的固定吸氣流","rationale":"用力時 Paw 凹陷、固定供流未增加，且較被動呼吸凹陷減輕，共同支持此機轉。"}],"correctOptionId":"C","walkthrough":["固定的流量無法隨病人的需求增加。","病人持續用力，Paw 就被拉低而出現凹陷。"]},{"key":"resolution","prompt":"依這個原因，最合理的處理方向是什麼？","options":[{"id":"A","text":"降低吸氣流速","rationale":"會讓供流更不足，凹陷更明顯。"},{"id":"B","text":"提高吸氣流速，或改用流量可隨病人需求改變的模式","rationale":"讓供流跟上需求；實務上也會評估鎮靜、疼痛與換氣需求。"},{"id":"C","text":"提高 PEEP","rationale":"PEEP 與吸氣期供流不足無直接關係。"}],"correctOptionId":"B","walkthrough":["提高流速後要重新看壓力曲線凹陷是否變淺，並確認沒有出現過衝。","同樣的想法在壓力控制或壓力支持是調整上升時間。"]}],"explanation":{"mechanismChain":["病人吸氣需求／努力增加","固定吸氣流未隨需求提高","病人持續用力，Paw 在吸氣期出現凹陷"],"limitations":["本題 ARDS 只是背景，並非看到 ARDS 就應選 flow starvation。","沒有體溫、疼痛或酸鹼資料，不再追問是哪一個因素造成需求升高。","此處不提供調整流量或其他處置的作答功能。"]},"references":[{"sourceId":"B1","pdfPages":[10,11],"figure":"Figure 2"},{"sourceId":"ZH","pdfPages":[15],"note":"原題為處置題；本題改寫為辨識及原因。"}]},{"id":"C05","kind":"troubleshooting","category":"cycling","scenarioId":"C05","title":"過早切換：機器吸氣早於病人努力結束","clinicalScenario":"病人有自主呼吸。機器轉入呼氣後，床邊仍可見短暫吸氣動作；呼氣流受到干擾。這些事件沒有再觸發第二次機器送氣。切換後的動作是吸氣，不是咳嗽或主動用力吐氣。","settingClues":"切換門檻設定在吸氣流仍相對較高時就切換（峰值流量的 60%）。","reviewStatus":"pending-clinical-review","steps":[{"key":"mode","prompt":"只看波形與數值（模式與設定已隱藏），這個畫面最可能是哪一種通氣模式？","options":[{"id":"A","text":"VC-AC（容積控制）","rationale":"不符：VC-AC 的特徵是吸氣流為固定方波（可加吸氣末停頓），壓力隨吸氣容積逐步上升；每口潮氣量固定；本題的波形不是這樣。"},{"id":"B","text":"PC-AC（壓力控制）","rationale":"不符：PC-AC 的特徵是吸氣壓力為方波，流量先高後遞減；吸氣時間固定，潮氣量隨阻力與順應性改變；本題的波形不是這樣。"},{"id":"C","text":"PS（壓力支持）","rationale":"符合：壓力方波、流量遞減；吸氣在流量仍高時就結束。"}],"correctOptionId":"C","walkthrough":["先判斷模式：壓力方波、流量遞減；吸氣在流量仍高時就結束。","PS 的判定：由病人觸發，壓力為方波，流量遞減到峰值的某個比例就切換；吸氣時間隨病人與肺力學而變。"],"reviewCaseId":"B04"},{"key":"problem","prompt":"本題最符合哪一種 cycling 異常？","options":[{"id":"A","text":"Premature cycling","rationale":"機器已切換呼氣，但病人仍在吸氣，表示機器吸氣結束相對過早。"},{"id":"B","text":"Delayed cycling","rationale":"Delayed cycling 是病人已想結束吸氣，機器仍持續送氣，與本題時序相反。"},{"id":"C","text":"Double triggering","rationale":"雖可能有相關機轉，本題未產生第二次機器送氣，因此不符合這個現象。"}],"correctOptionId":"A","walkthrough":["先看切換之後的呼氣流：開頭被向上拉了一下 → 病人仍在吸氣。","沒有第二口機器送氣，所以不是雙重觸發。"]},{"key":"cause","prompt":"依 PSV 設定與努力時序，本題最支持哪個原因？","options":[{"id":"A","text":"病人的吸氣努力已結束很久，機器仍持續維持送氣","rationale":"這是切換過晚的時序，與機器先結束相反。"},{"id":"B","text":"flow-cycling 的相對流量門檻偏高，使機器比病人需求更早結束吸氣","rationale":"題目提供較高流量即切換與切換後持續努力，支持這個原因。"},{"id":"C","text":"備援呼吸頻率固定到點，因此每次結束自主呼吸","rationale":"本題為 PSV 的 flow-cycling 事件，不能以備援頻率解釋其吸氣終止時序。"}],"correctOptionId":"B","walkthrough":["畫面設定：切換門檻是峰值流量的 60%，偏高。","流量一降到 60% 機器就結束，比病人想結束的時間更早。"]},{"key":"resolution","prompt":"依這個原因，最合理的設定調整方向是什麼？","options":[{"id":"A","text":"提高切換門檻百分比","rationale":"會讓切換更早，過早切換更嚴重。"},{"id":"B","text":"降低切換門檻百分比，讓吸氣延長到病人需要的時間","rationale":"降低百分比，機器就要等流量降得更低才切換；文獻也提到可提高支持壓或降低切換百分比。"},{"id":"C","text":"降低 PEEP","rationale":"PEEP 與切換時間無直接關係。"}],"correctOptionId":"B","walkthrough":["調整後要確認呼氣初期的流量干擾消失，同時不要變成延遲切換（C06）。","過早與延遲是同一個旋鈕的兩端：找到病人與機器的中間點。"]}],"explanation":{"mechanismChain":["吸氣流下降到本題較高的 cycling 門檻","呼吸器提早切換呼氣","病人吸氣努力仍持續，干擾初始呼氣流"],"limitations":["此題需設定為 flow-cycled PSV，不能只改模式標籤而沿用 VC 波形。","若實作導致第二次送氣，應重新標記題型或調整情境，不可仍將 double triggering 列為一定錯誤。","努力時序需有可見觀察卡支持；解說才可疊加模擬努力。"]},"references":[{"sourceId":"B1","pdfPages":[11],"figure":"Figure 3，premature cycling"}]},{"id":"C06","kind":"troubleshooting","category":"cycling","scenarioId":"C06","title":"延遲切換：阻塞背景下 PSV 送氣持續過久","clinicalScenario":"有阻塞性肺病背景的病人。吸氣流下降緩慢，部分呼吸在機器仍維持支持壓時，病人已開始想吐氣；床邊可見主動呼氣動作，沒有咳嗽。","settingClues":"切換門檻設定為峰值流量的較低比例（10%）；吸氣末可見壓力短暫抬升，不是每口都有。","reviewStatus":"pending-clinical-review","steps":[{"key":"mode","prompt":"只看波形與數值（模式與設定已隱藏），這個畫面最可能是哪一種通氣模式？","options":[{"id":"A","text":"VC-AC（容積控制）","rationale":"不符：VC-AC 的特徵是吸氣流為固定方波（可加吸氣末停頓），壓力隨吸氣容積逐步上升；每口潮氣量固定；本題的波形不是這樣。"},{"id":"B","text":"PC-AC（壓力控制）","rationale":"不符：PC-AC 的特徵是吸氣壓力為方波，流量先高後遞減；吸氣時間固定，潮氣量隨阻力與順應性改變；本題的波形不是這樣。"},{"id":"C","text":"PS（壓力支持）","rationale":"符合：壓力方波、流量遞減，機器吸氣持續較久。"}],"correctOptionId":"C","walkthrough":["先判斷模式：壓力方波、流量遞減，機器吸氣持續較久。","PS 的判定：由病人觸發，壓力為方波，流量遞減到峰值的某個比例就切換；吸氣時間隨病人與肺力學而變。"],"reviewCaseId":"B04"},{"key":"problem","prompt":"本題機器與病人的吸氣終止時序，最符合哪種問題？","options":[{"id":"A","text":"Premature cycling","rationale":"Premature cycling 是機器先停止吸氣，而本題是機器送氣持續超過病人需求。"},{"id":"B","text":"單純 ineffective triggering","rationale":"本題呼吸已被觸發且持續送氣，主要問題在吸氣終止時序。"},{"id":"C","text":"Delayed cycling","rationale":"病人已準備或開始吐氣，機器仍維持吸氣支持，符合延遲切換。"}],"correctOptionId":"C","walkthrough":["吸氣末 Paw 抬升、流量仍在緩慢下降 → 病人在對抗機器。","這是機器太晚結束，與 C05 相反。"]},{"key":"cause","prompt":"本題的流量形狀與 cycling 設定，最支持哪個機轉？","options":[{"id":"A","text":"吸氣流下降慢，又需等到較低的相對流量門檻，因而較晚切換","rationale":"本題阻塞背景、緩慢 flow 下降及較低 cycling 門檻共同支持。"},{"id":"B","text":"吸氣流還很高時便達到偏高門檻，機器過早停止","rationale":"這與本題較低門檻及機器過晚停止的線索相反。"},{"id":"C","text":"病人的努力小到完全未能觸發任何送氣","rationale":"本題已有明確壓力支持與吸氣流，不符合完全未觸發。"}],"correctOptionId":"A","walkthrough":["阻塞背景使吸氣流下降緩慢，需要較久才能降到低門檻。","低門檻使切換更晚；病人已先進入呼氣需求。"]},{"key":"resolution","prompt":"依這個原因，最合理的設定調整方向是什麼？","options":[{"id":"A","text":"降低切換門檻百分比","rationale":"會讓切換更晚，延遲切換更嚴重。"},{"id":"B","text":"提高切換門檻百分比，使機器較早結束吸氣","rationale":"提高百分比讓機器在流量較高時切換，縮短過長的吸氣；仍要處理阻塞（例如支氣管擴張劑）。"},{"id":"C","text":"提高支持壓力","rationale":"會讓吸氣更久、流量更大，無助於縮短吸氣。"}],"correctOptionId":"B","walkthrough":["同時評估阻塞本身是否可以改善；設定只是補救。","調整後要確認不會變成過早切換（C05）。"]}],"explanation":{"mechanismChain":["本題阻塞背景下吸氣流下降較慢","較低的相對 cycling 門檻使機器等待更久","病人先進入呼氣需求，機器才切換，可能出現吸氣末 Paw 抬升"],"limitations":["不能將所有 COPD 病人一律設定為 delayed cycling；必須由本題條件產生。","吸氣末壓力抬升還可有其他來源，本題必須提供呼氣動作與無咳嗽的觀察。","不使用不同品牌 rise-time 數字方向來替代 cycling 機轉。"]},"references":[{"sourceId":"B1","pdfPages":[11],"figure":"Figure 3，delayed cycling"}]},{"id":"C07","kind":"troubleshooting","category":"airtrap","scenarioId":"C07","title":"呼氣未完成：嚴重支氣管痙攣背景的 air trapping","clinicalScenario":"嚴重支氣管痙攣病人，接受控制通氣，無自主努力，管路檢查沒有發現漏氣。每次下一口吸氣開始時，前一口的呼氣流仍明顯低於零；沒有做 expiratory hold。","settingClues":"固定呼吸週期，可用呼氣時間有限。","reviewStatus":"pending-clinical-review","steps":[{"key":"mode","prompt":"只看波形與數值（模式與設定已隱藏），這個畫面最可能是哪一種通氣模式？","options":[{"id":"A","text":"VC-AC（容積控制）","rationale":"符合：流量為固定方波，吸氣期壓力隨容積上升。"},{"id":"B","text":"PC-AC（壓力控制）","rationale":"不符：PC-AC 的特徵是吸氣壓力為方波，流量先高後遞減；吸氣時間固定，潮氣量隨阻力與順應性改變；本題的波形不是這樣。"},{"id":"C","text":"PS（壓力支持）","rationale":"不符：PS 的特徵是由病人觸發，壓力為方波，流量遞減到峰值的某個比例就切換；吸氣時間隨病人與肺力學而變；本題的波形不是這樣。"}],"correctOptionId":"A","walkthrough":["先判斷模式：流量為固定方波，吸氣期壓力隨容積上升。","VC-AC 的判定：吸氣流為固定方波（可加吸氣末停頓），壓力隨吸氣容積逐步上升；每口潮氣量固定。"],"reviewCaseId":"B01"},{"key":"problem","prompt":"最值得辨識的異常是什麼？","options":[{"id":"A","text":"單純 inspiratory pause","rationale":"吸氣停頓應在吸氣末呈現零流量時段，不能解釋下一口前仍持續的負向呼氣流。"},{"id":"B","text":"呼氣未完成，支持 air trapping／Auto-PEEP 的疑慮","rationale":"下一口開始前仍有呼氣流，在本題無漏氣、無努力的條件下支持呼氣未完成。"},{"id":"C","text":"病人無效吸氣努力造成的短暫流量偏移","rationale":"本題無自主努力，且觀察到的是持續未回零的呼氣流，不是局部努力造成的短暫偏移。"}],"correctOptionId":"B","walkthrough":["找一口呼氣的結尾，再看下一口吸氣開始前的流量：還沒回到零。","沒有自主努力與漏氣，所以不是無效觸發或漏氣。"]},{"key":"cause","prompt":"依本題背景與流量形狀，哪個原因最符合？","options":[{"id":"A","text":"每口開始前肺部都已完全排空，只是壓力標籤錯誤","rationale":"與持續呼氣流及被打斷的呼氣段不符。"},{"id":"B","text":"呼吸器觸發過度敏感，心臟震盪反覆啟動自主送氣","rationale":"本題是時間觸發控制呼吸，並未提供心臟相關額外觸發事件。"},{"id":"C","text":"阻塞造成排氣緩慢，目前可用呼氣時間不足以完成排氣","rationale":"呼氣流平滑而持續、病人阻塞背景，以及呼氣被下一口打斷，共同支持此機轉。"}],"correctOptionId":"C","walkthrough":["阻塞使排氣緩慢。","固定的呼吸週期留給呼氣的時間不夠，下一口就來了。"]},{"key":"resolution","prompt":"病人被動、沒有自主努力。依這個原因，最合理的處理方向是什麼？","options":[{"id":"A","text":"提高 PEEP","rationale":"被動病人的 air trapping 若再加 PEEP 會更糟；外源 PEEP 只在有自主努力、氣流受限而觸發困難時才可能有幫助。"},{"id":"B","text":"降低呼吸次數或縮短吸氣時間，讓呼氣時間變長，同時使用支氣管擴張劑","rationale":"增加呼氣時間讓氣體排空；可容忍較高的 PaCO₂ 與較高的 Ppeak，重點看 Pplat。"},{"id":"C","text":"提高呼吸次數","rationale":"會再縮短呼氣時間，air trapping 更嚴重。"}],"correctOptionId":"B","walkthrough":["先確認 Pplat 在安全範圍，不要只看 Ppeak。","本題與有自主努力的 COPD 不同：處置要看病人是否被動。","與 C13（PC-AC 的潮氣量不足）成對比較：同樣是支氣管痙攣，目標不同，處置就不同。"]}],"explanation":{"mechanismChain":["嚴重支氣管痙攣使本題呼氣排空較慢","既定週期的可用呼氣時間不足","下一口開始時仍有呼氣流，形成 air trapping／內在 PEEP 的風險與疑慮"],"limitations":["波形用於辨識呼氣未完成，不直接提供 intrinsic PEEP 的數值。","若之後要顯示 measured auto-PEEP，需另有有效 expiratory hold 的條件與結果。","Volume 是感測流量的積分顯示，不是可直接量到絕對肺容積；重設顯示基準不得宣稱肺已排空。","題目不將峰值氣道壓直接視為肺泡壓。"]},"references":[{"sourceId":"B1","pdfPages":[14,19],"figure":"Monitoring／auto-PEEP；COPD 呼氣時間機轉"},{"sourceId":"ZH","pdfPages":[21]},{"sourceId":"R2013","pdfPages":[5,6],"figure":"Figures 9–10，補充圖解"}]},{"id":"C08","kind":"troubleshooting","category":"leak","scenarioId":"C08","title":"漏氣：呼吸管路接頭密合不全","clinicalScenario":"控制通氣中，無自主努力。多口呼吸的呼出潮氣量持續低於吸入潮氣量；呼氣流可在下一口前回到接近零。床邊檢查：某呼吸管路接頭吸氣時可聽見逸氣聲；ETT 套囊檢查正常。","settingClues":"流量與容積以未作漏氣補償的量測基準呈現。","reviewStatus":"pending-clinical-review","steps":[{"key":"mode","prompt":"只看波形與數值（模式與設定已隱藏），這個畫面最可能是哪一種通氣模式？","options":[{"id":"A","text":"VC-AC（容積控制）","rationale":"符合：流量為固定方波，吸氣流與壓力隨容積上升。"},{"id":"B","text":"PC-AC（壓力控制）","rationale":"不符：PC-AC 的特徵是吸氣壓力為方波，流量先高後遞減；吸氣時間固定，潮氣量隨阻力與順應性改變；本題的波形不是這樣。"},{"id":"C","text":"PS（壓力支持）","rationale":"不符：PS 的特徵是由病人觸發，壓力為方波，流量遞減到峰值的某個比例就切換；吸氣時間隨病人與肺力學而變；本題的波形不是這樣。"}],"correctOptionId":"A","walkthrough":["先判斷模式：流量為固定方波，吸氣流與壓力隨容積上升。","VC-AC 的判定：吸氣流為固定方波（可加吸氣末停頓），壓力隨吸氣容積逐步上升；每口潮氣量固定。"],"reviewCaseId":"B01"},{"key":"problem","prompt":"多口 VTi／VTe 差異與床邊線索最支持哪個問題？","options":[{"id":"A","text":"Leak／漏氣","rationale":"持續回收量不足，配合接頭逸氣線索，支持漏氣。"},{"id":"B","text":"單純 breath stacking","rationale":"本題無相鄰雙重送氣，且呼氣可回零；漏氣線索更能解釋持續回收量不足。"},{"id":"C","text":"單純流量不足引起的吸氣壓力凹陷","rationale":"本題無自主努力，也未以吸氣 scooping 為主要線索；不能解釋接頭逸氣。"}],"correctOptionId":"A","walkthrough":["比較多口的 VTi 與 VTe：持續是 VTe 比較小。","呼氣流有回零，所以不是 air trapping；再配合接頭逸氣聲。"]},{"key":"cause","prompt":"本題哪一個原因最有直接線索支持？","options":[{"id":"A","text":"病人順應性下降，所有送入氣體仍完整回到量測端","rationale":"順應性改變本身不能解釋接頭逸氣及持續量測回收差。"},{"id":"B","text":"呼吸管路接頭密合不全，使部分氣體未經正常回收路徑返回量測端","rationale":"定位到接頭的逸氣線索與持續 VTi／VTe 差支持本題漏氣來源。"},{"id":"C","text":"PSV 的 cycling 門檻偏高，提早停止支持","rationale":"本題模式是 VC-AC，且沒有 PSV cycling 事件可支持此原因。"}],"correctOptionId":"B","walkthrough":["接頭密合不全是直接的證據。","漏氣使部分氣體沒有經過量測端回來。"]},{"key":"resolution","prompt":"依這個原因，最合理的處理方向是什麼？","options":[{"id":"A","text":"提高潮氣量來補償","rationale":"會增加漏出的氣體與壓力，沒有解決原因。"},{"id":"B","text":"檢查並重新接好管路接頭，處理後再比對 VTi 與 VTe","rationale":"先解決漏氣的來源，再重新確認回收量。"},{"id":"C","text":"讓觸發更敏感","rationale":"與漏氣的來源無關。"}],"correctOptionId":"B","walkthrough":["漏氣也會干擾觸發與壓力量測，所以先處理漏氣再調其他設定。","處理後 VTi 與 VTe 接近、F-V 迴圈閉合，才算完成。"]}],"explanation":{"mechanismChain":["管路接頭密合不全","部分送出氣體由接頭逸出，未經預期的回收量測路徑","在本題感測與顯示規則下，出現持續 VTi 大於 VTe"],"limitations":["僅憑 VTi 大於 VTe 不能唯一定位漏點，必須保留接頭檢查線索。","原講義第 8 頁以 bronchopleural fistula 為答案；本題並未沿用該病因，而是加入接頭定位線索重新編寫。","感測位置、漏氣位置與補償方式會影響數值；引擎必須先定義，不能任意讓流量、容積與數值各自跳動。","本題不以單口差值排除暫時性氣體滯留，需使用多口穩定觀察及床邊定位。"]},"references":[{"sourceId":"ZH","pdfPages":[8],"note":"僅參考回收量差的題材；病因與題幹已改寫。"},{"sourceId":"B1","pdfPages":[10],"figure":"Figure 1C，leak 與 volume 不回基準的相關圖解"},{"sourceId":"R2013","pdfPages":[5,6],"figure":"Figure 10，量測流量／容積與漏氣圖解"}]},{"id":"C09","kind":"troubleshooting","category":"pressure","scenarioId":"C09","title":"高壓警報：氣道阻力上升（分泌物／阻塞）— Ppeak 高、Pplat 不高","clinicalScenario":"控制通氣中高氣道壓警報響起，無自主努力，管路接頭無漏氣。近期痰量增加，氣管內可聽到痰音。每口吸氣末有短暫停頓，壓力在停頓期下降。請比較尖峰壓與停頓末壓力（Pplat）的差距，並觀察 Loops 區 F-V 迴圈呼氣段的形狀。","settingClues":"固定吸氣流並加入短暫吸氣末停頓（0.3 秒，教學簡化）。","reviewStatus":"pending-clinical-review","steps":[{"key":"mode","prompt":"只看波形與數值（模式與設定已隱藏），這個畫面最可能是哪一種通氣模式？","options":[{"id":"A","text":"VC-AC（容積控制）","rationale":"符合：流量為固定方波，壓力在吸氣期上升，吸氣末有零流量停頓。"},{"id":"B","text":"PC-AC（壓力控制）","rationale":"不符：PC-AC 的特徵是吸氣壓力為方波，流量先高後遞減；吸氣時間固定，潮氣量隨阻力與順應性改變；本題的波形不是這樣。"},{"id":"C","text":"PS（壓力支持）","rationale":"不符：PS 的特徵是由病人觸發，壓力為方波，流量遞減到峰值的某個比例就切換；吸氣時間隨病人與肺力學而變；本題的波形不是這樣。"}],"correctOptionId":"A","walkthrough":["先判斷模式：流量為固定方波，壓力在吸氣期上升，吸氣末有零流量停頓。","VC-AC 的判定：吸氣流為固定方波（可加吸氣末停頓），壓力隨吸氣容積逐步上升；每口潮氣量固定。"],"reviewCaseId":"B01"},{"key":"problem","prompt":"Ppeak 明顯升高，但停頓末壓力（Pplat）不高。最符合哪一種力學變化？","options":[{"id":"A","text":"順應性下降，Ppeak 與 Pplat 一起升高","rationale":"順應性下降時 Ppeak 與 Pplat 同步升高、兩者差距不變；本題差距明顯擴大。"},{"id":"B","text":"氣道（含氣管內管）阻力上升","rationale":"Ppeak 與 Pplat 的差距反映克服流量阻力的壓力；固定吸氣流下差距擴大，支持阻力上升。"},{"id":"C","text":"病人吸氣努力造成壓力假性升高","rationale":"本題無自主努力；努力會使 Paw 下降或波形變形，而不是造成穩定的 Ppeak 升高。"}],"correctOptionId":"B","walkthrough":["Ppeak 與 Pplat 的差距遠大於基本題 → 流量阻力大。","Pplat 本身不高 → 肺的彈性回彈沒有明顯變差。"]},{"key":"cause","prompt":"呼氣段 flow-volume 迴圈出現鋸齒，床邊有痰音。依 DOPE 的 O（Obstruction），最先考慮哪個原因？","options":[{"id":"A","text":"肺水腫使肺順應性下降","rationale":"順應性下降主要表現為 Pplat 升高、P-V 迴圈傾向橫軸，不會單獨造成呼氣流鋸齒與 Ppeak–Pplat 差距擴大。"},{"id":"B","text":"氣管內或管路內分泌物／痰栓造成阻塞","rationale":"呼氣段鋸齒配合痰音與阻力上升，是分泌物的典型線索（Mellema 圖 17）；仍需合併臨床判斷。"},{"id":"C","text":"呼吸器觸發過於敏感","rationale":"過度敏感造成的是額外送氣；本題呼吸為固定時間觸發，且問題出在壓力差與呼氣流形狀。"}],"correctOptionId":"B","walkthrough":["呼氣段 F-V 迴圈鋸齒 + 痰音 → 分泌物。","先考慮 DOPE 的 O（阻塞）。"]},{"key":"resolution","prompt":"依這個原因，最合理的處理方向是什麼？","options":[{"id":"A","text":"調高壓力警報上限，不處理阻塞","rationale":"只讓警報不響，阻塞仍在，通氣與病人安全沒有改善。"},{"id":"B","text":"抽痰並確認管路暢通，視需要使用支氣管擴張劑，然後比對 Ppeak 與 Pplat 是否回到較小的差距","rationale":"針對阻力上升的原因處理，並用 Ppeak−Pplat 差距確認改善。"},{"id":"C","text":"提高潮氣量","rationale":"會讓壓力更高，沒有處理阻力。"}],"correctOptionId":"B","walkthrough":["高壓警報先分兩類：差距擴大找阻力、一起升高找順應性。","DOPE：D 內管位置、O 阻塞、P 氣胸、E 設備。"]}],"explanation":{"mechanismChain":["分泌物使氣道與氣管內管的阻力上升","固定吸氣流下，流量乘以阻力使 Ppeak 升高；停頓期流量為零，壓力降到反映彈性回彈的 Pplat","Ppeak 與 Pplat 差距擴大；呼氣流受分泌物擾動，flow-volume 迴圈呼氣段呈鋸齒"],"limitations":["單腔室模型沒有 pendelluft，Ppeak 到 Pplat 為瞬間下降；真實 Pplat 需要停頓約 2–3 秒穩定。","本題停頓僅 0.3 s，是教學簡化；有效 Pplat 另需無自主努力與無漏氣。","鋸齒是腳本化擾動，不能單憑波形決定處置；需合併聽診、病人狀況與其他線索。"]},"references":[{"sourceId":"R2013","pdfPages":[4],"figure":"Figure 6：阻力上升與順應性下降對 PIP／Pplat 的影響"},{"sourceId":"R2013","pdfPages":[9],"figure":"Figure 17：呼氣段鋸齒與分泌物"},{"sourceId":"B1","pdfPages":[14],"figure":"Figure 4：吸氣停頓與阻力估算；停頓壓測量條件"}]},{"id":"C10","kind":"troubleshooting","category":"pressure","scenarioId":"C10","title":"高壓警報：順應性下降 — Ppeak 與 Pplat 一起升高","clinicalScenario":"控制通氣中高氣道壓警報響起，無自主努力，管路無漏氣。病人剛翻身後不久；右側呼吸音較左側弱，氣管內管深度尚待確認。吸氣末停頓期間壓力下降，但停在仍偏高的位置。","settingClues":"固定吸氣流並加入短暫吸氣末停頓（0.3 秒，教學簡化）。","reviewStatus":"pending-clinical-review","steps":[{"key":"mode","prompt":"只看波形與數值（模式與設定已隱藏），這個畫面最可能是哪一種通氣模式？","options":[{"id":"A","text":"VC-AC（容積控制）","rationale":"符合：流量為固定方波，壓力在吸氣期上升，吸氣末有零流量停頓。"},{"id":"B","text":"PC-AC（壓力控制）","rationale":"不符：PC-AC 的特徵是吸氣壓力為方波，流量先高後遞減；吸氣時間固定，潮氣量隨阻力與順應性改變；本題的波形不是這樣。"},{"id":"C","text":"PS（壓力支持）","rationale":"不符：PS 的特徵是由病人觸發，壓力為方波，流量遞減到峰值的某個比例就切換；吸氣時間隨病人與肺力學而變；本題的波形不是這樣。"}],"correctOptionId":"A","walkthrough":["先判斷模式：流量為固定方波，壓力在吸氣期上升，吸氣末有零流量停頓。","VC-AC 的判定：吸氣流為固定方波（可加吸氣末停頓），壓力隨吸氣容積逐步上升；每口潮氣量固定。"],"reviewCaseId":"B01"},{"key":"problem","prompt":"Ppeak 與 Pplat 一起升高，兩者差距沒有擴大。最符合哪一種力學變化？","options":[{"id":"A","text":"氣道阻力上升","rationale":"阻力上升時 Ppeak 升高而 Pplat 不一定升高，差距會擴大；本題差距沒有擴大。"},{"id":"B","text":"順應性下降（可通氣的肺／胸壁彈性空間減少）","rationale":"Ppeak 與 Pplat 同步升高、差距不變，是順應性下降的典型模式；P-V 迴圈斜率變小。"},{"id":"C","text":"管路漏氣","rationale":"漏氣會使回收容積不足與迴圈不閉合；本題容積可回收，迴圈閉合。"}],"correctOptionId":"B","walkthrough":["Ppeak 與 Pplat 一起升高，差距沒有擴大。","Pplat 偏高 → 彈性回彈壓升高，不是單純阻力。"]},{"key":"cause","prompt":"依 DOPE，哪一組原因最適合與此波形同時評估？","options":[{"id":"A","text":"痰栓、氣管內管扭折或咬管（O）","rationale":"這組主要使阻力上升，會擴大 Ppeak–Pplat 差距；與本題波形不符。"},{"id":"B","text":"氣管內管移入單側主支氣管、氣胸等（D、P），以及肺水腫、腹壓上升","rationale":"可通氣的肺或胸壁空間減少都會使 Pplat 升高；床邊右側呼吸音減弱支持需要檢查位置與氣胸。"},{"id":"C","text":"呼吸器觸發過度敏感造成 auto-triggering","rationale":"觸發問題改變的是送氣時機與次數，不會造成穩定的 Pplat 升高。"}],"correctOptionId":"B","walkthrough":["DOPE 的 D 與 P：內管位置、氣胸；也要想肺水腫與腹壓上升。","右側呼吸音減弱支持單側通氣不足。"]},{"key":"resolution","prompt":"依這個原因，最合理的處理方向是什麼？","options":[{"id":"A","text":"抽痰為主，其他不動","rationale":"抽痰針對阻力上升，與 Pplat 升高的原因不同。"},{"id":"B","text":"確認氣管內管位置、聽診與影像評估氣胸等原因，同時避免用更高的壓力或潮氣量硬打","rationale":"先找出順應性下降的原因，並避免加重過度膨脹。"},{"id":"C","text":"提高潮氣量以維持通氣","rationale":"會讓 Pplat 更高，更容易造成肺損傷。"}],"correctOptionId":"B","walkthrough":["這是需要立即處理的情況，不是只調設定。","Pplat 超過 28–30 cmH₂O 要找原因，不要忽略。"]}],"explanation":{"mechanismChain":["可通氣的肺或胸壁彈性空間減少，使順應性下降","同樣的潮氣量需要更高的彈性回彈壓，Pplat 與 Ppeak 同步升高","Ppeak–Pplat 差距不變，P-V 迴圈向橫軸旋轉，需要找出 D、P 等原因"],"limitations":["波形無法分辨氣胸、單側插管、肺水腫或腹壓上升；必須合併床邊檢查與影像。","Pplat 高於 28–30 cmH₂O 提示低靜態順應性（B1），不是治療處方。","本題停頓為 0.3 s 的教學簡化，真實 Pplat 需約 2–3 秒穩定且無自主努力與漏氣。"]},"references":[{"sourceId":"R2013","pdfPages":[4],"figure":"Figure 6：順應性下降時 PIP 與 Pplat 一起升高"},{"sourceId":"R2013","pdfPages":[7],"figure":"Figure 12：順應性下降使 P-V 迴圈旋轉"},{"sourceId":"B1","pdfPages":[14],"figure":"停頓壓條件；Pplat 超過 28–30 cmH₂O 的調查建議"}]},{"id":"C11","kind":"troubleshooting","category":"pressure","scenarioId":"C11","title":"過度膨脹：P-V 迴圈出現 beaking（吸氣末鳥嘴）","clinicalScenario":"控制通氣，無自主努力，管路無漏氣。吸氣末段壓力快速上升，但容積增加很少；Pplat 超過 30 cmH₂O，Ppeak 與 Pplat 的差距不大。請看 P-V 迴圈吸氣支末段的形狀。","settingClues":"設定潮氣量相對偏大（600 mL）。","reviewStatus":"pending-clinical-review","steps":[{"key":"mode","prompt":"只看波形與數值（模式與設定已隱藏），這個畫面最可能是哪一種通氣模式？","options":[{"id":"A","text":"VC-AC（容積控制）","rationale":"符合：流量為固定方波，壓力在吸氣期上升，吸氣末有零流量停頓。"},{"id":"B","text":"PC-AC（壓力控制）","rationale":"不符：PC-AC 的特徵是吸氣壓力為方波，流量先高後遞減；吸氣時間固定，潮氣量隨阻力與順應性改變；本題的波形不是這樣。"},{"id":"C","text":"PS（壓力支持）","rationale":"不符：PS 的特徵是由病人觸發，壓力為方波，流量遞減到峰值的某個比例就切換；吸氣時間隨病人與肺力學而變；本題的波形不是這樣。"}],"correctOptionId":"A","walkthrough":["先判斷模式：流量為固定方波，壓力在吸氣期上升，吸氣末有零流量停頓。","VC-AC 的判定：吸氣流為固定方波（可加吸氣末停頓），壓力隨吸氣容積逐步上升；每口潮氣量固定。"],"reviewCaseId":"B01"},{"key":"problem","prompt":"P-V 迴圈吸氣支末段向上翹起（beaking）。最符合哪一種現象？","options":[{"id":"A","text":"管路漏氣","rationale":"漏氣使迴圈不閉合；本題迴圈閉合，翹起位在吸氣末。"},{"id":"B","text":"肺泡過度膨脹，容積增加很少而壓力快速上升","rationale":"beaking 表示順應性在高容積處明顯下降，是過度膨脹的典型圖形（Mellema 圖 13）。"},{"id":"C","text":"吸氣流量不足造成的壓力凹陷","rationale":"供流不足使吸氣支出現凹陷，位置在吸氣中段，而不是末段翹起。"}],"correctOptionId":"B","walkthrough":["P-V 迴圈吸氣支末段向上翹起，是過度膨脹的典型圖形。","鳥喙代表壓力快速上升而容積增加有限。"]},{"key":"cause","prompt":"哪個原因最能解釋這組圖形？","options":[{"id":"A","text":"吸氣流量設定太低","rationale":"流量不足會使吸氣中段的壓力凹陷，不會在吸氣末造成鳥喙。"},{"id":"B","text":"潮氣量相對於可用的肺容積過大，吸氣末進入順應性下降區","rationale":"同一個容積增量需要更高的壓力，且 Pplat 偏高。"},{"id":"C","text":"氣道阻力上升","rationale":"阻力上升會擴大 Ppeak 與 Pplat 的差距；本題差距不大。"}],"correctOptionId":"B","walkthrough":["Ppeak 與 Pplat 差距不大 → 不是阻力。","鳥喙 + Pplat 偏高 → 容積相對過大。"]},{"key":"resolution","prompt":"依這個原因，最合理的處理方向是什麼？","options":[{"id":"A","text":"提高潮氣量改善換氣","rationale":"會讓 Pplat 與驅動壓更高，加重過度膨脹。"},{"id":"B","text":"降低潮氣量，使 Pplat 與驅動壓下降到較安全的範圍","rationale":"降低過度膨脹，並由其他方式處理換氣（例如容忍較高 PaCO₂、調整呼吸次數）。"},{"id":"C","text":"縮短吸氣末停頓","rationale":"停頓不是原因，縮短不會改變過度膨脹。"}],"correctOptionId":"B","walkthrough":["設定潮氣量時用預測體重，並看 Pplat 與驅動壓。","本題 Pplat 偏高又有鳥喙，兩者一起提示過度膨脹。"]}],"explanation":{"mechanismChain":["潮氣量較大，吸氣末段肺進入順應性下降區","同樣的容積增量需要更高壓力，P-V 迴圈吸氣支末端翹起","Pplat 與驅動壓偏高，提示容積傷害風險"],"limitations":["本題的上拐點是以二次剛性模型模擬的教學簡化，不是真實肺的壓力–容積關係。","beaking 也可由感測訊號中止造成（小病人）；不能單憑圖形下結論（Mellema）。","潮氣量和壓力的實際調整需依預測體重、驅動壓與臨床狀況，本原型不提供處置建議。"]},"references":[{"sourceId":"R2013","pdfPages":[8],"figure":"Figure 13、14：過度膨脹 beaking；上下拐點"},{"sourceId":"B1","pdfPages":[14],"figure":"Pplat 超過 28–30 cmH₂O 的調查建議"}]},{"id":"C12","kind":"troubleshooting","category":"flow","scenarioId":"C12","title":"壓力過衝：吸氣初期供流／上升過快","clinicalScenario":"病人每口都有吸氣努力。每次送氣一開始，氣道壓力先衝到比平台更高的位置，之後才回到平台；吸氣尾段沒有額外的壓力尖峰，吸氣流正常下降後切換。","settingClues":"壓力支持設定為 10 cmH₂O。","reviewStatus":"pending-clinical-review","steps":[{"key":"mode","prompt":"只看波形與數值（模式與設定已隱藏），這個畫面最可能是哪一種通氣模式？","options":[{"id":"A","text":"VC-AC（容積控制）","rationale":"不符：VC-AC 的特徵是吸氣流為固定方波（可加吸氣末停頓），壓力隨吸氣容積逐步上升；每口潮氣量固定；本題的波形不是這樣。"},{"id":"B","text":"PC-AC（壓力控制）","rationale":"不符：PC-AC 的特徵是吸氣壓力為方波，流量先高後遞減；吸氣時間固定，潮氣量隨阻力與順應性改變；本題的波形不是這樣。"},{"id":"C","text":"PS（壓力支持）","rationale":"符合：壓力方波、流量遞減，吸氣初期壓力先衝高再回落。"}],"correctOptionId":"C","walkthrough":["先判斷模式：壓力方波、流量遞減，吸氣初期壓力先衝高再回落。","PS 的判定：由病人觸發，壓力為方波，流量遞減到峰值的某個比例就切換；吸氣時間隨病人與肺力學而變。"],"reviewCaseId":"B04"},{"key":"problem","prompt":"吸氣一開始就出現壓力尖峰。最符合哪一種異常？","options":[{"id":"A","text":"Delayed cycling，吸氣後期壓力尖峰","rationale":"延遲切換的尖峰出現在吸氣中後期；本題尖峰在吸氣最前面。"},{"id":"B","text":"吸氣初期壓力過衝（供流或壓力上升過快）","rationale":"初期壓力超過目標再回落是 overshoot，與供流或壓力上升設定過快有關（Mellema 圖 21iii、B1）。"},{"id":"C","text":"Double triggering","rationale":"雙重觸發是兩次送氣；本題只有一次送氣，問題在壓力形狀。"}],"correctOptionId":"B","walkthrough":["尖峰在吸氣最開頭，不是吸氣末 → 不是延遲切換。","只有一次送氣 → 不是雙重觸發。"]},{"key":"cause","prompt":"哪個機轉最能解釋這個壓力尖峰？","options":[{"id":"A","text":"壓力上升速度太快，初期供流超過需要","rationale":"快速上升使壓力在目標前就衝過，是 overshoot 的機轉。"},{"id":"B","text":"病人吸氣努力延續到呼氣","rationale":"這會造成呼氣初期流量反向或後期尖峰，不是吸氣初期尖峰。"},{"id":"C","text":"管路漏氣使壓力補償","rationale":"漏氣影響的是容積回收與觸發，不是吸氣起始的壓力過衝。"}],"correctOptionId":"A","walkthrough":["吸氣初期壓力上升過快或初期供流過多。","壓力因此衝過目標。"]},{"key":"resolution","prompt":"依這個原因，最合理的設定調整方向是什麼？","options":[{"id":"A","text":"提高壓力支持","rationale":"會讓平台更高，過衝依然存在。"},{"id":"B","text":"調整 rise time，使壓力上升較平緩，直到過衝消失","rationale":"文獻建議調整 rise time 到壓力波形接近方波、沒有過衝；不同機器的調整方向不同，依機器說明。"},{"id":"C","text":"提高切換門檻百分比","rationale":"與吸氣初期的過衝無關。"}],"correctOptionId":"B","walkthrough":["過衝與 C04 的早期凹陷方向相反：一個是供流太多，一個是供流太少。","調整後再看吸氣初期是否呈方波。"]}],"explanation":{"mechanismChain":["吸氣初期壓力上升或供流過快","氣道壓力在初期超過設定支持壓而出現過衝","之後回到平台；需與後期尖峰（延遲切換）區分"],"limitations":["過衝大小與時間是教學腳本，與品牌機器的 rise time 控制邏輯不同。","文獻建議調整 rise time 直到過衝消失；本原型第一版不開放設定調整。","早期壓力凹陷（供流不足）與早期尖峰（過衝）方向相反，請與病例 04 對照。"]},"references":[{"sourceId":"R2013","pdfPages":[11],"figure":"Figure 21iii：早期壓力尖峰與延遲切換的區分"},{"sourceId":"B1","pdfPages":[11],"figure":"Excessive inspiratory flow／overshoot"}]},{"id":"B05","kind":"basic","category":"basic","scenarioId":"B05","title":"VC-SIMV：強制呼吸與自發呼吸並存","clinicalScenario":"病人有自主吸氣動作，但不是每一口都由機器完整送氣。請注意同一個週期內形狀不同的呼吸。","settingClues":"容積控制 SIMV：每 6 秒一口強制呼吸（450 mL、固定吸氣流），其餘病人自己觸發的呼吸給予 7 cmH₂O 壓力支持。","reviewStatus":"pending-clinical-review","steps":[{"key":"mode","prompt":"只看波形與數值（模式與設定已隱藏），這個畫面最可能是哪一種通氣模式？","options":[{"id":"A","text":"VC-AC（容積控制）","rationale":"不符：VC-AC 的特徵是吸氣流為固定方波（可加吸氣末停頓），壓力隨吸氣容積逐步上升；每口潮氣量固定；本題的波形不是這樣。"},{"id":"B","text":"PS（壓力支持）","rationale":"不符：PS 的特徵是由病人觸發，壓力為方波，流量遞減到峰值的某個比例就切換；吸氣時間隨病人與肺力學而變；本題的波形不是這樣。"},{"id":"C","text":"VC-SIMV（容積控制 SIMV＋PS）","rationale":"符合：同一個週期內有兩種形狀的呼吸：一口固定時間、方波流量的呼吸，與一口病人觸發、流量遞減的呼吸。"}],"correctOptionId":"C","walkthrough":["先判斷模式：同一個週期內有兩種形狀的呼吸：一口固定時間、方波流量的呼吸，與一口病人觸發、流量遞減的呼吸。","VC-SIMV 的判定：固定時間的強制呼吸（方波流量、鯊魚鰭壓力）與病人觸發的壓力支持呼吸交替出現。"],"reviewCaseId":"B05"},{"key":"feature","prompt":"每個週期有一口形狀固定的呼吸（流量方波、壓力鯊魚鰭），中間另有一口病人觸發、形狀不同的呼吸。這個混合代表什麼？","options":[{"id":"A","text":"強制呼吸（機器固定時間送氣）與自發呼吸（病人觸發並有壓力支持）交替","rationale":"強制呼吸有固定的形狀與間隔；自發呼吸跟著病人的努力出現。"},{"id":"B","text":"雙重觸發造成的成對呼吸","rationale":"雙重觸發是兩口緊接、中間只有短暫呼氣；這裡的兩種呼吸形狀不同、間隔也不同。"},{"id":"C","text":"無效觸發","rationale":"無效觸發是有努力卻沒有送氣；這裡每次努力都有被送氣或被支持。"}],"correctOptionId":"A","walkthrough":["先把呼吸分成兩類：形狀每次都一樣、間隔固定的那一口（強制）；跟著病人努力出現的那一口（自發）。","SIMV 的重點是：強制呼吸保證最低通氣，自發呼吸由病人決定。"]},{"key":"feature","prompt":"強制呼吸與自發呼吸的潮氣量與形狀為什麼不同？","options":[{"id":"A","text":"強制呼吸由設定的流量與容積決定；自發呼吸的大小依病人努力與壓力支持","rationale":"強制呼吸是機器設定好的；自發呼吸沒有設定容積，隨努力與支持壓而變。"},{"id":"B","text":"兩種呼吸都由機器設定的潮氣量決定","rationale":"那樣就是 AC，沒有自發呼吸的差異。"},{"id":"C","text":"自發呼吸是漏氣造成的","rationale":"漏氣會讓 VTe 小於 VTi，不會造成一種獨立形狀的呼吸。"}],"correctOptionId":"A","walkthrough":["比較兩種呼吸的 VTi：強制呼吸固定，自發呼吸通常不同。","這是 SIMV 與 AC 的差別：AC 的每一口都是強制呼吸。"]}],"explanation":{"mechanismChain":["機器依設定間隔送出強制呼吸","兩口強制呼吸之間，病人自己觸發並得到壓力支持","兩種呼吸形狀與潮氣量不同"],"limitations":["沒有 SIMV 同步視窗與備援的細節，是通用教學示範。"]},"references":[{"sourceId":"R2013","pdfPages":[2,3,4,5],"figure":"Figures 2–4：各模式（含 SIMV）的壓力、流量與容積波形"},{"sourceId":"B1","pdfPages":[14],"figure":"Figure 4：吸氣停頓與平台壓"}]},{"id":"B06","kind":"basic","category":"basic","scenarioId":"B06","title":"PC-SIMV：壓力控制的強制呼吸與壓力支持呼吸","clinicalScenario":"病人有自主吸氣動作，但不是每一口都由機器完整送氣。請比較同一週期內兩種呼吸的壓力形狀。","settingClues":"壓力控制 SIMV：每 6 秒一口壓力控制強制呼吸（10 cmH₂O、吸氣時間 1.0 秒），其餘病人自己觸發的呼吸給予 6 cmH₂O 壓力支持。","reviewStatus":"pending-clinical-review","steps":[{"key":"mode","prompt":"只看波形與數值（模式與設定已隱藏），這個畫面最可能是哪一種通氣模式？","options":[{"id":"A","text":"PC-AC（壓力控制）","rationale":"不符：PC-AC 的特徵是吸氣壓力為方波，流量先高後遞減；吸氣時間固定，潮氣量隨阻力與順應性改變；本題的波形不是這樣。"},{"id":"B","text":"PS（壓力支持）","rationale":"不符：PS 的特徵是由病人觸發，壓力為方波，流量遞減到峰值的某個比例就切換；吸氣時間隨病人與肺力學而變；本題的波形不是這樣。"},{"id":"C","text":"PC-SIMV（壓力控制 SIMV＋PS）","rationale":"符合：兩種呼吸的壓力都是方波；一種吸氣時間固定、機器在固定時間送氣，另一種由病人觸發、依流量切換。"}],"correctOptionId":"C","walkthrough":["先判斷模式：兩種呼吸的壓力都是方波；一種吸氣時間固定、機器在固定時間送氣，另一種由病人觸發、依流量切換。","PC-SIMV 的判定：固定時間的壓力方波強制呼吸，與病人觸發、流量切換的壓力支持呼吸交替出現。"],"reviewCaseId":"B06"},{"key":"feature","prompt":"同一個週期內兩種呼吸的壓力都是方波。怎麼分辨哪一口是強制呼吸？","options":[{"id":"A","text":"強制呼吸在固定間隔出現，沒有觸發前的 Paw 凹陷；自發呼吸之前有病人的小凹陷","rationale":"強制呼吸由時間觸發；自發呼吸由病人努力觸發，所以送氣前先有 Paw 凹陷與流量小幅上升。"},{"id":"B","text":"壓力較高的那一口一定是強制呼吸","rationale":"兩者壓力設定不同，但不能只用高低判斷；要看觸發與間隔。"},{"id":"C","text":"潮氣量較小的那一口一定是強制呼吸","rationale":"壓力控制的潮氣量依阻力與順應性而變，不能單看大小。"}],"correctOptionId":"A","walkthrough":["先找固定間隔、前面沒有凹陷的那一口 → 時間觸發。","再找前面有小凹陷的那一口 → 病人觸發。"]},{"key":"feature","prompt":"強制呼吸與自發呼吸的吸氣結束方式有什麼不同？","options":[{"id":"A","text":"強制呼吸在固定吸氣時間結束；自發呼吸在流量降到某個比例時結束","rationale":"壓力控制看時間，壓力支持看流量。"},{"id":"B","text":"兩種都在固定吸氣時間結束","rationale":"壓力支持的吸氣時間隨病人與肺力學而變。"},{"id":"C","text":"兩種都在流量降到某個比例時結束","rationale":"壓力控制的吸氣時間是固定的。"}],"correctOptionId":"A","walkthrough":["比較兩種呼吸的吸氣時間：強制呼吸每次一樣，自發呼吸會變。","這與 B03（PC-AC）和 B04（PS）各自的判定一致。"]}],"explanation":{"mechanismChain":["機器依設定間隔送出壓力控制的強制呼吸","兩口之間，病人觸發並在流量降到門檻時切換","同一個畫面出現兩種吸氣結束方式"],"limitations":["沒有 SIMV 同步視窗等細節，是通用教學示範。"]},"references":[{"sourceId":"R2013","pdfPages":[2,3,4,5],"figure":"Figures 2–4：各模式（含 SIMV）的壓力、流量與容積波形"},{"sourceId":"B1","pdfPages":[14],"figure":"Figure 4：吸氣停頓與平台壓"}]},{"id":"B07","kind":"basic","category":"basic","scenarioId":"B07","title":"CPAP：沒有壓力支持的自發呼吸","clinicalScenario":"病人完全靠自己的力氣呼吸。請觀察 Paw 與流量的形狀。","settingClues":"持續氣道正壓：只維持 PEEP 5 cmH₂O，沒有壓力支持。","reviewStatus":"pending-clinical-review","steps":[{"key":"mode","prompt":"只看波形與數值（模式與設定已隱藏），這個畫面最可能是哪一種通氣模式？","options":[{"id":"A","text":"PC-AC（壓力控制）","rationale":"不符：PC-AC 的特徵是吸氣壓力為方波，流量先高後遞減；吸氣時間固定，潮氣量隨阻力與順應性改變；本題的波形不是這樣。"},{"id":"B","text":"PS（壓力支持）","rationale":"不符：PS 的特徵是由病人觸發，壓力為方波，流量遞減到峰值的某個比例就切換；吸氣時間隨病人與肺力學而變；本題的波形不是這樣。"},{"id":"C","text":"CPAP（持續氣道正壓）","rationale":"符合：Paw 幾乎維持在 PEEP 附近，只有病人吸氣時的小幅波動；流量像正弦，完全由病人決定。"}],"correctOptionId":"C","walkthrough":["先判斷模式：Paw 幾乎維持在 PEEP 附近，只有病人吸氣時的小幅波動；流量像正弦，完全由病人決定。","CPAP 的判定：機器只維持 PEEP、不額外加壓；每一口都由病人自己完成，流量像正弦、Paw 只在 PEEP 附近小幅波動。"],"reviewCaseId":"B07"},{"key":"feature","prompt":"Paw 在整個呼吸週期維持在 PEEP 上下，吸氣時沒有抬升的平台。這代表什麼？","options":[{"id":"A","text":"沒有壓力支持，只維持 PEEP 的自發呼吸","rationale":"機器沒有在吸氣時加壓，所以 Paw 沒有平台。"},{"id":"B","text":"壓力控制，壓力方波很小","rationale":"壓力控制有固定時間的方波；這裡每口的長短與間隔由病人決定。"},{"id":"C","text":"漏氣造成的壓力下降","rationale":"漏氣會有 VTi 與 VTe 的落差；這裡沒有。"}],"correctOptionId":"A","walkthrough":["先看吸氣期的 Paw 有沒有被抬高：沒有 → 沒有壓力支持。","再看流量：像正弦，是病人努力的形狀。"]},{"key":"feature","prompt":"CPAP 與 PS 在吸氣期的 Paw 有什麼差別？","options":[{"id":"A","text":"PS 的吸氣期 Paw 會抬升到 PEEP＋支持壓的平台；CPAP 不會","rationale":"支持壓就是吸氣期額外的壓力。"},{"id":"B","text":"CPAP 的吸氣期 Paw 比 PS 高","rationale":"相反：CPAP 沒有額外的支持壓。"},{"id":"C","text":"兩者完全一樣","rationale":"差別就在有沒有那個壓力平台。"}],"correctOptionId":"A","walkthrough":["這是區分 CPAP 與 PS 的第一個線索。","兩者都由病人觸發；只有 PS 在吸氣時額外加壓。"]}],"explanation":{"mechanismChain":["病人自己吸氣","機器維持固定的 PEEP","沒有額外的吸氣壓力平台"],"limitations":["示範用單腔室模型，沒有完整備援通氣。"]},"references":[{"sourceId":"R2013","pdfPages":[2,3,4,5],"figure":"Figures 2–4：各模式（含 SIMV）的壓力、流量與容積波形"},{"sourceId":"B1","pdfPages":[14],"figure":"Figure 4：吸氣停頓與平台壓"}]},{"id":"B08","kind":"basic","category":"basic","scenarioId":"B08","title":"PRVC：逐口調整壓力以達設定潮氣量","clinicalScenario":"被動、沒有自主努力的病人，接受機器控制通氣。請把時間窗拉到 12 秒，觀察約三口呼吸的壓力與潮氣量變化。中途肺的順應性變差。","settingClues":"壓力調節容積控制：設定潮氣量 450 mL、吸氣時間 1.0 秒；機器逐口自動調整壓力，上限 35 cmH₂O。","reviewStatus":"pending-clinical-review","steps":[{"key":"mode","prompt":"只看波形與數值（模式與設定已隱藏），這個畫面最可能是哪一種通氣模式？","options":[{"id":"A","text":"VC-AC（容積控制）","rationale":"不符：VC-AC 的特徵是吸氣流為固定方波（可加吸氣末停頓），壓力隨吸氣容積逐步上升；每口潮氣量固定；本題的波形不是這樣。"},{"id":"B","text":"PC-AC（壓力控制）","rationale":"不符：PC-AC 的特徵是吸氣壓力為方波，流量先高後遞減；吸氣時間固定，潮氣量隨阻力與順應性改變；本題的波形不是這樣。"},{"id":"C","text":"PRVC（壓力調節容積控制）","rationale":"符合：壓力是方波、流量遞減；當潮氣量下降後，壓力逐口自動升高，把潮氣量拉回原來。"}],"correctOptionId":"C","walkthrough":["先判斷模式：壓力是方波、流量遞減；當潮氣量下降後，壓力逐口自動升高，把潮氣量拉回原來。","PRVC 的判定：壓力控制的方波壓力與遞減流量，但壓力逐口自動調整以達到設定潮氣量。"],"reviewCaseId":"B08"},{"key":"feature","prompt":"順應性變差後，VTi 先下降一兩口，之後 Ppeak 逐口上升，VTi 回到原來的水準。這代表什麼？","options":[{"id":"A","text":"機器逐口調整壓力，以達到設定的潮氣量","rationale":"機器依上一口的潮氣量調整下一口的壓力。"},{"id":"B","text":"固定壓力的壓力控制","rationale":"固定壓力時，潮氣量會維持在較低的水準，不會自己回升。"},{"id":"C","text":"固定流量的容積控制","rationale":"容積控制的潮氣量一開始就固定，Ppeak 會直接升高，不會有 VTi 下降的過程。"}],"correctOptionId":"A","walkthrough":["這個「VTi 先掉、壓力逐口升高、VTi 回升」的順序是 PRVC 的特徵。","看壓力與潮氣量兩條線的關係，而不是只看其中一條。"]},{"key":"feature","prompt":"同樣的順應性變差，在 PC-AC 下會怎樣？","options":[{"id":"A","text":"壓力不變，VTi 下降後維持在較低的水準","rationale":"壓力是被設定的，沒有逐口調整，潮氣量就停在新的水準。"},{"id":"B","text":"壓力逐口升高到原本的潮氣量","rationale":"那是 PRVC 的反應，不是 PC-AC。"},{"id":"C","text":"潮氣量不變","rationale":"壓力控制下，順應性變差一定會影響潮氣量。"}],"correctOptionId":"A","walkthrough":["PRVC 與 PC-AC 的波形形狀很像，差別在於壓力會不會逐口自己改變。","這也是臨床上要小心的地方：PRVC 會自動把壓力拉高，要留意 Pplat。"]}],"explanation":{"mechanismChain":["順應性變差使 VTi 下降","機器依上一口的潮氣量提高下一口的壓力","潮氣量回到設定值，Ppeak 升高"],"limitations":["逐口調整的步幅與上限是通用教學示範，不是任何廠牌的演算法。"]},"references":[{"sourceId":"R2013","pdfPages":[2,3,4,5],"figure":"Figures 2–4：各模式（含 SIMV）的壓力、流量與容積波形"},{"sourceId":"B1","pdfPages":[14],"figure":"Figure 4：吸氣停頓與平台壓"}]},{"id":"C13","kind":"troubleshooting","category":"airtrap","scenarioId":"C13","title":"支氣管痙攣（壓力控制）：阻力上升使潮氣量不足","clinicalScenario":"嚴重支氣管痙攣病人，被動、沒有自主努力，管路無漏氣。呼出潮氣量只有約 220 mL，且每口都一樣小；Ppeak 並不高。","settingClues":"壓力控制，壓力 12 cmH₂O，吸氣時間 1.0 秒。","reviewStatus":"pending-clinical-review","steps":[{"key":"mode","prompt":"只看波形與數值（模式與設定已隱藏），這個畫面最可能是哪一種通氣模式？","options":[{"id":"A","text":"VC-AC（容積控制）","rationale":"不符：VC-AC 的特徵是吸氣流為固定方波（可加吸氣末停頓），壓力隨吸氣容積逐步上升；每口潮氣量固定；本題的波形不是這樣。"},{"id":"B","text":"PC-AC（壓力控制）","rationale":"符合：壓力是方波，流量先高後遞減，吸氣時間固定。"},{"id":"C","text":"PS（壓力支持）","rationale":"不符：PS 的特徵是由病人觸發，壓力為方波，流量遞減到峰值的某個比例就切換；吸氣時間隨病人與肺力學而變；本題的波形不是這樣。"}],"correctOptionId":"B","walkthrough":["先判斷模式：壓力是方波，流量先高後遞減，吸氣時間固定。","PC-AC 的判定：吸氣壓力為方波，流量先高後遞減；吸氣時間固定，潮氣量隨阻力與順應性改變。"],"reviewCaseId":"B03"},{"key":"problem","prompt":"最需要辨識的問題是什麼？","options":[{"id":"A","text":"漏氣","rationale":"漏氣會讓 VTi 大於 VTe；本題兩者相等，只是都很小。"},{"id":"B","text":"壓力控制下的潮氣量不足","rationale":"設定壓力不變，送進肺的容積很小，通氣量不足。"},{"id":"C","text":"吸氣供流不足造成的壓力凹陷","rationale":"那是容積控制下的現象；本題壓力是平整的方波。"}],"correctOptionId":"B","walkthrough":["先看 VTi 與 VTe：相等 → 不是漏氣。","再看壓力：方波且不高 → 問題不在壓力，而在送進的容積。"]},{"key":"cause","prompt":"依本題背景，哪個原因最符合？","options":[{"id":"A","text":"氣道阻力很高，同樣的壓力只能送進很少的容積","rationale":"壓力固定時，阻力越大流量越小，一秒內進入的容積就很少。"},{"id":"B","text":"順應性大幅變好","rationale":"順應性變好會讓同樣壓力送進更多容積。"},{"id":"C","text":"觸發過度敏感","rationale":"本題是時間觸發的控制呼吸，沒有額外的送氣。"}],"correctOptionId":"A","walkthrough":["嚴重支氣管痙攣 → 阻力高。","壓力控制下，阻力高直接表現為潮氣量小，而不是壓力高。"]},{"key":"resolution","prompt":"依這個原因，最合理的處理方向是什麼？","options":[{"id":"A","text":"降低壓力，避免 Ppeak 過高","rationale":"本題 Ppeak 並不高；降低壓力只會讓潮氣量更小。"},{"id":"B","text":"改用容積控制以保證潮氣量，把壓力警報上限調高，並監測 Pplat 與 auto-PEEP；同時縮短吸氣時間、降低呼吸次數並使用支氣管擴張劑","rationale":"阻力高時需要更高的壓力才能送進足夠的潮氣量；高 Ppeak 主要反映阻力，看 Pplat（教學上約 30 cmH₂O 以下）才是肺泡風險。呼氣時間仍需足夠，避免 air trapping。"},{"id":"C","text":"提高 PEEP","rationale":"被動病人若有 air trapping，加 PEEP 只會更糟。"}],"correctOptionId":"B","walkthrough":["與 C07 成對：C07 是 VC-AC 的 auto-PEEP，重點是延長呼氣時間；本題是 PC-AC 的潮氣量不足，重點是保證通氣但看 Pplat。","「硬打」不是不看安全：要看 Pplat 與 auto-PEEP，並讓呼氣時間足夠。"]}],"explanation":{"mechanismChain":["嚴重支氣管痙攣使氣道阻力很高","壓力控制下流量很小，潮氣量不足","需要更高的壓力或容積保證，並監測 Pplat 與 auto-PEEP"],"limitations":["處置為教學情境，不是治療指引；pending-clinical-review。","單腔室模型，沒有氣體交換與 PaCO₂。"]},"references":[{"sourceId":"R2013","pdfPages":[4],"figure":"Figure 6：阻力上升時 PIP 與 Pplat 的變化"},{"sourceId":"B1","pdfPages":[14],"figure":"Pplat 超過 28–30 cmH₂O 的調查建議"}]},{"id":"B09","kind":"basic","category":"basic","scenarioId":"B09","title":"P-V 迴圈：正常迴圈的斜率與外凸","clinicalScenario":"被動、沒有自主努力的病人，接受機器控制通氣。請看 Loops 區 P-V 迴圈（青色吸氣、橘色呼氣）的形狀。","settingClues":"容積控制，潮氣量 450 mL，固定吸氣流，沒有吸氣末停頓。","reviewStatus":"pending-clinical-review","steps":[{"key":"mode","prompt":"只看波形與數值（模式與設定已隱藏），這個畫面最可能是哪一種通氣模式？","options":[{"id":"A","text":"VC-AC（容積控制）","rationale":"符合：流量在吸氣期維持固定的方波，壓力隨吸氣逐步上升。"},{"id":"B","text":"PC-AC（壓力控制）","rationale":"不符：PC-AC 的特徵是吸氣壓力為方波、流量先高後遞減；本題的流量是方波。"},{"id":"C","text":"PS（壓力支持）","rationale":"不符：PS 由病人觸發、依流量切換；本題沒有病人努力，每口潮氣量固定。"}],"correctOptionId":"A","walkthrough":["先判斷模式：流量在吸氣期維持固定的方波，壓力隨吸氣逐步上升。","VC-AC 的判定：吸氣流為固定方波（可加吸氣末停頓），壓力隨吸氣容積逐步上升；每口潮氣量固定。"],"reviewCaseId":"B01"},{"key":"feature","prompt":"P-V 迴圈從 PEEP 出發，吸氣支沿一條接近直線的斜線上升到 Ppeak 與潮氣量，呼氣支回到起點。這條線的斜率代表什麼？","options":[{"id":"A","text":"呼吸系統的順應性（斜率越大越順應）","rationale":"單位壓力能打進多少容積就是順應性；斜率就是 Cdyn 的圖形表現。"},{"id":"B","text":"氣道阻力","rationale":"阻力影響的是吸氣支的外凸，不是整條線的斜率。"},{"id":"C","text":"吸氣努力","rationale":"被動病人沒有努力，努力會造成迴圈變形或八字形。"}],"correctOptionId":"A","walkthrough":["在首尾兩點（流量最小處）之間畫一條直線，斜率就是動態順應性。","看斜率之前先確認迴圈有閉合、沒有病人努力。"]},{"key":"feature","prompt":"吸氣支比首尾連線略向外凸出，凸出的部分反映什麼？","options":[{"id":"A","text":"克服氣道與管路阻力所需的額外壓力","rationale":"固定吸氣流下，流量乘以阻力是額外的壓力，使吸氣支向右凸出。"},{"id":"B","text":"漏氣","rationale":"漏氣會讓迴圈不閉合，不是外凸。"},{"id":"C","text":"肺泡過度膨脹","rationale":"過度膨脹是吸氣末段才突然變陡的鳥嘴。"}],"correctOptionId":"A","walkthrough":["外凸越明顯，代表阻力越大（流量越大或阻力越高都會加大外凸）。","這與 B02 的 Ppeak−Pplat 差距是同一件事的兩種畫法。"]}],"explanation":{"mechanismChain":["機器以固定流量打氣","壓力依順應性與阻力上升","斜率反映順應性，外凸反映阻力"],"limitations":["單腔室合成示範；迴圈形狀是教學示意，不能取代臨床判斷。"]},"references":[{"sourceId":"R2013","pdfPages":[7,8],"figure":"Figures 11–14：P-V 迴圈（順應性旋轉、阻力外凸、過度膨脹 beaking、漏氣不閉合）"}]},{"id":"B10","kind":"ba
