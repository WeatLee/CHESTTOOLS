<body>
  <div class="app">
    <header class="topbar">
      <div class="brand"><div class="mark">+</div><div><p class="eyebrow">RESUSCITATION CONSOLE</p><h1>ACLS 指令紀錄</h1></div></div>
      <div class="clock"><small>CURRENT TIME</small><strong id="clock">00:00:00</strong></div>
      <div class="header-right">
        <div id="bosminHead" class="bosmin-head"><div><span>BOSMIN</span><small id="bosminHeadState">NEXT DOSE</small></div><strong id="bosminHeadValue">03:00</strong><i class="bar" id="bosminHeadBar"></i></div>
        <div id="caseStatus" class="case-status"><i></i><span>待命中</span></div>
      </div>
    </header>

    <main class="workspace">
      <aside class="panel controls">
        <div class="panel-title"><div><p class="eyebrow">QUICK COMMANDS</p><h2>常用指令</h2></div><span class="hint">點擊即記錄</span></div>
        <section class="section"><div class="section-title"><span>01</span><h3>處置</h3></div>
          <button id="cprBtn" class="command cpr"><span class="icon">▶</span><span class="copy"><strong>CPR 開始</strong><small>按下開始 CPR 計時</small></span><span class="arrow">→</span></button>
          <button id="airwayBtn" class="command airway"><span class="icon">ET</span><span class="copy"><strong>插管</strong><small>設定 Endo size 與 Fix 深度</small></span><span class="arrow">＋</span></button>
          <div id="airwayPanel" class="expand"><div class="sizes" id="sizes"></div><div class="range-head"><span>FIX 深度</span><output id="depthOut">22 cm</output></div><input id="depth" class="depth" type="range" min="18" max="27" value="22"><div class="range-scale"><span>18</span><span>27 cm</span></div><button id="recordAirway" class="record">記錄插管完成</button></div>
          <button id="shockBtn" class="command shock"><span class="icon">⚡</span><span class="copy"><strong>電擊</strong><small>選擇節律與能量</small></span><span class="arrow">＋</span></button>
          <div id="shockPanel" class="expand"><div class="shock-grid" id="shockGrid"></div></div>
        </section>
        <section class="section"><div class="section-title"><span>02</span><h3>藥物</h3></div><div id="drugGrid" class="drug-grid"></div>
          <div class="timer"><div class="timer-top"><span>BOSMIN INTERVAL</span><b id="timerState">尚未給藥</b></div><div id="timerValue" class="timer-value">03:00</div><div class="timer-track"><i id="timerBar" style="width:100%"></i></div></div>
        </section>
      </aside>

      <section class="panel log">
        <div class="log-head panel-title"><div class="log-title"><div><p class="eyebrow">LIVE EVENT LOG</p><h2>醫令時間軸</h2></div></div><div class="elapsed"><span>本次 CPR</span><strong id="elapsed">00:00</strong></div></div>
        <div id="timeline" class="timeline"><div id="empty" class="empty"><div><p class="eyebrow">AWAITING COMMAND</p><b>尚無醫令紀錄</b><p>點選左側指令，紀錄會自動加入此處。</p></div></div><div id="events" class="events"></div></div>
        <div class="end-wrap"><button id="endBtn" class="end" disabled><span>急救結束</span><small>記錄結束時間並下載 TXT 紀錄</small></button></div>
        <div class="footer"><span>紀錄儲存在這台裝置</span><button id="clearBtn">清除本次紀錄</button></div>
      </section>
    </main>
    <a href="../index.html" class="back" aria-label="回工具箱">←</a>
  </div>

  <div id="keyBg" class="key-bg"><section class="keypad" role="dialog" aria-modal="true"><div class="key-head"><span id="keyTitle">輸入劑量</span><div class="key-display"><strong id="keyValue">0</strong><b id="keyUnit"></b></div></div><div id="keys" class="keys"></div><div class="key-actions"><button id="keyClear">清除</button><button id="keyDone" class="done">完成</button></div></section></div>

  <script>
  (function(){
    'use strict';
    var STORE='chesttools-acls-v1', BOSMIN=180, sizes=['6.0','6.5','7.0','7.5','8.0'], selectedSize='7.5', keypadId=null;
    var shocks=[['Atrial fibrillation（Af）','同步整流 200 J'],['Atrial flutter（AF）','同步整流 200 J'],['有 Pulse SVT','同步整流 100 J'],['Polymorphic VT','去顫 200 J'],['VT','去顫 200 J'],['VF','去顫 200 J']];
    var drugs=[['bosmin','Bosmin',''],['nahco3','NaHCO₃','支'],['dormicum','Dormicum','mL'],['propofol','Propofol','mL'],['genso','Genso','mL'],['amiodarone','Amiodarone','支'],['insulin','Insulin','U'],['d50w','D50W','支'],['cacl2','CaCl₂','支']];
    var events=[];try{events=JSON.parse(localStorage.getItem(STORE)||'[]')}catch(e){events=[]}
    function el(id){return document.getElementById(id)} function pad(n){return String(n).padStart(2,'0')} function clockTime(ms){var d=new Date(ms);return pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds())} function duration(s){s=Math.max(0,s);return pad(Math.floor(s/60))+':'+pad(s%60)}
    function save(){localStorage.setItem(STORE,JSON.stringify(events))} function latest(fn){for(var i=events.length-1;i>=0;i--)if(fn(events[i]))return events[i]} function ended(){return events.length&&events[events.length-1].kind==='end'} function cprState(){return latest(function(e){return e.kind==='cpr'||e.kind==='rosc'})} function active(){var s=cprState();return s&&s.kind==='cpr'&&!ended()}
    function add(data){data.id=Date.now()+'-'+Math.random();data.time=Date.now();events.push(data);save();render(true)}
    function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
    function cpr(){if(ended()){events=[];add({kind:'cpr',label:'CPR 開始',detail:'高品質胸外按壓'});return}var s=cprState();if(active())add({kind:'rosc',label:'ROSC',detail:'恢復自發性循環'});else add({kind:'cpr',label:s?'再度 CPR':'CPR 開始',detail:'高品質胸外按壓'})}
    function renderButtons(){var a=active(),s=cprState(),btn=el('cprBtn');btn.querySelector('.icon').textContent=a?'■':'▶';btn.querySelector('strong').textContent=a?'ROSC':s?'再度 CPR':'CPR 開始';btn.querySelector('small').textContent=a?'按下記錄恢復循環':'按下開始 CPR 計時';drugs.forEach(function(d){var b=document.querySelector('.drug[data-key="'+d[0]+'"]');if(b)b.querySelector('em').textContent='× '+events.filter(function(e){return e.drug===d[0]}).length})}
    function timelineHtml(e,i){var inline='';if(e.kind==='intubation'){inline='<div class="inline">Endo <select data-endo="'+e.id+'">'+sizes.map(function(s){return'<option '+(s===e.endo?'selected':'')+'>'+s+'</option>'}).join('')+'</select> Fix <input data-fix="'+e.id+'" type="number" min="18" max="27" value="'+e.fix+'"> cm</div>'}var dose=e.unit?'<div class="dose"><button data-dose="'+e.id+'">'+esc(e.note||'輸入')+'</button><b>'+esc(e.unit)+'</b></div>':'';return'<article class="event"><div class="node">'+(i+1)+'</div><time>'+clockTime(e.time)+'</time><div class="event-copy"><strong>'+esc(e.label)+'</strong><small>'+esc(e.detail)+'</small>'+inline+'</div><div class="actions">'+dose+'<button class="undo" data-remove="'+e.id+'">取消</button></div></article>'}
    function render(scroll){el('empty').style.display=events.length?'none':'grid';el('events').innerHTML=events.map(timelineHtml).join('');el('endBtn').disabled=!events.length;el('endBtn').querySelector('span').textContent=ended()?'再次匯出 TXT':'急救結束';el('endBtn').querySelector('small').textContent=ended()?'下載目前完整時間軸':'記錄結束時間並下載 TXT 紀錄';var status=el('caseStatus');status.className='case-status'+(active()?' active':'');status.querySelector('span').textContent=ended()?'急救已結束':active()?'CPR 進行中':events.length?'ROSC／監測中':'待命中';renderButtons();if(scroll)requestAnimationFrame(function(){el('timeline').scrollTop=el('timeline').scrollHeight})}
    function bosminTick(){var now=Date.now(),last=latest(function(e){return e.drug==='bosmin'}),remain=last?BOSMIN-Math.floor((now-last.time)/1000):BOSMIN,ready=!!last&&remain<=0,val=ready?'READY':duration(remain),width=last?Math.max(0,Math.min(100,remain/BOSMIN*100)):100;el('timerValue').textContent=val;el('timerState').textContent=!last?'尚未給藥':ready?'可再次給藥':'倒數中';el('timerBar').style.width=width+'%';var h=el('bosminHead');h.className='bosmin-head'+(last?' show':'')+(ready?' ready':remain<=30?' soon':'');el('bosminHeadValue').textContent=val;el('bosminHeadState').textContent=ready?'可再次給藥':'NEXT DOSE';el('bosminHeadBar').style.width=width+'%';var s=cprState();el('elapsed').textContent=active()&&s?duration(Math.floor((now-s.time)/1000)):'00:00';el('clock').textContent=clockTime(now)}
    function doseKey(key){var e=events.find(function(x){return x.id===keypadId});if(!e)return;var n=e.note||'';if(key==='del')n=n.slice(0,-1);else if(key==='clear')n='';else if(key==='.'&&n.indexOf('.')>=0)return;else if(n.length<8)n+=key;e.note=n;e.detail=n?n+' '+e.unit:'待補劑量';save();el('keyValue').textContent=n||'0';render(false)}
    function openKey(id){keypadId=id;var e=events.find(function(x){return x.id===id});el('keyTitle').textContent=e.label+' 劑量';el('keyValue').textContent=e.note||'0';el('keyUnit').textContent=e.unit;el('keyBg').classList.add('open')}
    function exportTxt(){var lines=['ACLS 急救紀錄','匯出時間：'+new Date().toLocaleString('zh-TW',{hour12:false}),''].concat(events.map(function(e,i){return pad(i+1)+'  '+clockTime(e.time)+'  '+e.label+'  '+e.detail})).concat(['','此檔案為輔助紀錄，實際處置請以正式病歷為準。']);var blob=new Blob(['\uFEFF'+lines.join('\r\n')],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='ACLS-'+new Date().toISOString().replace(/[:.]/g,'-')+'.txt';a.click();setTimeout(function(){URL.revokeObjectURL(url)},1000)}
