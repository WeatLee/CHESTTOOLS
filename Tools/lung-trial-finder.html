// Confirmed contradictions exclude; omitted trial criteria remain unknown.
function geneMatch(t,g,unknown){
 const list=t.gene;
 if(!g){unknown.push('基因');return true;}
 if(list.includes(g))return true;
 if(list.includes('wt')){if(drivers.includes(g))return false;if(g==='her2_oe')unknown.push('HER2 過度表現是否可收');return true;}
 if(g.startsWith('egfr')&&list.includes('egfr'))return true;
 if(g==='egfr'&&list.some(x=>x.startsWith('egfr'))){unknown.push('EGFR 亞型');return true;}
 if(g==='wt'&&list.includes('her2_oe')){unknown.push('HER2 IHC');return true;}
 if(g==='other'){unknown.push(list.map(x=>geneLabels[x]).join('／'));return true;}
 return false;
}
function match(t,s){
 if(t.active===false)return null;
 const unknown=[];
 const lineBased=t.family==='ns'&&(t.priorLines||(t.gene&&t.gene.includes('wt')));
 const contexts=t.contexts||(lineBased?trialConfig.defaults.lateContexts:null);
 if(s.hist){const family=s.hist==='sclc'?'sclc':s.hist==='meso'?'meso':'ns';if(t.family!==family)return null;}
 else unknown.push('癌別');
 if(t.histology&&s.hist&&t.family==='ns'){
  const possible={luad:['luad'],sq:['sq'],otherns:['otherns'],nonsq:['luad','otherns'],ns:['luad','sq','otherns']};
  const allowed=t.histology.flatMap(h=>h==='nonsq'?['luad','otherns']:h==='ns'?['luad','sq','otherns']:[h]);
  const path=possible[s.hist]||[];
  if(!path.some(h=>allowed.includes(h)))return null;
  if(path.some(h=>!allowed.includes(h)))unknown.push('組織亞型');
 }
 if(contexts){if(s.context&&!contexts.includes(s.context))return null;if(!s.context)unknown.push(t.contexts?'期別／情境':'晚期 IIIB–IV');}
 if(t.priorLines){if(s.line&&!t.priorLines.includes(Number(s.line)))return null;if(!s.line)unknown.push('已接受治療線數');}
 const firstLineOnly=t.priorLines&&t.priorLines.every(x=>x===0);
 if(firstLineOnly&&s.prior&&s.prior!=='untreated')return null;
 if(s.prior==='untreated'&&t.priorLines&&t.priorLines.every(x=>x>0))return null;
 if(t.prior){
  const needsTreatment=!t.prior.includes('untreated');
  if(needsTreatment&&(s.line==='0'||s.prior==='untreated'))return null;
  if(!s.prior)unknown.push('既往治療（'+t.prior.map(x=>priorLabels[x]).join('／')+'）');
  else if(s.prior==='other')unknown.push('既往治療');
  else if(!t.prior.includes(s.prior))return null;
 }
 if(t.gene&&!geneMatch(t,s.gene,unknown))return null;
 if(t.pdlMin!==undefined){if(s.pdl==='')unknown.push('PD-L1');else if(Number(s.pdl)<t.pdlMin)return null;else if(Number(s.pdl)===t.pdlMin)unknown.push(t.pdlMin+'% 界線');}
 if(t.brain==='asymptomatic'&&s.brain==='sym')unknown.push('有症狀腦轉移（摘要只寫無症狀可收）');
 return {trial:t,unknown};
}

function card(m){const t=m.trial,e=escapeHTML;const c=document.createElement('article');c.className='card';
 const tags=['<span class="tag">'+(t.family==='sclc'?'SCLC':'NSCLC')+'</span>'];
 if(t.priorLines)tags.push('<span class="tag">'+t.priorLines.map(n=>n===0?'從未治療':'已接受 '+n+' 線').join('、')+'</span>');
 if(t.gene)tags.push('<span class="tag">'+t.gene.map(g=>geneLabels[g]).join('／')+'</span>');
 if(t.pdlMin!==undefined)tags.push('<span class="tag">PD-L1 >'+t.pdlMin+'%</span>');
 if(t.brain==='asymptomatic')tags.push('<span class="tag">無症狀腦轉移可收</span>');
 if(t.stageLabel)tags.push('<span class="tag">'+e(t.stageLabel)+'</span>');
 c.innerHTML='<div class="top"><span class="id">Study '+t.id+'</span><h3>'+e(t.title)+'</h3></div><div class="tags">'+tags.join('')+'</div><p>'+e(t.text)+'</p>'+(t.timing?'<p style="color:#a16820;font-weight:650">⏰ 提醒：'+e(t.timing)+'</p>':'')+(m.unknown.length?'<div class="pending">待確認：'+m.unknown.map(e).join('、')+'</div>':'')+'<div class="foot"><span>研究窗口｜'+e(t.people)+'</span><span class="pending">表格第 '+t.group+' 格・可能候選</span></div><details><summary>摘要尚未釐清的條件</summary><p>'+t.notes.map(e).join('；')+'。</p></details>';return c;}
function render(){const trials=studies.map(t=>match(t,state)).filter(Boolean);el('count').textContent=trials.length+' 個候選';const labels=[histOptions.find(o=>o[0]===state.hist)?.[1],el('context').selectedOptions[0]?.textContent,state.line?el('line').selectedOptions[0].textContent:null].filter(x=>x&&!x.includes('不限'));el('selection').textContent=labels.length?labels.join(' ／ ')+' · 未知條件仍保留候選':'選擇已知條件，候選清單會立即更新。';el('results').replaceChildren(...trials.map(card));if(!trials.length){const d=document.createElement('div');d.className='empty';d.textContent='這份清單目前沒有對應候選。\n可清除部分條件再找，或請研究窗口確認其他試驗。';el('results').append(d);}for(const b of el('hist').children)b.setAttribute('aria-pressed',String(b.dataset.value===state.hist));const n=[state.gene,state.pdl,state.prior,state.brain].filter(v=>v!=='').length;el('extra-count').textContent=n?' · 已選 '+n+' 項':'';}
const pdlHint='AP203 為 TPS >1%；1% 的界線仍待確認。';
function setHist(value){state.hist=value;state.context='';state.prior='';state.gene='';state.pdl='';state.brain='';fill('context',value==='sclc'?ctxSC:ctxNS);fill('prior',value==='sclc'?priorSC:priorNS);for(const k of ['gene','pdl','brain'])el(k).value='';const sc=value==='sclc'||value==='meso';el('gene').parentElement.hidden=sc;el('pdl').parentElement.hidden=sc;if(value==='meso'){el('context').disabled=true;el('line').disabled=true;state.line='';el('line').value='';}else{el('context').disabled=false;el('line').disabled=false;}render();}
for(const [value,label]of histOptions){const b=document.createElement('button');b.className='chip';b.textContent=label;b.dataset.value=value;b.setAttribute('aria-pressed','false');b.onclick=()=>setHist(value);el('hist').append(b);}
for(const key of ['context','line','gene','prior','brain'])el(key).addEventListener('change',e=>{state[key]=e.target.value;render();});
el('pdl').addEventListener('input',e=>{const v=e.target.value;const valid=v===''||(Number.isFinite(Number(v))&&Number(v)>=0&&Number(v)<=100);state.pdl=valid?v:'';el('pdl-hint').textContent=valid?pdlHint:'請輸入 0–100；無效數值不作篩選。';e.target.setAttribute('aria-invalid',String(!valid));render();});
el('reset').onclick=()=>{Object.keys(state).forEach(k=>state[k]='');el('line').value='';el('refine').open=false;el('pdl').setAttribute('aria-invalid','false');el('pdl-hint').textContent=pdlHint;setHist('');};
el('version').textContent='v'+trialConfig.version+' · '+trialConfig.updated;
el('data-date').textContent='資料：'+trialConfig.updated+' 討論版本。';
el('common-note').textContent=trialConfig.commonNote;
el('common-checks').replaceChildren(...trialConfig.commonChecks.map(text=>{const span=document.createElement('span');span.textContent=text;return span;}));
setHist('');
</script></body></html>
