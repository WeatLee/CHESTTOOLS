<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>肺癌試驗快找（測試版）</title>
<style>
:root{font-family:system-ui,"Microsoft JhengHei",sans-serif;color:#203b42;background:#f3f6f6;font-size:16px}*{box-sizing:border-box}body{margin:0}header{background:#173f46;color:white;padding:28px max(24px,calc((100vw - 1180px)/2))}header small{color:#aed7d0;letter-spacing:2px}h1{font-size:29px;margin:8px 0}header p{margin:0;color:#d1e2e3;line-height:1.7}main{max-width:1228px;margin:24px auto;padding:0 24px}.layout{display:grid;grid-template-columns:360px 1fr;gap:24px}.panel,.card{background:white;border:1px solid #dce6e6;border-radius:16px}.panel{padding:22px;align-self:start}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}h2{font-size:20px;margin:0}h3{font-size:17px;margin:0}.clear{border:0;background:none;color:#24756d;cursor:pointer;padding:8px;font-size:14px}.question{margin-top:25px}.label{display:block;font-weight:650;margin-bottom:10px}.number{display:inline-grid;place-items:center;width:23px;height:23px;background:#e1f0eb;color:#23695d;border-radius:50%;font-size:13px;margin-right:8px}.options{display:flex;flex-wrap:wrap;gap:8px}button.chip{font:inherit;font-size:14px;background:#fff;color:#345259;border:1px solid #cfdcdc;border-radius:9px;padding:9px 12px;cursor:pointer;line-height:1.35}button.chip:hover{border-color:#23897a}button.chip[aria-pressed=true]{background:#e2f3eb;color:#14614d;border-color:#248a70;font-weight:650}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #eba95b;outline-offset:3px}select,input{font:inherit;width:100%;border:1px solid #cfdcdc;border-radius:9px;padding:10px;background:white;color:#29474e}.hint{font-size:12px;color:#74858a;line-height:1.7;margin:9px 0 0}details{border-top:1px solid #e3ebeb;margin-top:24px;padding-top:18px}summary{cursor:pointer;font-weight:650;color:#356a65;font-size:14px}.extra{margin-top:16px}.extra label{display:block;font-size:14px;margin-bottom:6px}.extra+.extra{margin-top:14px}.summary{font-size:14px;color:#6c8185;margin-top:8px;line-height:1.6}.count{font-size:13px;background:#dfeeea;color:#256650;padding:6px 10px;border-radius:30px;white-space:nowrap}.cards{display:grid;gap:12px;margin-top:18px}.card{padding:19px 21px}.card .top{display:flex;align-items:center;gap:10px;margin-bottom:10px}.id{font-size:12px;color:#68858b;background:#edf2f3;padding:4px 7px;border-radius:5px;white-space:nowrap}.card p{font-size:14px;line-height:1.7;margin:9px 0;color:#597278}.tags{display:flex;flex-wrap:wrap;gap:6px}.tag{font-size:12px;color:#416d70;background:#edf5f4;border-radius:5px;padding:4px 8px}.foot{border-top:1px solid #edf1f1;margin-top:14px;padding-top:11px;font-size:14px;color:#2f665d;display:flex;justify-content:space-between;gap:8px}.pending{font-size:12px;color:#977537;line-height:1.6}.empty{padding:35px;border:1px dashed #becfd0;border-radius:14px;text-align:center;color:#637b80;background:white;line-height:1.9}.notice{margin:20px 0;font-size:12px;color:#7b8e92;line-height:1.8}.referral{border-left:4px solid #ba9b60}.section-label{margin:24px 0 10px;font-size:14px;color:#8c744e}@media(max-width:800px){.layout{grid-template-columns:1fr}header{padding:22px 20px}main{padding:0 16px;margin:16px auto}.panel{padding:18px}.question{margin-top:18px}.card{padding:17px}.foot{flex-wrap:wrap}h1{font-size:25px}}
.common{background:#eaf2ef;border:1px solid #d0e2dc;border-radius:14px;padding:18px 22px;margin-bottom:22px}.common h2{font-size:17px}.common-checks{display:flex;flex-wrap:wrap;gap:10px;margin-top:13px}.common-checks span{background:white;border:1px solid #d6e5de;padding:8px 12px;border-radius:8px;font-size:14px;font-weight:600;color:#2f6554}.common p{font-size:13px;line-height:1.7;color:#617d73;margin:12px 0 0}.version{font-size:12px;color:#6f877e;white-space:nowrap}
</style></head><body>
<header><small>CLINICAL TRIAL FINDER</small><h1>肺癌試驗快找（測試版）</h1><p>先找到可能的試驗，再聯絡研究窗口。</p></header>
<main><section class="common" aria-labelledby="common-title"><div class="row"><h2 id="common-title">試驗通則・先留意</h2><span class="version" id="version"></span></div><div class="common-checks" id="common-checks"></div><p id="common-note"></p></section><div class="layout"><aside class="panel"><div class="row"><h2>快速篩選</h2><button class="clear" id="reset">清除條件</button></div>
<div class="question"><span class="label"><span class="number">1</span>癌別／病理</span><div class="options" id="hist"></div><p class="hint">LUAD 會一起搜尋可收 Non-SqCC 的試驗。</p></div>
<div class="question"><label class="label" for="context"><span class="number">2</span>期別／治療情境</label><select id="context"></select></div>
<div class="question"><label class="label" for="line"><span class="number">3</span>已接受幾線治療？</label><select id="line"><option value="">不限／不確定</option><option value="0">從未治療</option><option value="1">一線</option><option value="2">二線</option><option value="3">三線</option><option value="4">四線</option><option value="5">五線以上</option></select><p class="hint">已接受一線後進展，請選「一線」。術前／術後治療情境可先不選。</p></div>
<details id="refine"><summary>補充條件（有需要再選）<span id="extra-count"></span></summary><div class="extra"><label for="gene">基因結果</label><select id="gene"><option value="">不知道／未檢測</option><option value="wt">Wild type</option><option value="egfr">EGFR 陽性</option><option value="alk">ALK 陽性</option><option value="kras">KRAS G12C 陽性</option><option value="triple">EGFR／ALK／ROS1 均陰性</option><option value="other">其他已知 driver alteration</option></select></div><div class="extra"><label for="pdl">PD-L1 TPS（%）</label><input id="pdl" type="number" min="0" max="100" placeholder="不知道就留白"><p class="hint" id="pdl-hint">原摘要第 1 項為 >50%；50% 的界線仍待確認。</p></div><div class="extra"><label for="prior">已知治療狀況</label><select id="prior"></select></div></details>
</aside><section aria-labelledby="result-title"><div class="row"><h2 id="result-title">可能的試驗</h2><span class="count" id="count"></span></div><div class="summary" id="selection"></div><div class="cards" id="results" aria-live="polite"></div><div id="referrals"></div><p class="notice">依提供的 Study 摘要初篩，並非收案資格確認；未核實院內名額與收案狀態。未填的條件保留可能候選。第 11 項暫不納入。<span id="data-date"></span></p></section></div></main>
<script>
const trialConfig={"version":"1.1","updated":"2026/10/13","commonChecks":["ECOG 0–1","有無 B 肝／C 肝","是否有第二癌（double cancer）正在治療"],"commonNote":"B／C 肝與第二癌治療狀態需先留意，是否可收由各試驗窗口確認。這些提醒不增加必答問題，也不直接排除候選。","defaults":{"wildTypeContexts":["local","advanced"]},"studies":[{"id":1,"title":"一線 Wild type · PD-L1 >50%","family":"ns","gene":"wt","pdlHigh":true,"people":"請洽胸腔科研究團隊","text":"一線、Wild type、PD-L1 >50%。","notes":["組織型態與 wild type 定義待確認","PD-L1 >50%／≥50% 待確認"],"stageLabel":"晚期 IIIB–IV","priorLines":[0]},{"id":2,"title":"一線 Wild type · IO ＋化療","family":"ns","gene":"wt","people":"請洽胸腔科研究團隊","text":"PD-L1 0–100；免疫治療 versus pembrolizumab，兩組均合併化療。","notes":["試驗分組、組織型態與 wild type 定義待確認"],"stageLabel":"晚期 IIIB–IV","priorLines":[0]},{"id":3,"title":"可切除 IIA–IIIB · 術前化療＋IO","family":"ns","contexts":["pre"],"people":"請洽胸腔科研究團隊","text":"術前化療＋IO，術後 IO 維持。","timing":"開始化療前先簽同意書","notes":["組織型態與可切除性由窗口確認"]},{"id":4,"title":"小細胞肺癌 · 第一線","family":"sclc","people":"請洽胸腔科研究團隊","text":"SCLC 第一線試驗。","notes":["Limited／extensive stage 收案範圍待確認"],"priorLines":[0]},{"id":5,"title":"Tarlatamab · Limited-stage SCLC","family":"sclc","contexts":["limited"],"prior":"crt","people":"請洽胸腔科研究團隊","text":"完成鉑類＋VP16＋放療，治療反應為 SD／PR／CR。","notes":["同步／序貫放化療及收案時間窗待確認"]},{"id":7,"title":"小細胞肺癌 · 一線後進展","family":"sclc","people":"請洽胸腔科研究團隊","text":"SCLC 一線治療 failure。","notes":["是否允許更多既往治療線別待確認"],"priorLines":[1]},{"id":8,"title":"Tagrisso 後進展 · 尚未化療","family":"ns","gene":"egfr","prior":"tag","people":"請洽胸腔科研究團隊","text":"Tagrisso failure，尚未接受化療。","notes":["確切線別、組織型態與期別待確認"]},{"id":9,"title":"II–IIIA · 術後 Pembrolizumab","family":"ns","contexts":["post"],"gene":"negative3","people":"請洽胸腔科研究團隊","text":"手術 R0、術後輔助化療後，EGFR／ALK／ROS1 陰性；pembrolizumab 一年。","notes":["原摘要 RO／ROS 暫按 R0／ROS1 呈現，待確認","組織型態待確認"]},{"id":10,"title":"一線 KRAS G12C（＋）· IO＋標靶","family":"ns","gene":"kras","people":"請洽胸腔科研究團隊","text":"NSCLC，未用過任何治療，KRAS G12C 陽性。可送奇美 NGS 或 Amoy 檢驗。","notes":["組織型態、期別與檢測要求待確認"],"priorLines":[0]},{"id":12,"title":"SqCC 二、三線／NSCLC 三至五線","family":"ns","people":"請洽胸腔科研究團隊","text":"鱗狀細胞癌二、三線；NSCLC 三至五線。","notes":["兩個收案方向暫放同一卡；正式試驗編號待確認"]},{"id":13,"title":"ALK（＋）· 第一線","family":"ns","gene":"alk","people":"請洽胸腔科研究團隊","text":"ALK 陽性，一線試驗。","notes":["一線定義、組織型態與期別待確認"],"priorLines":[0]},{"id":14,"title":"早期 II–IIIA · NGS／G12C 檢測","family":"ns","contexts":["pre","post"],"referral":true,"people":"請洽胸腔科研究團隊","text":"Early stage II–IIIA，送奇美驗 NGS／G12C。","notes":["檢測轉介，是否有對應治療試驗待確認","病理範圍、治療時點與實際期別需確認"]}]};
const studies=trialConfig.studies;
const histOptions=[['','不限'],['luad','LUAD'],['sq','SqCC'],['otherns','其他 Non-SqCC'],['nonsq','Non-SqCC 未分型'],['ns','NSCLC 未分型'],['sclc','SCLC'],['meso','Meso']];
const ctxNS=[['','不限／不確定'],['pre','可切除 IIA–IIIB，術前'],['post','II–IIIA，已開刀'],['local','IIIB–IIIC，晚期'],['advanced','第四期／轉移／晚期復發'],['otherearly','其他早期／期別']];
const ctxSC=[['','不限／不確定'],['limited','Limited stage'],['extensive','Extensive stage']];
const priorNS=[['','不限／不確定'],['untreated','尚未接受治療'],['tag','Tagrisso 後進展，未化療'],['platinum','已接受鉑類化療'],['other','其他治療後']];
const priorSC=[['','不限／不確定'],['untreated','尚未接受治療'],['crt','完成鉑類＋VP16＋放療，SD／PR／CR'],['progress','治療後進展']];
const state={hist:'',context:'',line:'',gene:'',pdl:'',prior:''};
// Confirmed contradictions exclude; omitted trial criteria remain unknown.
function match(t,s){
 if(t.active===false)return null;
 const unknown=[];
 const contexts=t.contexts || (t.gene==='wt'?trialConfig.defaults.wildTypeContexts:null);
 if(s.line==='0'&&t.prior)return null;
 if(s.hist){const family=s.hist==='sclc'?'sclc':s.hist==='meso'?'meso':'ns';if(t.family!==family)return null;}
 else unknown.push('癌別');
 if(t.histology&&s.hist&&t.family==='ns'){
  const possible={luad:['luad'],sq:['sq'],otherns:['otherns'],nonsq:['luad','otherns'],ns:['luad','sq','otherns']};
  const allowed=t.histology.flatMap(h=>h==='nonsq'?['luad','otherns']:h==='ns'?['luad','sq','otherns']:[h]);
  const path=possible[s.hist]||[];
  if(!path.some(h=>allowed.includes(h)))return null;
  if(path.some(h=>!allowed.includes(h)))unknown.push('組織亞型');
 }
 if(contexts){if(s.context&&!contexts.includes(s.context))return null;if(!s.context)unknown.push(t.gene==='wt'?'晚期 IIIB–IV':'期別／情境');}
 if(t.priorLines){if(s.line&&!t.priorLines.includes(Number(s.line)))return null;if(!s.line)unknown.push('已接受治療線數');}
 if(t.id===12){const l=Number(s.line);const sq=s.hist==='sq';const unsure=!s.hist||s.hist==='ns';if(s.line&&!(sq||unsure?[1,2,3,4]:[2,3,4]).includes(l))return null;if(s.line&&l===1&&!sq)unknown.push('需確認 SqCC');if(!s.line)unknown.push('已接受治療線數');}
 if(t.gene){if(!s.gene)unknown.push('基因');else if(t.gene==='wt'){if(['egfr','alk','kras','other'].includes(s.gene))return null;if(s.gene==='triple')unknown.push('wild type 定義');}else if(t.gene==='negative3'){if(['egfr','alk'].includes(s.gene))return null;if(['kras','other'].includes(s.gene))unknown.push('EGFR／ALK／ROS1 陰性');}else if(s.gene!==t.gene){if(t.gene==='kras'&&s.gene==='triple')unknown.push('KRAS G12C');else if(s.gene==='other')unknown.push(t.gene==='egfr'?'EGFR':t.gene==='alk'?'ALK':'KRAS G12C');else return null;}}
 if(t.pdlHigh){if(s.pdl==='')unknown.push('PD-L1');else if(Number(s.pdl)<50)return null;else if(Number(s.pdl)===50)unknown.push('50% 界線');}
 if(t.prior){if(!s.prior)unknown.push(t.prior==='tag'?'Tagrisso／未化療':'放化療後 SD／PR／CR');else if(s.prior!==t.prior&&s.prior!=='other')return null;else if(s.prior==='other')unknown.push('既往治療');}
 if(s.prior==='untreated'&&t.priorLines&&t.priorLines.every(x=>x>0))return null;
 if(t.id===10&&s.prior&&s.prior!=='untreated')return null;
 if(t.id===14&&s.context==='pre')unknown.push('是否為 II–IIIA（IIIB 不在檢測摘要範圍）');
 return {trial:t,unknown};
}
const el=id=>document.getElementById(id);
function fill(id,options){el(id).replaceChildren(...options.map(([value,label])=>{const o=document.createElement('option');o.value=value;o.textContent=label;return o;}));}
function escapeHTML(value){return String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function card(m){const t={...m.trial};for(const key of ['title','text','people','timing','stageLabel'])if(t[key])t[key]=escapeHTML(t[key]);t.notes=t.notes.map(escapeHTML);const c=document.createElement('article');c.className='card'+(t.referral?' referral':'');let text=t.text,people=t.people;if(t.id===12&&state.hist){if(state.hist==='sq'&&[1,2].includes(Number(state.line))){text='SqCC 二、三線。'+(Number(state.line)===2?'另有 NSCLC 三至五線。':'');people='請洽胸腔科研究團隊';}else if(state.hist!=='ns'&&(state.hist!=='sq'||Number(state.line)>2)){text='NSCLC 三至五線。';people='請洽胸腔科研究團隊';}}
 c.innerHTML='<div class="top"><span class="id">Study '+t.id+'</span><h3>'+t.title+'</h3></div><div class="tags"><span class="tag">'+(t.family==='sclc'?'SCLC':'NSCLC')+'</span>'+(t.priorLines?'<span class="tag">'+t.priorLines.map(n=>n===0?'從未治療':'已接受 '+n+' 線').join('、')+'</span>':'')+(t.stageLabel?'<span class="tag">'+t.stageLabel+'</span>':'')+'</div><p>'+text+'</p>'+(t.timing?'<p style="color:#a16820;font-weight:650">提醒：'+t.timing+'</p>':'')+(m.unknown.length?'<div class="pending">待確認：'+m.unknown.join('、')+'</div>':'')+'<div class="foot"><span>研究窗口｜'+people+'</span><span class="pending">'+(t.referral?'檢測轉介':'可能候選')+'</span></div><details><summary>摘要尚未釐清的條件</summary><p>'+t.notes.join('；')+'。</p></details>';return c;}
function render(){const candidates=studies.map(t=>match(t,state)).filter(Boolean);const trials=candidates.filter(m=>!m.trial.referral),ref=candidates.filter(m=>m.trial.referral);el('count').textContent=trials.length+' 個候選';const labels=[histOptions.find(o=>o[0]===state.hist)?.[1],el('context').selectedOptions[0]?.textContent,state.line?el('line').selectedOptions[0].textContent:null].filter(x=>x&&!x.includes('不限'));el('selection').textContent=labels.length?labels.join(' ／ ')+' · 未知條件仍保留候選':'選擇已知條件，候選清單會立即更新。';el('results').replaceChildren(...trials.map(card));if(!trials.length){const d=document.createElement('div');d.className='empty';d.textContent='這份清單目前沒有對應候選。\n可清除部分條件再找，或請研究窗口確認其他試驗。';el('results').append(d);}el('referrals').replaceChildren();if(ref.length){const h=document.createElement('div');h.className='section-label';h.textContent='另外可考慮：檢測轉介';el('referrals').append(h,...ref.map(card));}for(const b of el('hist').children)b.setAttribute('aria-pressed',String(b.dataset.value===state.hist));el('extra-count').textContent=[state.gene,state.pdl,state.prior].filter(v=>v!=='').length?' · 已選 '+[state.gene,state.pdl,state.prior].filter(v=>v!=='').length+' 項':'';}
function setHist(value){state.hist=value;state.context='';state.prior='';state.gene='';state.pdl='';fill('context',value==='sclc'?ctxSC:ctxNS);fill('prior',value==='sclc'?priorSC:priorNS);el('gene').value='';el('pdl').value='';const sc=value==='sclc'||value==='meso';el('gene').parentElement.hidden=sc;el('pdl').parentElement.hidden=sc;if(value==='meso'){el('context').disabled=true;el('line').disabled=true;state.line='';el('line').value='';}else{el('context').disabled=false;el('line').disabled=false;}render();}
for(const [value,label]of histOptions){const b=document.createElement('button');b.className='chip';b.textContent=label;b.dataset.value=value;b.setAttribute('aria-pressed','false');b.onclick=()=>setHist(value);el('hist').append(b);}
for(const key of ['context','line','gene','prior'])el(key).addEventListener('change',e=>{state[key]=e.target.value;render();});
el('pdl').addEventListener('input',e=>{const v=e.target.value;const valid=v===''||(Number.isFinite(Number(v))&&Number(v)>=0&&Number(v)<=100);state.pdl=valid?v:'';el('pdl-hint').textContent=valid?'原摘要第 1 項為 >50%；50% 的界線仍待確認。':'請輸入 0–100；無效數值不作篩選。';e.target.setAttribute('aria-invalid',String(!valid));render();});
el('reset').onclick=()=>{Object.keys(state).forEach(k=>state[k]='');el('line').value='';el('refine').open=false;el('pdl').setAttribute('aria-invalid','false');el('pdl-hint').textContent='原摘要第 1 項為 >50%；50% 的界線仍待確認。';setHist('');};
el('version').textContent='v'+trialConfig.version+' · '+trialConfig.updated;
el('data-date').textContent='資料：'+trialConfig.updated+' 討論版本。';
el('common-note').textContent=trialConfig.commonNote;
el('common-checks').replaceChildren(...trialConfig.commonChecks.map(text=>{const span=document.createElement('span');span.textContent=text;return span;}));
setHist('');
</script></body></html>
