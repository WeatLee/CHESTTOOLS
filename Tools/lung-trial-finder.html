 if(t.histology&&s.hist&&t.family==='ns'){
  const possible={luad:['luad'],sq:['sq'],otherns:['otherns'],nonsq:['luad','otherns'],ns:['luad','sq','otherns']};
  const allowed=t.histology.flatMap(h=>h==='nonsq'?['luad','otherns']:h==='ns'?['luad','sq','otherns']:[h]);
  const path=possible[s.hist]||[];
  if(!path.some(h=>allowed.includes(h)))return null;
  if(path.some(h=>!allowed.includes(h)))unknown.push('病理亞型需核對');
 }
 const lateDefault=t.family==='ns'&&(t.priorLines||t.gene?.includes('wt'));
 const contexts=t.contexts||(lateDefault?trialConfig.defaults.lateContexts:null);
 if(contexts&&s.context&&!contexts.includes(s.context))return null;
 // Provisional stage/biomarker labels inform the user; they are not hard exclusions.
 if(t.priorLines&&s.line!==''&&!t.priorLines.includes(Number(s.line)))return null;
 const firstLine=t.priorLines&&t.priorLines.every(x=>x===0);
 if(firstLine&&s.prior&&s.prior!=='untreated')return null;
 if(t.lineRule==='platinum_failure'){
  if(s.line==='0'||s.prior==='untreated'||s.prior==='tki')return null;
  if(Number(s.line)>1){if(s.gene==='wt')return null;unknown.push('AGA（＋）先標靶後化療的整體線數待確認');}
 }
 if(t.prior){
  if(!t.prior.includes('untreated')&&(s.line==='0'||s.prior==='untreated'))return null;
  if(s.prior&&s.prior!=='other'&&!t.prior.includes(s.prior))return null;
 }
 if(!geneMatch(t,s.gene))return null;
 if(t.pdlMin!==undefined&&s.pdl!==''&&Number(s.pdl)<=t.pdlMin)return null;
 if(t.brain==='asymptomatic'&&s.brain==='sym')unknown.push('有症狀腦轉移需核對');
 return {trial:t,unknown};
}

const el=id=>document.getElementById(id);
const optionsFor=key=>({hist:histOptions,gene:geneOptions,context:state.hist==='sclc'?ctxSC:ctxNS,line:lineOptions,prior:state.hist==='sclc'?priorSC:priorNS,brain:brainOptions})[key];
const escapeHTML=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function setChoice(key,value){
 state[key]=state[key]===value?'':value;
 if(key==='hist'){
  if(!optionsFor('context').some(o=>o[0]===state.context))state.context='';
  if(!optionsFor('prior').some(o=>o[0]===state.prior))state.prior='';
  if(['sclc','meso'].includes(state.hist)){state.gene='';state.pdl='';el('pdl').value='';}
 }
 render();
}

function choices(key){
 const parent=el(key);
 parent.replaceChildren(...optionsFor(key).map(([value,label])=>{
  const b=document.createElement('button');b.type='button';b.className='chip';b.dataset.value=value;b.textContent=label;
  b.setAttribute('aria-pressed',String(state[key]===value));b.onclick=()=>setChoice(key,value);return b;
 }));
}

function card(m){
 const t=m.trial,e=escapeHTML;const c=document.createElement('article');c.className='card';c.dataset.studyId=t.id;
 const tags=[t.histology?.includes('sq')?'SqCC':t.histology?.includes('luad')?'LUAD':t.histology?.includes('nonsq')?'Non-SqCC':t.family==='sclc'?'SCLC':t.family==='meso'?'Meso':'NSCLC'];
 if(t.treatmentLabel)tags.push(t.treatmentLabel);
 if(t.gene&&!t.geneProvisional)tags.push(t.gene.map(g=>geneLabels[g]||g).join('／'));
 if(t.pdlMin!==undefined)tags.push('PD-L1 >'+t.pdlMin+'%');
 if(t.stageLabel&&!t.stagePending&&!t.stageProvisional)tags.push(t.stageLabel);
 const reviews=[...(t.reviewNotes||[]),...m.unknown];
 if(t.stagePending)reviews.unshift('晚期，確切期別待確認');
 if(t.stageProvisional)reviews.unshift(t.stageLabel+'（待確認）');
 c.innerHTML='<div class="top"><span class="id">Study '+t.id+'</span><h3>'+e(t.drug)+'</h3></div>'+
  '<div class="drug-class">'+e(t.drugClass)+' <a href="'+e(t.classSource)+'" target="_blank" rel="noopener noreferrer" aria-label="'+e(t.drug)+' 藥物類型來源">來源 ↗</a></div>'+
  '<div class="tags">'+tags.map(x=>'<span class="tag">'+e(x)+'</span>').join('')+'</div>'+
  (t.text?'<p>'+e(t.text)+'</p>':'')+
  (t.timing?'<p class="timing">提醒：'+e(t.timing)+'</p>':'')+
  [...new Set(reviews)].map(x=>'<div class="review">'+e(x)+'</div>').join('')+
  '<div class="foot"><span>研究窗口｜'+e(t.people)+'</span><span class="subtle">表格第 '+t.group+' 格</span></div>';
 return c;
}

function render(){
 const matches=studies.map(t=>match(t,state)).filter(Boolean);
 el('count').textContent=matches.length+' 個候選';el('results').replaceChildren(...matches.map(card));
 if(!matches.length){const box=document.createElement('div');box.className='empty';box.textContent='目前清單沒有對應候選。可取消部分條件再找，或請研究窗口確認。';el('results').append(box);}
 const summary=['hist','gene','context','line','prior','brain'].filter(k=>state[k]!=='').map(k=>optionsFor(k).find(o=>o[0]===state[k])?.[1]).filter(Boolean);
 if(state.pdl!=='')summary.push('PD-L1 '+state.pdl+'%');
 el('selection').textContent=summary.length?summary.join(' ／ '):'只選已知條件即可；再次點選可取消。';
 for(const k of ['hist','gene','context','line','prior','brain'])choices(k);
 const nonNS=['sclc','meso'].includes(state.hist);el('gene-section').hidden=nonNS;el('pdl-section').hidden=nonNS;
 const n=['pdl','prior','brain'].filter(k=>state[k]!=='').length;el('extra-count').textContent=n?' · 已選 '+n+' 項':'';
}

el('pdl').addEventListener('input',e=>{
 const v=e.target.value;const valid=!e.target.validity.badInput&&(v===''||(Number.isFinite(Number(v))&&Number(v)>=0&&Number(v)<=100));
 state.pdl=valid?v:'';e.target.setAttribute('aria-invalid',String(!valid));el('pdl-hint').textContent=valid?'AP203：TPS >1%。':'請輸入 0–100；目前不使用無效數值篩選。';render();
});
el('reset').onclick=()=>{for(const k of Object.keys(state))state[k]='';el('pdl').value='';el('pdl').setAttribute('aria-invalid','false');el('pdl-hint').textContent='AP203：TPS >1%。';el('refine').open=false;render();};
el('version').textContent='v'+trialConfig.version+' · '+trialConfig.updated;
el('data-date').textContent='資料更新：'+trialConfig.updated+'。';
el('common-note').textContent=trialConfig.commonNote;
el('common-checks').replaceChildren(...trialConfig.commonChecks.map(text=>{const s=document.createElement('span');s.textContent=text;return s;}));
render();

</script></body></html>
