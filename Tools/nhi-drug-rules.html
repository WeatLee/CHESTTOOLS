<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>健保給付規定查詢</title>
<style>:root{--navy:#15324a;--blue:#176b87;--mint:#dff2ed;--paper:#f7f4ed;--ink:#1d2b33;--muted:#62727a}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif}.top{background:linear-gradient(125deg,var(--navy),#245b70);color:#fff;padding:40px max(5vw,24px) 50px}.top small{letter-spacing:.16em;color:#aadbd1}.top h1{margin:.3em 0 .2em;font:500 clamp(2rem,4vw,3.7rem) Georgia,"Noto Serif TC",serif}.top p{max-width:760px;color:#dbe9eb}.wrap{max-width:1120px;margin:-24px auto 60px;padding:0 20px}.search{display:flex;gap:10px;background:#fff;padding:13px;border-radius:16px;box-shadow:0 14px 45px #16364b22}.search input,.search select{border:1px solid #ccd8da;border-radius:10px;padding:14px;font-size:16px}.search input{flex:1}.search button{border:0;border-radius:10px;background:var(--blue);color:#fff;padding:13px 22px;font-weight:700;cursor:pointer}.hint{color:var(--muted);margin:16px 4px 26px}.grid{display:grid;grid-template-columns:2fr 1fr;gap:22px}.card{background:#fff;border-radius:16px;padding:23px;box-shadow:0 8px 28px #16364b12}.card h2{margin-top:0;font-size:1.15rem}.result{padding:18px 0;border-top:1px solid #e3e9e8;line-height:1.75}.tag{display:inline-block;background:var(--mint);color:#205d58;padding:3px 9px;border-radius:20px;font-size:12px;margin-right:8px}.meta{font-size:13px;color:var(--muted)}mark{background:#ffe79a}.status{margin-bottom:12px;padding:12px;background:#f3f7f6;border-left:4px solid #5ba897}.notice{padding:12px;background:#fff5d9;border-left:4px solid #e0aa32;font-size:14px;line-height:1.6}.quick,.actions{display:flex;flex-wrap:wrap;gap:7px}.quick{margin:0 0 18px}.quick button,.actions button{border:1px solid #bdd3d4;background:#f6fbfa;color:#176b87;border-radius:20px;padding:7px 11px;cursor:pointer}.actions{margin-top:10px}.actions button.io{background:#15324a;color:#fff;border-color:#15324a}.context{margin-top:13px;padding:8px 15px;background:#f5f8f7;border-radius:10px}.context-row{padding:9px 0;border-bottom:1px solid #dde7e5;font-size:14px}.context-row.current{font-weight:700;color:#0e5f72}.modal{position:fixed;inset:0;background:#102938aa;display:none;z-index:50;padding:5vh 4vw}.modal.open{display:block}.modal-box{background:#fff;max-width:960px;height:90vh;margin:auto;border-radius:16px;padding:22px;overflow:auto;box-shadow:0 20px 80px #0005}.modal-head{position:sticky;top:-22px;background:#fff;padding:4px 0 14px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #ddd}.modal-head button{border:0;background:#15324a;color:#fff;border-radius:8px;padding:9px 13px;cursor:pointer}.io-row{padding:10px 0;border-bottom:1px solid #e4e9e8;line-height:1.7}@media(max-width:760px){.grid{grid-template-columns:1fr}.search{flex-wrap:wrap}.search input{min-width:100%}.modal{padding:0}.modal-box{height:100vh;border-radius:0}}</style></head>
<body><header class="top"><small>TAIWAN NHI · OFFLINE ARCHIVE</small><h1>健保給付規定查詢</h1><p>第六節呼吸道藥物與第九節抗癌瘤藥物。可展開條文上下文及完整 IO 給付注意事項。</p></header><main class="wrap"><form class="search" id="form"><input id="q" value="nivolumab" placeholder="輸入藥名、疾病或治療情境"><select id="section"><option value="">第六＋第九節</option><option value="6">第六節</option><option value="9">第九節</option></select><button>查詢</button></form><p class="hint">多個關鍵字需出現在同一段落；英文不分大小寫。</p><div class="grid"><section class="card"><div class="quick"><button data-q="nivolumab">nivolumab</button><button data-q="nivolumab 術前">nivolumab＋術前</button><button data-q="Opdivo">Opdivo</button><button data-q="肺癌 術前輔助">肺癌＋術前輔助</button><button data-io="1">完整 IO 給付規定</button></div><h2 id="resultTitle">查詢結果</h2><div id="results"></div></section><aside class="card"><h2>內建資料版本</h2><div id="status"></div><div class="notice">公開網頁為官方資料快照；正式申報請再次核對官方原始檔與生效日期。</div><h2 style="margin-top:26px">官方來源</h2><p><a href="https://www.nhi.gov.tw/ch/cp-7593-ad2a9-3397-1.html" target="_blank">最新版藥品給付規定</a></p><p><a href="https://www.nhi.gov.tw/ch/lp-3258-1.html?pi=1&ps=20" target="_blank">法規公告與修訂對照</a></p></aside></div></main><div class="modal" id="ioModal"><div class="modal-box"><div class="modal-head"><div><b>第 9.69 節</b>　免疫檢查點抑制劑完整規定</div><button id="closeModal">關閉</button></div><div id="ioContent"></div></div></div>
<script>window.NHI_DATA_PARTS=[];</script><script src="nhi-data-01.js"></script><script src="nhi-data-02.js"></script><script src="nhi-data-03.js"></script><script src="nhi-data-04.js"></script><script src="nhi-data-05.js"></script><script src="nhi-data-06.js"></script><script src="nhi-data-07.js"></script><script id="embedded-data" type="application/json"></script><script>
const DB=window.NHI_DATA_PARTS?JSON.parse(window.NHI_DATA_PARTS.join('')):JSON.parse(document.getElementById('embedded-data').textContent),$=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),rx=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
function run(){const query=$('q').value.trim(),terms=query.split(/\s+/).filter(Boolean),sec=$('section').value;let rows=DB.paragraphs.filter(x=>(!sec||String(x.section)===sec)&&terms.every(t=>x.text.toLocaleLowerCase().includes(t.toLocaleLowerCase()))).slice(0,100);$('resultTitle').textContent=`查詢結果 · ${rows.length} 筆`;$('results').innerHTML=rows.map(x=>{let t=esc(x.text);for(const w of terms)t=t.replace(new RegExp(rx(w),'gi'),m=>`<mark>${m}</mark>`);return `<article class="result"><span class="tag">第${x.section}節</span><span class="meta">第 ${x.ordinal} 段 · ${esc(x.update_label)}</span><div>${t}</div><div class="actions"><button onclick="toggleContext(${x.section},${x.ordinal},this)">顯示附近段落</button>${x.section===9?'<button class="io" onclick="showIO()">完整 IO 給付規定</button>':''}</div><div class="context" hidden></div></article>`}).join('')||'找不到同時包含所有關鍵字的段落；請減少關鍵字後重試。'}
function toggleContext(section,ordinal,button){const box=button.closest('.result').querySelector('.context');if(!box.hidden){box.hidden=true;button.textContent='顯示附近段落';return}const rows=DB.paragraphs.filter(x=>x.section===section),i=rows.findIndex(x=>x.ordinal===ordinal);box.innerHTML=rows.slice(Math.max(0,i-3),i+4).map(x=>`<div class="context-row ${x.ordinal===ordinal?'current':''}"><span class="meta">#${x.ordinal}</span> ${esc(x.text)}</div>`).join('');box.hidden=false;button.textContent='收合附近段落'}
function showIO(){const rows=DB.paragraphs.filter(x=>x.section===9),start=rows.findIndex(x=>/^9\.69\./.test(x.text));let end=rows.findIndex((x,i)=>i>start&&/^9\.(?:7[0-9]|[89][0-9])\./.test(x.text));if(end<0)end=Math.min(rows.length,start+500);$('ioContent').innerHTML=rows.slice(start,end).map(x=>`<div class="io-row"><span class="meta">#${x.ordinal}</span> ${esc(x.text)}</div>`).join('');$('ioModal').classList.add('open');document.body.style.overflow='hidden'}
$('form').addEventListener('submit',e=>{e.preventDefault();run()});document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{$('q').value=b.dataset.q;run()});document.querySelector('[data-io]').onclick=showIO;$('closeModal').onclick=()=>{$('ioModal').classList.remove('open');document.body.style.overflow=''};$('ioModal').onclick=e=>{if(e.target===$('ioModal'))$('closeModal').click()};document.addEventListener('keydown',e=>{if(e.key==='Escape')$('closeModal').click()});$('status').innerHTML=DB.versions.map(v=>`<div class="status"><b>第${v.section}節</b>　${esc(v.update_label)}<br><span class="meta">收錄：${esc(v.retrieved_at)}</span></div>`).join('');run();
</script></body></html>
