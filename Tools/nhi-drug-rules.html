<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>健保給付規定查詢</title>
<style>:root{--navy:#15324a;--blue:#176b87;--mint:#dff2ed;--paper:#f7f4ed;--ink:#1d2b33;--muted:#62727a}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif}.top{background:linear-gradient(125deg,var(--navy),#245b70);color:#fff;padding:40px max(5vw,24px) 50px}.top small{letter-spacing:.16em;color:#aadbd1}.top h1{margin:.3em 0 .2em;font:500 clamp(2rem,4vw,3.7rem) Georgia,"Noto Serif TC",serif}.top p{max-width:760px;color:#dbe9eb}.wrap{max-width:1120px;margin:-24px auto 60px;padding:0 20px}.search{display:flex;gap:10px;background:#fff;padding:13px;border-radius:16px;box-shadow:0 14px 45px #16364b22}.search input,.search select{border:1px solid #ccd8da;border-radius:10px;padding:14px;font-size:16px}.search input{flex:1}.search button{border:0;border-radius:10px;background:var(--blue);color:#fff;padding:13px 22px;font-weight:700;cursor:pointer}.hint{color:var(--muted);margin:16px 4px 26px}.grid{display:grid;grid-template-columns:2fr 1fr;gap:22px}.card{background:#fff;border-radius:16px;padding:23px;box-shadow:0 8px 28px #16364b12}.card h2{margin-top:0;font-size:1.15rem}.primary-rule{margin:18px 0 28px;border:2px solid #176b87;border-radius:13px;overflow:hidden}.primary-rule summary{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:13px 16px;background:#176b87;color:#fff;font-size:1.05rem;font-weight:700;cursor:pointer;list-style:none}.primary-rule summary::-webkit-details-marker{display:none}.primary-rule summary::after{content:'展開完整條文 ＋';flex:none;font-size:.82rem;font-weight:500}.primary-rule[open] summary::after{content:'收合完整條文 －'}.primary-rule-body{padding:7px 16px;background:#f2faf7}.primary-rule-row{padding:10px 0;border-bottom:1px solid #cee3dd;line-height:1.75}.primary-rule-row:last-child{border-bottom:0}.result-group{margin-top:22px}.result-group h3{margin:0;padding:12px 14px;border-radius:10px;background:#15324a;color:#fff;font-size:1rem}.result-group.other h3{background:#65757c}.group-empty{padding:16px;color:var(--muted);font-size:14px}.result{padding:18px 0;border-top:1px solid #e3e9e8;line-height:1.75}.tag{display:inline-block;background:var(--mint);color:#205d58;padding:3px 9px;border-radius:20px;font-size:12px;margin-right:8px}.meta{font-size:13px;color:var(--muted)}mark{background:#ffe79a}.status{margin-bottom:12px;padding:12px;background:#f3f7f6;border-left:4px solid #5ba897}.notice{padding:12px;background:#fff5d9;border-left:4px solid #e0aa32;font-size:14px;line-height:1.6}.quick,.actions{display:flex;flex-wrap:wrap;gap:7px}.quick{margin:0 0 18px}.quick button,.actions button{border:1px solid #bdd3d4;background:#f6fbfa;color:#176b87;border-radius:20px;padding:7px 11px;cursor:pointer}.actions{margin-top:10px}.actions button.io{background:#15324a;color:#fff;border-color:#15324a}.context{margin-top:13px;padding:8px 15px;background:#f5f8f7;border-radius:10px}.context-row{padding:9px 0;border-bottom:1px solid #dde7e5;font-size:14px}.context-row.current{font-weight:700;color:#0e5f72}.modal{position:fixed;inset:0;background:#102938aa;display:none;z-index:50;padding:5vh 4vw}.modal.open{display:block}.modal-box{background:#fff;max-width:960px;height:90vh;margin:auto;border-radius:16px;padding:22px;overflow:auto;box-shadow:0 20px 80px #0005}.modal-head{position:sticky;top:-22px;background:#fff;padding:4px 0 14px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #ddd}.modal-head button{border:0;background:#15324a;color:#fff;border-radius:8px;padding:9px 13px;cursor:pointer}.io-row{padding:10px 0;border-bottom:1px solid #e4e9e8;line-height:1.7}@media(max-width:760px){.grid{grid-template-columns:1fr}.search{flex-wrap:wrap}.search input{min-width:100%}.primary-rule summary{align-items:flex-start;flex-direction:column}.primary-rule summary::after{align-self:flex-end}.modal{padding:0}.modal-box{height:100vh;border-radius:0}}</style></head>
<body><header class="top"><a style="display:inline-block;margin:0 8px 14px 0;padding:8px 13px;border:1px solid #aadbd1;border-radius:20px;color:#fff;text-decoration:none;font-weight:700" href="https://weatlee.github.io/CHESTTOOLS/">← 回 CHESTTOOLS 首頁</a><a style="display:inline-block;margin-bottom:14px;padding:8px 13px;border:1px solid #aadbd1;border-radius:20px;color:#fff;text-decoration:none;font-weight:700" href="lung-cancer-nhi-pathway.html">肺癌選擇式查詢 →</a><br><small>TAIWAN NHI · OFFLINE ARCHIVE</small><h1>健保給付規定查詢</h1><p>第六節呼吸道藥物與第九節抗癌瘤藥物。可展開條文上下文及完整 IO 給付注意事項。</p></header><main class="wrap"><form class="search" id="form"><input id="q" value="" placeholder="輸入藥名、疾病或治療情境"><select id="section"><option value="">第六＋第九節</option><option value="6">第六節</option><option value="9">第九節</option></select><button>查詢</button></form><p class="hint">例如：nivolumab、惡性肋膜間質細胞瘤、肺癌 術前輔助。多個關鍵字需出現在同一段落；英文不分大小寫。</p><div class="grid"><section class="card"><h2 id="resultTitle">查詢結果</h2><div id="queryNote"></div><div id="contextActions"></div><div id="results">請輸入藥名、疾病或治療情境。</div></section><aside class="card"><h2>內建資料版本</h2><div id="status"></div><div class="notice">公開網頁為官方資料快照；正式申報請再次核對官方原始檔與生效日期。</div><h2 style="margin-top:26px">官方來源</h2><p><a href="https://www.nhi.gov.tw/ch/cp-7593-ad2a9-3397-1.html" target="_blank">最新版藥品給付規定</a></p><p><a href="https://www.nhi.gov.tw/ch/lp-3258-1.html?pi=1&ps=20" target="_blank">法規公告與修訂對照</a></p></aside></div></main><div class="modal" id="ioModal"><div class="modal-box"><div class="modal-head"><div><b>第 9.69 節</b>　免疫檢查點抑制劑完整規定</div><button id="closeModal">關閉</button></div><div id="ioContent"></div></div></div>
<script>window.NHI_DATA_PARTS=[];</script><script src="nhi-data-01.js"></script><script src="nhi-data-02.js"></script><script src="nhi-data-03.js"></script><script src="nhi-data-04.js"></script><script src="nhi-data-05.js"></script><script src="nhi-data-06.js"></script><script src="nhi-data-07.js"></script><script id="embedded-data" type="application/json"></script><script>
const DB=window.NHI_DATA_PARTS?JSON.parse(window.NHI_DATA_PARTS.join('')):JSON.parse(document.getElementById('embedded-data').textContent),$=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),rx=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
const ALIASES=[['惡性肋膜間質細胞瘤','惡性肋膜間皮瘤'],['肋膜間質細胞瘤','肋膜間皮瘤'],['惡性胸膜間皮瘤','惡性肋膜間皮瘤'],['胸膜間皮瘤','肋膜間皮瘤'],['mesothilioma','惡性肋膜間皮瘤'],['mesothelioma','惡性肋膜間皮瘤']];
function normalizeQuery(value){let normalized=value;for(const [common,official] of ALIASES)normalized=normalized.replace(new RegExp(rx(common),'gi'),official);return normalized}
const PULMONARY_RX=/肺癌|肺腺癌|肺鱗狀細胞癌|肺腫瘤|非小細胞|小細胞肺|NSCLC|SCLC|間皮瘤|mesothelioma|mesothilioma|肋膜|胸膜/i;
function sectionRows(section){return DB.paragraphs.filter(x=>x.section===section)}
function isRuleHeading(row){return new RegExp('^'+row.section+'\\.\\d+\\.').test(row.text.trim())}
function ruleBlock(row){const rows=sectionRows(row.section),i=rows.findIndex(x=>x.ordinal===row.ordinal);let start=i,end=rows.length;for(let j=i;j>=0;j--){if(isRuleHeading(rows[j])){start=j;break}}for(let j=i+1;j<rows.length;j++){if(isRuleHeading(rows[j])){end=j;break}}return rows.slice(start,end)}
function isPulmonary(row){return PULMONARY_RX.test(ruleBlock(row).map(x=>x.text).join(' '))}
function relevanceScore(row){const t=row.text;let score=0;if(/必須符合|限(?:制)?使用於|適用於|給付於|病患|患者/.test(t))score+=12;if(/EGFR|Exon|ALK|ROS1|PD-L1|基因|突變|第[ⅠⅡⅢⅣIV]+期|局部侵襲|轉移性/i.test(t))score+=8;if(/第一線|第二線|術前|術後|輔助治療|疾病惡化/.test(t))score+=4;if(/如需更換使用/.test(t))score+=5;if(/不得併用|不得互換|僅得擇一/.test(t))score-=5;if(isRuleHeading(row))score-=8;return score}
function ranked(rows){return rows.map((row,index)=>({row,index,score:relevanceScore(row)})).sort((a,b)=>b.score-a.score||a.index-b.index).map(x=>x.row)}
function highlighted(text,terms){let value=esc(text);for(const term of terms)value=value.replace(new RegExp(rx(term),'gi'),m=>`<mark>${m}</mark>`);return value}
function primaryRuleBlocks(terms,section){return DB.paragraphs.filter(x=>(!section||String(x.section)===section)&&isRuleHeading(x)&&terms.some(t=>t.length>=3&&x.text.toLocaleLowerCase().includes(t.toLocaleLowerCase()))).map(heading=>({heading,rows:ruleBlock(heading)}))}
function renderPrimaryRules(blocks,terms){const desktop=window.matchMedia('(min-width:761px)').matches;return blocks.map(block=>`<details class="primary-rule" ${desktop?'open':''}><summary><span>主要給付規定 · ${highlighted(block.heading.text,terms)}<br><small>第 ${block.rows[0].ordinal}–${block.rows.at(-1).ordinal} 段</small></span></summary><div class="primary-rule-body">${block.rows.map(x=>`<div class="primary-rule-row"><span class="meta">#${x.ordinal}</span> ${highlighted(x.text,terms)}</div>`).join('')}</div></details>`).join('')}
function renderRow(x,terms){return `<article class="result"><span class="tag">第${x.section}節</span><span class="meta">第 ${x.ordinal} 段 · ${esc(x.update_label)}</span><div>${highlighted(x.text,terms)}</div><div class="actions"><button onclick="toggleContext(${x.section},${x.ordinal},this)">顯示完整所屬條文</button></div><div class="context" hidden></div></article>`}
function renderGroup(title,rows,terms,css=''){return `<section class="result-group ${css}"><h3>${title} · ${rows.length} 筆</h3>${rows.length?rows.map(x=>renderRow(x,terms)).join(''):'<div class="group-empty">本次查詢沒有此類結果。</div>'}</section>`}
function run(){const original=$('q').value.trim();$('queryNote').innerHTML='';$('contextActions').innerHTML='';if(!original){$('resultTitle').textContent='查詢結果';$('results').textContent='請輸入藥名、疾病或治療情境。';return}const query=normalizeQuery(original),terms=query.split(/\s+/).filter(Boolean),sec=$('section').value;let rows=DB.paragraphs.filter(x=>(!sec||String(x.section)===sec)&&terms.every(t=>x.text.toLocaleLowerCase().includes(t.toLocaleLowerCase()))).slice(0,100),blocks=primaryRuleBlocks(terms,sec),primaryKeys=new Set(blocks.flatMap(b=>b.rows.map(x=>`${x.section}:${x.ordinal}`))),related=rows.filter(x=>!primaryKeys.has(`${x.section}:${x.ordinal}`));if(query!==original)$('queryNote').innerHTML=`<div class="notice">已將「${esc(original)}」對應為官方條文用語「${esc(query)}」。</div>`;$('resultTitle').textContent=blocks.length?`主要條文 ${blocks.length} 組 · 其他提及 ${related.length} 筆`:`查詢結果 · ${rows.length} 筆`;const ioRelated=/nivolumab|pembrolizumab|atezolizumab|avelumab|ipilimumab|durvalumab|tremelimumab|cemiplimab|dostarlimab|免疫檢查點|間皮瘤/i.test(query);if(ioRelated&&rows.some(x=>x.section===9))$('contextActions').innerHTML='<div class="actions"><button class="io" onclick="showIO()">查看完整第 9.69 節 IO 給付規定</button></div>';const pulmonary=ranked(related.filter(isPulmonary)),other=ranked(related.filter(x=>!isPulmonary(x))),primaryHtml=renderPrimaryRules(blocks,terms),relatedHtml=related.length?renderGroup('其他提及：肺癌／胸腔腫瘤相關',pulmonary,terms)+renderGroup('其他提及：其他癌別',other,terms,'other'):'';$('results').innerHTML=blocks.length||rows.length?primaryHtml+relatedHtml:'找不到同時包含所有關鍵字的段落；請減少關鍵字後重試。'}
function toggleContext(section,ordinal,button){const box=button.closest('.result').querySelector('.context');if(!box.hidden){box.hidden=true;button.textContent='顯示完整所屬條文';return}const current=DB.paragraphs.find(x=>x.section===section&&x.ordinal===ordinal),rows=ruleBlock(current);box.innerHTML=rows.map(x=>`<div class="context-row ${x.ordinal===ordinal?'current':''}"><span class="meta">#${x.ordinal}</span> ${esc(x.text)}</div>`).join('');box.hidden=false;button.textContent='收合完整所屬條文'}
function showIO(){const rows=DB.paragraphs.filter(x=>x.section===9),start=rows.findIndex(x=>/^9\.69\./.test(x.text));let end=rows.findIndex((x,i)=>i>start&&/^9\.(?:7[0-9]|[89][0-9])\./.test(x.text));if(end<0)end=Math.min(rows.length,start+500);$('ioContent').innerHTML=rows.slice(start,end).map(x=>`<div class="io-row"><span class="meta">#${x.ordinal}</span> ${esc(x.text)}</div>`).join('');$('ioModal').classList.add('open');document.body.style.overflow='hidden'}
$('form').addEventListener('submit',e=>{e.preventDefault();run()});$('closeModal').onclick=()=>{$('ioModal').classList.remove('open');document.body.style.overflow=''};$('ioModal').onclick=e=>{if(e.target===$('ioModal'))$('closeModal').click()};document.addEventListener('keydown',e=>{if(e.key==='Escape')$('closeModal').click()});$('status').innerHTML=DB.versions.map(v=>`<div class="status"><b>第${v.section}節</b>　${esc(v.update_label)}<br><span class="meta">收錄：${esc(v.retrieved_at)}</span></div>`).join('');run();
</script></body></html>
