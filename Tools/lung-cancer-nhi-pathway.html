  <style>
    :root{--navy:#15324a;--blue:#176b87;--mint:#dff2ed;--paper:#f7f4ed;--ink:#1d2b33;--muted:#62727a;--line:#dce6e4;--ok:#187464;--warn:#9a6a09;--no:#a44646;--quiet:#68777d;--white:#fff}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif;line-height:1.65}
    button,a{font:inherit}.top{background:linear-gradient(125deg,var(--navy),#245b70);color:#fff;padding:30px max(5vw,20px) 54px}.topbar{display:flex;gap:8px;flex-wrap:wrap}.home-link{display:inline-block;padding:7px 12px;border:1px solid #aadbd1;border-radius:20px;color:#fff;text-decoration:none;font-weight:700}.top small{display:block;margin-top:22px;letter-spacing:.14em;color:#aadbd1}.top h1{margin:.22em 0 .18em;font:500 clamp(1.9rem,4vw,3.4rem) Georgia,"Noto Serif TC",serif;line-height:1.18}.top p{max-width:820px;margin:.45rem 0;color:#dbe9eb}
    .wrap{max-width:1040px;margin:-28px auto 72px;padding:0 18px}.panel{background:#fff;border-radius:18px;padding:clamp(18px,3vw,30px);box-shadow:0 10px 35px #16364b16}.meta-strip{display:flex;gap:8px 18px;flex-wrap:wrap;color:var(--muted);font-size:.88rem;border-bottom:1px solid var(--line);padding-bottom:16px}.meta-strip a{color:var(--blue)}
    .disclaimer{margin:18px 0;padding:12px 14px;background:#fff6dc;border-left:4px solid #dfaa36;border-radius:6px;font-size:.92rem}.progress{display:flex;gap:7px;flex-wrap:wrap;margin:20px 0}.crumb{border:1px solid #c4d7d8;background:#f5fbfa;color:#226578;border-radius:20px;padding:6px 11px;cursor:pointer}.crumb:hover{background:var(--mint)}
    .question{margin-top:24px;scroll-margin-top:18px}.question .eyebrow{font-size:.8rem;letter-spacing:.08em;color:var(--blue);font-weight:700}.question h2{margin:.2rem 0 5px;font-size:clamp(1.2rem,3vw,1.55rem);line-height:1.4}.question p{margin:.2rem 0 15px;color:var(--muted)}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.choice{min-height:58px;text-align:left;padding:13px 15px;border:1px solid #bdd3d4;border-radius:12px;background:#fff;color:var(--ink);cursor:pointer;transition:.15s}.choice:hover,.choice:focus-visible{border-color:var(--blue);box-shadow:0 0 0 3px #176b8718;outline:0}.choice.selected{background:var(--blue);border-color:var(--blue);color:#fff}.choice small{display:block;opacity:.78;margin-top:2px}
    .result-area{margin-top:30px;padding-top:24px;border-top:2px solid var(--line)}.result-area h2{margin:0 0 12px}.state{border-left:5px solid var(--quiet);background:#f2f5f5;border-radius:10px;padding:14px 16px;margin-bottom:16px}.state.ok{border-color:var(--ok);background:#edf8f5}.state.warn{border-color:#daa62c;background:#fff8e6}.state.no{border-color:var(--no);background:#fff0f0}.state.quiet{border-color:var(--quiet)}.state strong{display:block;font-size:1.05rem}.state p{margin:.3rem 0 0}
    .therapy{border:1px solid #c9dbda;border-radius:14px;overflow:hidden;margin:13px 0}.therapy>summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:15px 17px;background:#f6fbfa;color:#174b5f;cursor:pointer;font-weight:700}.therapy>summary::-webkit-details-marker{display:none}.therapy>summary::after{content:"查看條件 ＋";font-size:.8rem;font-weight:500;white-space:nowrap}.therapy[open]>summary::after{content:"收合條件 －"}.therapy-body{padding:7px 17px 17px}.therapy-body dl{display:grid;grid-template-columns:9rem 1fr;margin:0}.therapy-body dt,.therapy-body dd{padding:9px 0;border-bottom:1px solid var(--line)}.therapy-body dt{font-weight:700;color:#355b67}.therapy-body dd{margin:0}.therapy-body ul{margin:0;padding-left:1.25rem}.therapy-body .source{font-size:.88rem;color:var(--muted)}
    details.common{margin:16px 0;border-radius:12px;background:#f3f7f6;padding:0 15px}.common summary{padding:13px 0;cursor:pointer;font-weight:700;color:#285e69}.common ul{margin:0;padding:0 0 15px 1.25rem}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:25px}.btn{border:1px solid #bdd3d4;background:#fff;color:var(--blue);border-radius:22px;padding:9px 15px;cursor:pointer;text-decoration:none;font-weight:700}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.footnote{margin-top:22px;color:var(--muted);font-size:.86rem}
    .mobile-actions{display:none}
    @media(max-width:680px){.top{padding-top:20px}.wrap{padding:0 10px}.panel{padding:18px 14px}.choices{grid-template-columns:1fr}.therapy>summary{align-items:flex-start}.therapy-body dl{grid-template-columns:1fr}.therapy-body dt{padding-bottom:1px;border:0}.therapy-body dd{padding-top:1px}.mobile-actions{position:sticky;bottom:8px;display:flex;gap:8px;margin:22px 0 0;padding:8px;background:#ffffffee;border:1px solid var(--line);border-radius:25px;box-shadow:0 8px 28px #16364b22;z-index:10}.mobile-actions .btn{flex:1;text-align:center;padding:8px}.actions{display:none}}
  </style>

<body>
  <header class="top">
    <nav class="topbar">
      <a class="home-link" href="https://weatlee.github.io/CHESTTOOLS/">← 回 CHESTTOOLS 首頁</a>

    <small>TAIWAN NHI · LUNG CANCER PATHWAY</small>
    <h1>肺癌健保特殊用藥路徑查詢</h1>
    <p>依癌別、期別、基因、PD-L1 與既往治療，篩選目前可能符合的特殊健保給付路徑。</p>
  </header>
  <main class="wrap">
    <section class="panel">
      <div class="meta-strip">
        <span><b>資料版本：</b>第九節 115.8.21</span>
        <span><b>本機資料查核：</b>2026-08-29</span>
        <a href="https://www.nhi.gov.tw/ch/cp-7593-ad2a9-3397-1.html" target="_blank" rel="noopener">健保署最新版規定</a>
        <a href="https://www.nhi.gov.tw/ch/lp-3258-1.html?pi=1&amp;ps=20" target="_blank" rel="noopener">修訂公告與對照</a>
      </div>
      <div class="disclaimer">本系統僅供健保給付條件初步核對，不取代最新公告、臨床判斷或健保事前審查結果；一般化療及自費治療不在本系統範圍內。</div>
      <div class="progress" id="progress" aria-label="目前查詢路徑"></div>
      <div id="flow"></div>
      <div id="result" aria-live="polite"></div>
      <div class="actions">
        <button class="btn" id="backBtn" type="button">← 修改上一題</button>
        <button class="btn" id="resetBtn" type="button">重新開始</button>
        <a class="btn" id="fullBottom" href="#">前往完整條文查詢</a>
      </div>
      <div class="mobile-actions">
        <button class="btn" id="mobileBack" type="button">← 上一步</button>
        <button class="btn" id="mobileReset" type="button">重新開始</button>
      </div>
      <p class="footnote">本頁不要求、儲存或傳送病人姓名、病歷號或其他個人資料。重新整理會保留本次選擇；按「重新開始」才會清除。</p>
    </section>
  </main>
<script>
(() => {
  'use strict';
  const STORAGE='nhi-lung-pathway-v1';
  const state=load();
  const history=[];
  const $=id=>document.getElementById(id);
  const FULL_TEXT=/lung-cancer-nhi-pathway/i.test(decodeURIComponent(location.pathname))?'nhi-drug-rules.html?v=115.8.21':'健保給付規定查詢.html';
  $('fullTop').href=FULL_TEXT;$('fullBottom').href=FULL_TEXT;

  const LABELS={
    cancer:{nonSq:'非鱗狀 NSCLC',sq:'鱗狀 NSCLC（SQCC）',sclc:'小細胞肺癌（SCLC）',meso:'惡性肋膜間皮瘤',other:'其他胸腔腫瘤'},
    nsclcStage:{resectable:'可切除、無遠端轉移',stage3:'不可切除第三期',advanced:'復發或轉移性'},
    size:{ge4:'腫瘤 ≥4 公分',lt4:'腫瘤 <4 公分'},node:{n0:'N0',n1:'N1',n2:'N2',n3:'N3'},yesno:{yes:'有',no:'無'},
    gene:{egfr:'EGFR',alk:'ALK',ros1:'ROS1',met:'MET exon 14 skipping',braf:'BRAF V600E',ntrk:'NTRK fusion',other:'其他 driver alteration'},
    line:{first:'第一線',maintenance:'第一線後維持治療',second:'第二線',third:'第三線',later:'第四線以上'},
    sclcStage:{limited:'Limited stage',extensive:'Extensive stage'},mesoStage:{resectable:'可切除',unresectable:'無法切除'},mesoHist:{nonEpi:'非上皮型',epi:'上皮型'}
  };
  const Q={
    cancer:['第一層','選擇癌別／組織型','第一層的組織型會沿用至後續路徑。','cancer',[['nonSq','非鱗狀 NSCLC','包含肺腺癌'],['sq','鱗狀 NSCLC（SQCC）',''],['sclc','小細胞肺癌（SCLC）',''],['meso','惡性肋膜間皮瘤',''],['other','其他胸腔腫瘤','轉往完整條文查詢']]],
    nsclcStage:['第二層','目前疾病情境','','nsclcStage',[['resectable','可切除、無遠端轉移',''],['stage3','不可切除第三期',''],['advanced','復發或轉移性','']]],
    size:['第三層','腫瘤最大徑是否 ≥4 公分？','','size',[['ge4','是，≥4 公分',''],['lt4','否，<4 公分','']]],
    node:['第四層','淋巴結分期為何？','','node',[['n0','N0',''],['n1','N1',''],['n2','N2',''],['n3','N3','']]],
    driverResect:['第五層','是否具有 driver gene alteration？','目前健保條件檢核範圍：EGFR／ALK。','driverResect',[['yes','有',''],['no','無','']]],
    driverStage3:['第三層','是否具有 driver gene alteration？','不可切除第三期路徑的檢核範圍依組織型顯示。','driverStage3',[['yes','有',''],['no','無','']]],
    pdlStage3:['第四層','PD-L1 是否 ≥1%？','需使用 Ventana SP263 檢測。','pdlStage3',[['yes','是，≥1%',''],['no','否，<1% 或未檢測','']]],
    hasDriver:['第三層','是否具有可辨識的 driver gene alteration？','','hasDriver',[['yes','有','選擇基因後繼續'],['no','無','進入免疫治療／其他特殊路徑']]],
    gene:['第四層','選擇 driver gene alteration','','gene',[['egfr','EGFR',''],['alk','ALK',''],['ros1','ROS1',''],['met','MET exon 14 skipping',''],['braf','BRAF V600E',''],['ntrk','NTRK fusion','特殊條件路徑'],['other','其他 driver alteration','例如 KRAS、RET、HER2']]],
    line:['下一層','目前治療線別／情境','','line',[]]
  };

  function load(){try{return JSON.parse(sessionStorage.getItem(STORAGE))||{}}catch{return {}}}
  function save(){sessionStorage.setItem(STORAGE,JSON.stringify(state))}
  function clearAfter(key){const order=history.map(x=>x.key),i=order.indexOf(key);if(i<0)return;for(const k of order.slice(i+1))delete state[k]}
  function choose(key,value){clearAfter(key);state[key]=value;save();render();setTimeout(()=>{const el=document.querySelector('.question:last-child,.result-area');if(el)el.scrollIntoView({behavior:'smooth',block:'start'})},30)}
  function question(key,eyebrow,title,help,choices){history.push({key,label:title});const selected=state[key];return `<section class="question"><div class="eyebrow">${eyebrow}</div><h2>${title}</h2>${help?`<p>${help}</p>`:''}<div class="choices">${choices.map(([v,l,s])=>`<button type="button" class="choice ${selected===v?'selected':''}" data-key="${key}" data-value="${v}">${l}${s?`<small>${s}</small>`:''}</button>`).join('')}</div></section>`}
  function ask(name,overrideChoices){const q=Q[name],key=q[3]||name,choices=overrideChoices||q[4]||q[3];return question(key,q[0],q[1],q[2],choices)}
  function picked(key){return state[key]!==undefined}
  function label(key,value){return (LABELS[key]||LABELS.yesno||{})[value]||value}
  function stop(html){return {html,done:true}}

  const source=(paras)=>`第九節（本機版本 115.8.21；相關段落 ${paras}）。請以健保署最新公告與完整原文為準。`;
  function card(title,{indication='',conditions=[],use='',review='',warning='',paras='',ici=false,status='ok'}={}){
    return `<details class="therapy"><summary><span>${title}</span></summary><div class="therapy-body"><dl>
      ${indication?`<dt>給付情境</dt><dd>${indication}</dd>`:''}
      ${conditions.length?`<dt>主要條件</dt><dd><ul>${conditions.map(x=>`<li>${x}</li>`).join('')}</ul></dd>`:''}
      ${use?`<dt>方案／療程</dt><dd>${use}</dd>`:''}
      ${review?`<dt>申請與續用</dt><dd>${review}</dd>`:''}
      ${warning?`<dt>重要限制</dt><dd>${warning}</dd>`:''}
      <dt>條文來源</dt><dd class="source">${source(paras)}</dd>
    </dl>${ici?commonICI():''}</div></details>`;
  }
  function commonICI(){return `<details class="common"><summary>免疫治療共同申請條件</summary><ul>
    <li>ECOG performance status ≤1；NYHA Functional Class I 或 II。</li><li>GOT(AST)與 GPT(ALT)皆低於 60 U/L，總膽紅素低於 1.5 mg/dL。</li>
    <li>肺癌及其他癌別：serum creatinine &lt;1.5 mg/dL 且 eGFR &gt;60 mL/min/1.73m²。</li><li>依條文檢附病理、基因及 PD-L1 報告；影像檢查須於 12 週內，PET 不列入。</li>
    <li>須事前審查，每次申請以 12 週為限；同一適應症每位病人限用一種免疫檢查點抑制劑，原則不得互換。</li><li>除條文明定之合併方案外，不得與標靶藥物併用；一般最長給付 2 年，特定方案依各自上限。</li>
  </ul></details>`}
  function resultState(kind,title,text,cards=[]){return stop(`<section class="result-area"><h2>查詢結果</h2><div class="state ${kind}"><strong>${title}</strong><p>${text}</p></div>${cards.join('')}<p class="footnote">依目前輸入條件，這是健保給付路徑的初步篩選結果；仍須核對病歷、檢驗報告、完整條文與最新公告。</p></section>`)}
  const no=(reason)=>resultState('no','不符合此給付路徑',reason);
  const none=(reason)=>resultState('quiet','目前無相符的特殊給付選項',reason+' 一般化療及自費治療不在本系統範圍內。');

  function resectable(){let html=ask('size');if(!picked('size'))return {html};html+=ask('node');if(!picked('node'))return {html};if(state.node==='n3')return stop(html+no('N3 不符合目前 nivolumab 術前輔助治療的健保條件。').html);if(state.size==='lt4'&&state.node==='n0')return stop(html+no('腫瘤小於 4 公分且為 N0，未符合「腫瘤 ≥4 公分或 N1／N2」條件。').html);html+=ask('driverResect');if(!picked('driverResect'))return {html};if(state.driverResect==='yes')return stop(html+no('具有 EGFR／ALK driver gene alteration，不符合目前 nivolumab 術前輔助治療的健保給付條件。').html);
    const chemo=state.cancer==='sq'?'含鉑化學治療（鱗狀 NSCLC 適用骨架）':'pemetrexed＋含鉑化學治療（非鱗狀 NSCLC）';
    return stop(html+resultState('ok','可評估申請','目前選擇符合 nivolumab 術前輔助治療的初步條件。',[card(`Nivolumab＋${chemo}`,{indication:'可切除、腫瘤 ≥4 公分或淋巴結陽性 N1／N2（排除 N3）、無遠端轉移之 NSCLC 術前輔助治療。',conditions:['EGFR／ALK 無異常','健保申請目前不需檢附 PD-L1 檢測報告'],use:'與組織型相符之含鉑化療併用，至多 3 個療程。',review:'須符合免疫檢查點抑制劑事前審查規定。',warning:'本結果僅涵蓋成人路徑。',paras:'34、894–896',ici:true})]).html)}

  function stage3(){const scope=state.cancer==='sq'?'EGFR／ALK':'EGFR／ALK／ROS1';let html=ask('driverStage3').replace('依組織型顯示',`本路徑檢核：${scope}`);if(!picked('driverStage3'))return {html};if(state.driverStage3==='yes')return stop(html+no(`具有 ${scope} 中的 driver alteration，不符合目前此 durvalumab 路徑。`).html);html+=ask('pdlStage3');if(!picked('pdlStage3'))return {html};if(state.pdlStage3==='no')return stop(html+no('PD-L1 未達 ≥1%（Ventana SP263），不符合目前 durvalumab 鞏固治療給付條件。').html);
    return stop(html+resultState('warn','完成條件後可申請','可規劃健保 durvalumab 鞏固治療；病人目前若尚未治療，需先完成下列療程。',[card('Durvalumab 單用（Monotherapy）',{indication:'無法手術切除之第三期 NSCLC，根治性同步化放療後的鞏固治療。',conditions:[`${scope} 無異常`,'PD-L1 ≥1%（Ventana SP263）','完成根治性同步放射治療及至少 2 個療程含鉑化療','同步化放療後疾病未惡化'],use:'單用（Monotherapy），最長給付 12 個月。',review:'須事前審查；申請原因代碼 P015。',warning:'「接受同步化放療且治療後未惡化」是最後申請條件，不是新診斷當下即可確認的條件。',paras:'854',ici:true})]).html)}

  function metastatic(){let html=ask('hasDriver');if(!picked('hasDriver'))return {html};if(state.hasDriver==='yes'){html+=ask('gene');if(!picked('gene'))return {html};return driverPath(html)}return immunePath(html)}
  function driverPath(html){switch(state.gene){case'egfr':return egfr(html);case'alk':return alk(html);case'ros1':return ros1(html);case'met':return stop(html+resultState('ok','可評估申請','目前有 MET exon 14 skipping 對應的標靶給付路徑。',[card('Tepotinib 單用（Monotherapy）',{indication:'MET exon 14 skipping 之轉移性 NSCLC。',conditions:['檢附病理／細胞學及 MET exon 14 skipping 檢測報告'],use:'單用；每日最多 2 錠。',review:'事前審查，每 3 個月再次申請。',warning:'Tepotinib 治療失敗後，同一適應症不得申請相關 PD-1／PD-L1 抑制劑。',paras:'現行 tepotinib 所屬完整條文'})]).html);case'braf':return braf(html);case'ntrk':return ntrk(html);default:return otherDriver(html)}}

  function egfr(html){const choices=[['first','尚未接受晚期全身治療（第一線）',''],['t790m','既往 EGFR-TKI 後惡化，評估 T790M 第二線',''],['later','其他後線情境','嚴格依給付線別判斷']];html+=question('egfrSetting','下一層','EGFR 治療情境','第一線指未曾接受局部晚期／轉移性疾病的全身治療。',choices);if(!picked('egfrSetting'))return {html};if(state.egfrSetting==='later')return stop(html+none('目前輸入不是明確的第一線或 T790M 第二線條件，系統不向後延伸給付線別。').html);if(state.egfrSetting==='t790m'){html+=question('priorEgfrTki','下一層','是否曾使用 gefitinib、erlotinib、afatinib 或 dacomitinib 後惡化？','',[['yes','是',''],['no','否','']]);if(!picked('priorEgfrTki'))return {html};if(state.priorEgfrTki==='no')return stop(html+no('未符合條文明列的既往 EGFR-TKI 治療條件。').html);html+=question('t790m','下一層','是否檢出 EGFR T790M？','',[['yes','是',''],['no','否','']]);if(!picked('t790m'))return {html};if(state.t790m==='no')return stop(html+no('未檢出 T790M，不符合 osimertinib／aumolertinib 第二線路徑。').html);return stop(html+resultState('ok','可評估申請','符合 T790M 後第二線路徑的初步條件。',[card('Osimertinib 單用（Monotherapy）',{indication:'既往指定 EGFR-TKI 後惡化且 EGFR T790M 陽性。',conditions:['健保限定第二線使用'],use:'單用。',warning:'不可延伸為第三線給付；是否個案送審由醫師判斷。',paras:'1454–1464'}),card('Aumolertinib 單用（Monotherapy）',{indication:'既往指定 EGFR-TKI 後惡化且 EGFR T790M 陽性。',conditions:['健保限定第二線使用'],use:'單用。',warning:'與 osimertinib 僅得擇一；除不耐受外不得互換。',paras:'2277–2288'})]).html)}

    if(state.line==='second'){html+=question('sqSecondPrior','下一層','是否已接受第一線含鉑化療並疾病惡化？','',[['yes','是',''],['no','否','']]);if(!picked('sqSecondPrior'))return {html};if(state.sqSecondPrior==='no')return stop(html+no('未符合鱗狀 NSCLC 第二線特殊路徑的既往治療條件。').html);html=pdlQuestion(html,'sqPdl2',true);if(!picked('sqPdl2'))return {html};let cards=[card('Afatinib 單用（Monotherapy）',{indication:'鱗狀 NSCLC 第一線含鉑化療後惡化的第二線。',conditions:['不要求 EGFR mutation'],use:'單用；健保限定第二線。',paras:'545–558'})];if(state.sqPdl2==='high22')cards.push(card('Pembrolizumab 單用（Monotherapy）',{indication:'鱗狀 NSCLC 第二線，TPS ≥50%。',use:'單用。',review:'事前審查。',paras:'850–1025',ici:true}));if(state.sqPdl2==='highNivo')cards.push(card('Nivolumab 單用（Monotherapy）',{indication:'鱗狀 NSCLC 第二線，符合 nivolumab 對應的 TC ≥50% 條件。',use:'單用。',review:'事前審查。',paras:'850–1025',ici:true}));if(state.sqPdl2==='high142')cards.push(card('Atezolizumab 單用（Monotherapy）',{indication:'鱗狀 NSCLC 第二線，TC ≥50% 或 IC ≥10%（SP142）。',use:'單用。',review:'事前審查。',paras:'850–1025',ici:true}));return stop(html+resultState('ok','可評估申請','第二線結果包含 afatinib；免疫選項依 PD-L1 平台顯示。',cards).html)}
    html=pdlQuestion(html,'sqPdl1');if(!picked('sqPdl1'))return {html};let cards=[];if(state.sqPdl1==='high22')cards.push(card('Pembrolizumab 或 Cemiplimab 單用（擇一）',{indication:'EGFR／ALK 無異常且 TPS ≥50%（22C3／SP263）的第一線鱗狀 NSCLC。',use:'單用（Monotherapy），擇一。',review:'事前審查。',paras:'850–1025',ici:true}));if(state.sqPdl1==='mid22')cards.push(card('Pembrolizumab＋carboplatin＋paclitaxel',{indication:'EGFR／ALK 無異常、TPS 1–49% 的第一線鱗狀 NSCLC。',use:'合併治療至多 4 個療程，後續 pembrolizumab 維持依完整條文。',review:'事前審查。',paras:'850–1025',ici:true}));if(state.sqPdl1==='high142')cards.push(card('Atezolizumab 單用（Monotherapy）',{indication:'EGFR／ALK 無異常且 TC ≥50% 或 IC ≥10%（SP142）的第一線鱗狀 NSCLC。',use:'單用。',review:'事前審查。',paras:'850–1025',ici:true}));if(!cards.length)return stop(html+none('PD-L1 未達目前鱗狀 NSCLC 第一線免疫治療門檻。').html);return stop(html+resultState('ok','可評估申請','依 PD-L1 平台與門檻顯示第一線鱗狀 NSCLC 路徑。',cards).html)}

  function sclc(){let html=question('sclcStage','第二層','小細胞肺癌期別','',[['limited','Limited stage',''],['extensive','Extensive stage','']]);if(!picked('sclcStage'))return {html};if(state.sclcStage==='limited')return stop(html+none('目前第九節沒有本系統建模的 Limited-stage SCLC 特殊免疫給付路徑。').html);html+=question('cnsMet','第三層','是否有腦或脊椎轉移？','',[['yes','有',''],['no','無','']]);if(!picked('cnsMet'))return {html};if(state.cnsMet==='yes')return stop(html+no('有腦或脊椎轉移，不符合目前此 SCLC 第一線免疫合併路徑。').html);return stop(html+resultState('ok','可評估申請','符合 Extensive-stage SCLC 第一線免疫合併路徑的初步條件。',[card('Atezolizumab＋carboplatin＋etoposide',{indication:'未接受化療之 extensive-stage SCLC，且無腦或脊椎轉移。',conditions:['不要求 PD-L1 檢測報告'],use:'合併治療（Combination therapy），後續維持依完整條文。',review:'事前審查，每次 12 週。',paras:'850–1025',ici:true}),card('Durvalumab＋etoposide＋carboplatin／cisplatin',{indication:'未接受化療之 extensive-stage SCLC，且無腦或脊椎轉移。',conditions:['不要求 PD-L1 檢測報告'],use:'合併治療（Combination therapy），後續維持依完整條文。',review:'事前審查，每次 12 週。',paras:'850–1025',ici:true})]).html)}
  function meso(){let html=question('mesoStage','第二層','是否可手術切除？','',[['resectable','可切除',''],['unresectable','無法切除','']]);if(!picked('mesoStage'))return {html};if(state.mesoStage==='resectable')return stop(html+none('目前本系統建模的 ipilimumab＋nivolumab 路徑限無法切除疾病。').html);html+=question('mesoHist','第三層','病理組織型','',[['nonEpi','非上皮型（Non-epithelioid）',''],['epi','上皮型（Epithelioid）','']]);if(!picked('mesoHist'))return {html};if(state.mesoHist==='epi')return stop(html+no('上皮型不符合目前 ipilimumab＋nivolumab 的惡性肋膜間皮瘤給付條件。').html);html+=question('mesoPrior','第四層','是否曾接受此疾病的全身性治療？','',[['yes','曾接受',''],['no','未曾接受','第一線']]);if(!picked('mesoPrior'))return {html};if(state.mesoPrior==='yes')return stop(html+no('此方案健保限定第一線；已有全身性治療者不符合此路徑。').html);return stop(html+resultState('ok','可評估申請','符合無法切除、非上皮型惡性肋膜間皮瘤第一線路徑的初步條件。',[card('Ipilimumab＋Nivolumab',{indication:'無法切除、非上皮型惡性肋膜間皮瘤第一線。',use:'合併治療（Combination therapy）。',review:'事前審查；申請原因代碼 P111。申請時先輸入 ipilimumab 藥品代碼，再輸入 nivolumab 120 mg 藥品代碼。',warning:'已有此疾病全身性治療者不符合第一線條件。',paras:'900',ici:true})]).html)}
  function build(){let html=ask('cancer');if(!picked('cancer'))return {html};if(state.cancer==='other')return stop(html+resultState('quiet','請使用完整條文查詢','本選擇式系統目前以 NSCLC、SCLC 與惡性肋膜間皮瘤為主要範圍。其他胸腔腫瘤請改用完整健保給付規定查詢。',[]).html);if(state.cancer==='sclc'){const x=sclc();return {html:html+x.html,done:x.done}}if(state.cancer==='meso'){const x=meso();return {html:html+x.html,done:x.done}}html+=ask('nsclcStage');if(!picked('nsclcStage'))return {html};const x=state.nsclcStage==='resectable'?resectable():state.nsclcStage==='stage3'?stage3():metastatic();return {html:html+x.html,done:x.done}}

  function render(){history.length=0;const out=build();const temp=document.createElement('div');temp.innerHTML=out.html;const result=temp.querySelector('.result-area');if(result)result.remove();$('flow').innerHTML=temp.innerHTML;$('result').innerHTML=result?result.outerHTML:'';document.querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>choose(b.dataset.key,b.dataset.value)));renderProgress();const has=history.some(x=>picked(x.key));$('backBtn').disabled=!has;$('mobileBack').disabled=!has}
  function renderProgress(){$('progress').innerHTML=history.filter(x=>picked(x.key)).map(x=>`<button type="button" class="crumb" data-key="${x.key}">${label(x.key,state[x.key])}</button>`).join('');document.querySelectorAll('.crumb').forEach(b=>b.addEventListener('click',()=>{clearAfter(b.dataset.key);delete state[b.dataset.key];save();render()}))}
  function back(){const answered=history.filter(x=>picked(x.key));const last=answered.at(-1);if(!last)return;delete state[last.key];save();render()}
  function reset(){for(const k of Object.keys(state))delete state[k];sessionStorage.removeItem(STORAGE);render();window.scrollTo({top:0,behavior:'smooth'})}
  $('backBtn').onclick=$('mobileBack').onclick=back;$('resetBtn').onclick=$('mobileReset').onclick=reset;render();
})();
